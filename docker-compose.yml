services:
  thira-command:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      SALUS_DB_PATH: /app/data/thira.db
    volumes:
      - thira_data:/app/data
      - thira_attachments:/app/attachments
      - thira_backups:/app/backups
    restart: unless-stopped
volumes:
  thira_data:
  thira_attachments:
  thira_backups:
