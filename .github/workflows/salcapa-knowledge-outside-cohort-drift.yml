          assert actual==expected,'activation binding mismatch'
          for path,checksum in expected['source_sha256'].items():
              assert hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()==checksum,'source binding mismatch'
          for binding in expected['authority_rows']:
              rows=[line for line in pathlib.Path(binding['path']).read_text().splitlines() if line.startswith('|') and binding['needle'] in line]
              assert len(rows)==1 and hashlib.sha256(rows[0].encode()).hexdigest()==binding['sha256'],'authority binding mismatch'
          from tools.knowledge_outside_cohort_drift_payload import bundle
          assert bundle(pathlib.Path('.'))[1]==expected['payload_sha256'],'payload binding mismatch'
          PY
      - uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Submit once and monitor bounded read-only reconciliation
        id: execute
        continue-on-error: true
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          test "$RESOURCE_GROUP" = "rg-salcapa-dev"
          echo "INVENTORY_RECOVERY_PHASE=runtime_precheck"
          ACTIVATION=deploy/azure/activations/knowledge-outside-cohort-drift-20261116.json
          EXPECTED_IMAGE="$(jq -er '.execution_image_digest' "$ACTIVATION")"
          EXPECTED_RUNTIME="$(jq -er '.expected_runtime_image_digest' "$ACTIVATION")"
          test "$(jq -r '.source_release' "$ACTIVATION")" = "release/v3.276"
          SOURCE_COMMIT="$(jq -er '.source_commit' "$ACTIVATION")"
          test "$SOURCE_COMMIT" = "7b79b2845aaa6e2bf738e0c115c10b73e4c97dd3"
          test "$EXPECTED_IMAGE" = "salcapadevb48224acr.azurecr.io/salcapa@sha256:550cd447b280c83594a70d541d757c91ee3b3ff4833ce9a1713279e6cdc6d944"
          test "$EXPECTED_RUNTIME" = "salcapadevb48224acr.azurecr.io/salcapa@sha256:8f5823ef53d08eaa319f8073b00b6d817ab3db5e07b8f55c0dffb72868cd580c"
          az containerapp show --resource-group "$RESOURCE_GROUP" --name salcapa-dev-b48224 --output json > /tmp/salcapa-consideration-app.json
          az containerapp job show --resource-group "$RESOURCE_GROUP" --name salcapa-dev-b48224-kb-scan --output json > /tmp/salcapa-consideration-worker.json
          test "$(jq -r '.properties.template.containers[0].image' /tmp/salcapa-consideration-app.json)" = "$EXPECTED_RUNTIME"
          test "$(jq -r '.properties.template.containers[0].image' /tmp/salcapa-consideration-worker.json)" = "$EXPECTED_RUNTIME"
          # Compare identical pinned ARM schemas; suppress no fields.
          for kind in app worker; do
            RESOURCE_ID="$(jq -er '.id' "/tmp/salcapa-consideration-$kind.json")"
            az rest --method get --url "https://management.azure.com${RESOURCE_ID}?api-version=2025-07-01" --output json > "/tmp/recovery-$kind-before.json"
          done
          env_value() {
            jq -r --arg name "$1" 'first(.properties.template.containers[0].env[] | select(.name == $name) | .value)' /tmp/salcapa-consideration-worker.json
          }
          test "$(env_value SALUS_DB_BACKEND)" = "postgres"
          test "$(env_value SALUS_POSTGRES_AUTH)" = "entra"
          IDENTITY_ID="$(az identity show --resource-group "$RESOURCE_GROUP" --name salcapa-dev-b48224-identity --query id --output tsv --only-show-errors)"
          IDENTITY_CLIENT_ID="$(az identity show --resource-group "$RESOURCE_GROUP" --name salcapa-dev-b48224-identity --query clientId --output tsv --only-show-errors)"
          ENVIRONMENT_ID="$(az containerapp env show --resource-group "$RESOURCE_GROUP" --name salcapa-dev-b48224-aca-env --query id --output tsv --only-show-errors)"
          REGISTRY_SERVER="$(az acr show --resource-group "$RESOURCE_GROUP" --name salcapadevb48224acr --query loginServer --output tsv --only-show-errors)"
          test "$(az acr repository show --name salcapadevb48224acr --image "salcapa@${EXPECTED_IMAGE##*@}" --query digest --output tsv --only-show-errors)" = "${EXPECTED_IMAGE##*@}"
          JOB_NAME=salcapa-outdrift-b48224
          test "$(az containerapp job list --resource-group "$RESOURCE_GROUP" --query "[?name == '$JOB_NAME'] | length(@)" --output tsv --only-show-errors)" = "0"
          echo "TASK_JOB_NAMESPACE_CLEAR=1" >> "$GITHUB_ENV"
          SCRIPT_B64="$(python tools/knowledge_outside_cohort_drift_payload.py)"
          PAYLOAD_SHA="$(python tools/knowledge_outside_cohort_drift_payload.py --sha256)"
          echo "INVENTORY_RECOVERY_PHASE=deployment_submit"
          az deployment group create --no-wait \
            --name "salcapa-consideration-readback-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/azure/knowledge-outside-cohort-drift-job.bicep \
            --parameters environmentId="$ENVIRONMENT_ID" identityId="$IDENTITY_ID" \
              registryServer="$REGISTRY_SERVER" imageDigest="$EXPECTED_IMAGE" \
              managedIdentityClientId="$IDENTITY_CLIENT_ID" \
              tenantId="$(env_value SALUS_OIDC_TENANT_ID)" \
              applicationClientId="$(env_value SALUS_OIDC_CLIENT_ID)" \
              driveId="$(env_value SALUS_M365_INTAKE_DRIVE_ID)" \
              folderItemId="$(env_value SALUS_M365_INTAKE_FOLDER_ITEM_ID)" \
              postgresHost="$(env_value SALUS_POSTGRES_HOST)" \
              postgresDatabase="$(env_value SALUS_POSTGRES_DATABASE)" \
              postgresUser="$(env_value SALUS_POSTGRES_USER)" \
              postgresSslMode="$(env_value SALUS_POSTGRES_SSLMODE)" \
              scriptsBase64="$SCRIPT_B64" payloadSha256="$PAYLOAD_SHA" \
              phaseRunId="$GITHUB_RUN_ID" phaseScriptSha256="$(jq -r '.source_sha256["tools/live_knowledge_outside_cohort_drift.py"]' "$ACTIVATION")" \
            --output none --only-show-errors
          SUBSCRIPTION_ID="$(az account show --query id --output tsv --only-show-errors)"
          DEPLOYMENT_ID="/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.Resources/deployments/salcapa-consideration-readback-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "INVENTORY_RECOVERY_PHASE=deployment_poll"
          python tools/knowledge_inventory_azure_transport.py wait-deployment --url "https://management.azure.com${DEPLOYMENT_ID}?api-version=2022-09-01" --seconds 600 --output /tmp/recovery-deployment.json
          JOB_NAME=salcapa-outdrift-b48224
          JOB_ID="/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.App/jobs/$JOB_NAME"
          echo "INVENTORY_RECOVERY_PHASE=job_start"
          TASK_JOB_DEADLINE=$(( $(date +%s) + 960 ))
          echo "TASK_JOB_DEADLINE=$TASK_JOB_DEADLINE" >> "$GITHUB_ENV"
          az containerapp job start --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" --output json --only-show-errors > /tmp/recovery-start.json
          EXECUTION_NAME="$(jq -er '.name' /tmp/recovery-start.json)"
          test -n "$EXECUTION_NAME"
          case "$EXECUTION_NAME" in *[!a-z0-9-]*) exit 1;; esac
          echo "TASK_JOB_EXECUTION_NAME=$EXECUTION_NAME" >> "$GITHUB_ENV"
          echo "INVENTORY_RECOVERY_PHASE=execution_poll"
          REMAINING=$((TASK_JOB_DEADLINE - $(date +%s)))
          if [ "$REMAINING" -lt 1 ]; then REMAINING=1; fi
          python tools/knowledge_inventory_azure_transport.py wait-execution --url "https://management.azure.com${JOB_ID}/executions/${EXECUTION_NAME}?api-version=2026-07-01" --seconds "$REMAINING" --output /tmp/recovery-platform-execution.json
      - name: Collect terminal proof before cleanup
        if: always()
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          echo "INVENTORY_RECOVERY_PHASE=terminal_readback"
          echo "INVENTORY_RECOVERY_EXECUTION_STEP_OUTCOME=${{ steps.execute.outcome }}"
          if [ "${TASK_JOB_NAMESPACE_CLEAR:-0}" != "1" ]; then echo "INVENTORY_RECOVERY_NO_RESERVED_NAMESPACE=1"; exit 1; fi
          JOB_NAME=salcapa-outdrift-b48224
          SUBSCRIPTION_ID="$(az account show --query id --output tsv --only-show-errors)"
          JOB_ID="/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.App/jobs/$JOB_NAME"
          TRANSPORT=tools/knowledge_inventory_azure_transport.py
          python "$TRANSPORT" get --url "https://management.azure.com${JOB_ID}?api-version=2025-07-01" --output /tmp/recovery-owned-job.json
          test "$(jq -r '.tags.salusTaskKey' /tmp/recovery-owned-job.json)" = "salus-outside-cohort-drift-reconciliation-20261116"
          test "$(jq -r '.properties.template.containers[0].image' /tmp/recovery-owned-job.json)" = "salcapadevb48224acr.azurecr.io/salcapa@sha256:550cd447b280c83594a70d541d757c91ee3b3ff4833ce9a1713279e6cdc6d944"
          EXECUTION_NAME="${TASK_JOB_EXECUTION_NAME:-}"
          if [ -z "$EXECUTION_NAME" ]; then
            python "$TRANSPORT" discover --url "https://management.azure.com${JOB_ID}/executions?api-version=2026-07-01" --output /tmp/recovery-execution-name.txt
            EXECUTION_NAME="$(cat /tmp/recovery-execution-name.txt)"
          fi
          test -n "$EXECUTION_NAME"
          case "$EXECUTION_NAME" in *[!a-z0-9-]*) exit 1;; esac
          if [ -n "${TASK_JOB_DEADLINE:-}" ]; then
            REMAINING=$((TASK_JOB_DEADLINE - $(date +%s)))
          else
            REMAINING=1
          fi
          if [ "$REMAINING" -lt 1 ]; then REMAINING=1; fi
          if [ "$REMAINING" -gt 960 ]; then REMAINING=960; fi
          WAIT_EXIT=0
          python "$TRANSPORT" wait-execution --url "https://management.azure.com${JOB_ID}/executions/${EXECUTION_NAME}?api-version=2026-07-01" --seconds "$REMAINING" --output /tmp/recovery-platform-execution.json || WAIT_EXIT=$?
          echo "INVENTORY_RECOVERY_FINAL_WAIT_EXIT=$WAIT_EXIT"
          if [ -f /tmp/recovery-platform-execution.json ]; then
            python tools/knowledge_job_execution_diagnostic.py /tmp/recovery-platform-execution.json || echo "INVENTORY_RECOVERY_PLATFORM_DIAGNOSTIC_UNAVAILABLE=1"
          fi
          echo "INVENTORY_RECOVERY_PHASE=console_log"
          LOG_EXIT=0
          az containerapp job logs show --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" --execution "$EXECUTION_NAME" --container salcapa-outdrift --tail 300 --format text --only-show-errors > /tmp/task-knowledge-search.log 2>&1 || LOG_EXIT=$?
          echo "TASK_KNOWLEDGE_LOG_FETCH_EXIT=$LOG_EXIT"
          grep -E '^.*(TASK_KNOWLEDGE|BASELINE|STABILITY|POSTSEARCH|RECOVERY|REMEDIATION|PREFLIGHT|BLOCKER|INVENTORY_RECON|OUTSIDE_COHORT|OUTSIDE_DRIFT)_[A-Z0-9_]+=.*$' /tmp/task-knowledge-search.log || true
          test "$LOG_EXIT" = "0"
          python tools/validate_knowledge_outside_cohort_drift.py --verify-log /tmp/task-knowledge-search.log
          test "$WAIT_EXIT" = "0"
          python - <<'PY'
          import json
          from tools.knowledge_job_execution_diagnostic import summarize
          with open('/tmp/recovery-platform-execution.json',encoding='utf-8') as stream:result=summarize(json.load(stream))
          assert result['STATUS']=='Succeeded' and result['EXIT_CODES']=='0' and result['OOM_EXPLICIT']==0 and result['CONTAINERS']==1
          PY
          echo "INVENTORY_RECOVERY_TERMINAL_COLLECTION_VERIFIED=1"
      - name: Remove and verify isolated task-search job
        if: always()
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          JOB_NAME=salcapa-outdrift-b48224
          if [ "${TASK_JOB_NAMESPACE_CLEAR:-0}" != "1" ]; then exit 0; fi
          az account show --only-show-errors >/dev/null
          echo "INVENTORY_RECOVERY_PHASE=cleanup"
          RUNTIME_OK=1
          if (
            set -euo pipefail
            python tools/knowledge_inventory_azure_transport.py get --url "https://management.azure.com$(jq -er '.id' /tmp/recovery-app-before.json)?api-version=2025-07-01" --output /tmp/task-search-app-after.json
            python tools/knowledge_inventory_azure_transport.py get --url "https://management.azure.com$(jq -er '.id' /tmp/recovery-worker-before.json)?api-version=2025-07-01" --output /tmp/task-search-worker-after.json
            for pair in "recovery-app-before task-search-app-after" "recovery-worker-before task-search-worker-after"; do
              read -r before after <<< "$pair"
              jq -S '{identity, template: .properties.template, configuration: .properties.configuration}' "/tmp/$before.json" > /tmp/task-search-before.json
              jq -S '{identity, template: .properties.template, configuration: .properties.configuration}' "/tmp/$after.json" > /tmp/task-search-after.json
              cmp /tmp/task-search-before.json /tmp/task-search-after.json
            done
          ); then
            echo "TASK_KNOWLEDGE_APPLICATION_AND_WORKER_UNCHANGED=1"
          else
            RUNTIME_OK=0
            echo "TASK_KNOWLEDGE_APPLICATION_AND_WORKER_UNCHANGED=0"
          fi
          SUBSCRIPTION_ID="$(az account show --query id --output tsv --only-show-errors)"
          JOB_ID="/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.App/jobs/$JOB_NAME"
          python tools/knowledge_inventory_azure_transport.py get --url "https://management.azure.com${JOB_ID}?api-version=2025-07-01" --allow-missing --output /tmp/task-search-cleanup.json
          if jq -e 'type == "object"' /tmp/task-search-cleanup.json > /dev/null; then
            test "$(jq -r '.tags.salusTaskKey' /tmp/task-search-cleanup.json)" = "salus-outside-cohort-drift-reconciliation-20261116"
            test "$(jq -r '.properties.template.containers[0].image' /tmp/task-search-cleanup.json)" = "salcapadevb48224acr.azurecr.io/salcapa@sha256:550cd447b280c83594a70d541d757c91ee3b3ff4833ce9a1713279e6cdc6d944"
            az containerapp job delete --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" --yes --only-show-errors
          fi
          python tools/knowledge_inventory_azure_transport.py absent --url "https://management.azure.com/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.App/jobs?api-version=2025-07-01" --name "$JOB_NAME"
          echo "TASK_KNOWLEDGE_ISOLATED_JOB_REMOVED=1"
          test "$RUNTIME_OK" = "1"
