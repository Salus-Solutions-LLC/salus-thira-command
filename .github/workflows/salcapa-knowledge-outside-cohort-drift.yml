name: SalCAPA governed bounded outside-cohort drift reconciliation

on:
  pull_request:
    paths:
      - 'tools/live_knowledge_outside_cohort_drift.py'
      - 'tools/knowledge_outside_cohort_drift_payload.py'
      - 'tools/validate_knowledge_outside_cohort_drift.py'
      - '.github/workflows/salcapa-knowledge-outside-cohort-drift.yml'
      - 'deploy/azure/activations/knowledge-outside-cohort-drift-20261116.json'
      - 'infra/azure/knowledge-outside-cohort-drift-job.bicep'
      - 'tests/test_knowledge_outside_cohort_drift.py'
      - 'docs/knowledge-outside-cohort-drift-20261116.md'
      - 'CURRENT_HANDOFF.md'
      - 'APPROVED_ARTIFACTS.md'
      - 'governance/charter_task_requirements_register.json'
      - 'tools/live_knowledge_postsearch_resume.py'
      - 'tools/live_knowledge_baseline_proposal.py'
      - 'tools/live_knowledge_streamed_recovery_plan.py'
      - 'tools/live_knowledge_remediation_proposals.py'
      - 'tools/knowledge_job_execution_diagnostic.py'
      - 'tools/live_knowledge_preflight_blockers.py'
      - 'tools/live_knowledge_inventory_reconciliation.py'
      - 'tools/knowledge_inventory_payload.py'
      - 'tools/validate_knowledge_inventory.py'
      - 'tools/knowledge_inventory_azure_transport.py'
      - 'tools/validate_knowledge_inventory_recovery.py'
      - 'tools/live_knowledge_outside_cohort.py'
      - 'tools/knowledge_outside_cohort_payload.py'
      - 'tools/validate_knowledge_outside_cohort.py'
  push:
    branches: [development/salcapa-platform]
    paths:
      - 'deploy/azure/activations/knowledge-outside-cohort-drift-20261116.json'

concurrency:
  group: salcapa-knowledge-diagnostic
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python -m pip install -r requirements.txt pytest==8.4.2 PyYAML==6.0.2
      - run: python -m pytest -q -p no:cacheprovider tests/test_knowledge_inventory_reconciliation.py tests/test_knowledge_inventory_azure_transport.py tests/test_knowledge_outside_cohort.py tests/test_knowledge_outside_cohort_drift.py
      - name: Validate actual guard, payload bootstrap and shell syntax
        run: python tools/validate_knowledge_outside_cohort_drift.py
      - run: az bicep build --file infra/azure/knowledge-outside-cohort-drift-job.bicep --stdout > /tmp/knowledge-task-search.json


  postgres_postsearch_plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postsearch_plan
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postsearch_plan"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SALUS_DB_BACKEND: postgres
      SALUS_POSTGRES_AUTH: dsn
      SALUS_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postsearch_plan # repo-hygiene: allow - localhost-only ephemeral PostgreSQL CI fixture
      TEST_POSTSEARCH_POSTGRES: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest==8.4.2
      - run: python -m pytest -q -p no:cacheprovider tests/test_knowledge_inventory_reconciliation.py tests/test_knowledge_inventory_azure_transport.py tests/test_knowledge_outside_cohort.py tests/test_knowledge_outside_cohort_drift.py

  authorize_scoped:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: salcapa-dev-approval
    permissions: {}
    steps:
      - run: echo "Protected task-specific Knowledge consideration gate passed."

  task_search:
    needs: authorize_scoped
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate exact task and script
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          python - <<'PY'
