69f2b11b3a4b3"}], "payload_sha256": "1d5ff6fb3f01c965b51cd19f2cf9de985aaa432e5b295baaefe17b5a97f18cc9", "target_environment": "dev", "resource_group": "rg-salcapa-dev", "source_release": "release/v3.276", "source_commit": "7b79b2845aaa6e2bf738e0c115c10b73e4c97dd3", "execution_image_digest": "salcapadevb48224acr.azurecr.io/salcapa@sha256:550cd447b280c83594a70d541d757c91ee3b3ff4833ce9a1713279e6cdc6d944", "expected_runtime_image_digest": "salcapadevb48224acr.azurecr.io/salcapa@sha256:8f5823ef53d08eaa319f8073b00b6d817ab3db5e07b8f55c0dffb72868cd580c", "preserved_receipt_count": 20, "new_search_receipt_count": 0, "query_count": 4, "minimum_physical_boundary": 23747, "maximum_inventory_observations": 4, "maximum_candidate_refresh_sources": 0, "maximum_parent_batch_sources": 50, "baseline_member_page_size": 100, "max_execution_seconds": 900, "execution_cpu": "0.5", "execution_memory": "1Gi", "maximum_observed_peak_rss_kib": 786432, "maximum_decompressed_payload_bytes": 262144, "maximum_output_payload_bytes": 131072, "diagnostic_api_version": "2026-07-01", "new_search_receipts_authorized": false, "parent_plan_writes_authorized": false, "baseline_writes_authorized": false, "source_record_or_schema_changes_authorized": false, "automatic_processing_authorized": false, "retry_resume_authorized": false, "hold_release_authorized": false, "source_content_downloads_authorized": false, "protected_member_access": false, "assignment_or_release_authority": false, "production_deployment_authorized": false, "input_operation_key": "salus-recovery-remediation-proposals-20261115", "input_manifest_sha256": "d68b22cc0eca5655dee804dd3f8e2d511c4cded9d0643d1a2ab2cb829e1a2c85", "input_verified_run_id": 43806961206, "input_source_commit": "ef040699009b8e737328c91608cd940c3ad437a6", "remediation_input_writes_authorized": false, "preflight_execution_authorized": false, "review_operation_key": "salus-remediation-review-preflight-proposals-20261116", "review_manifest_sha256": "48b56aa85a3098946d9c75042b64c481941a6d8c290e2ed3a42eefeb41ac8638", "review_verified_run_id": 43913493719, "review_source_commit": "7c8c9f2c997107aa1a3c64a5627c210526e2e992", "eligibility_diagnostic_schema_authorized": false, "diagnostic_and_resolution_proposals_authorized": false, "review_input_writes_authorized": false, "existing_eligibility_policy_changed": false, "method_adoption_authorized": false, "database_writes_authorized": false, "read_only_reconciliation_authorized": true, "maximum_source_differences": 100, "statement_timeout_seconds": 120, "historical_baseline_inventory_sha256": "0e556598be30292cc1bbb2e46bb964b2e6e6f5e38f0b3b5e93b48a7cc68bc613", "failed_final_inventory_sha256": "efd10c4ed8793e808d79076f57074afedc549d315985fe6f4dea98f1196e3621", "failed_diagnostic_operation_key": "salus-preflight-blocker-diagnostic-20261116", "failed_diagnostic_run_id": 43925327558, "failed_diagnostic_source_commit": "a6bde5bd842bb6618d0c975d06c4f5ef4147a823", "reconciliation_operation_key": "salus-outside-cohort-drift-reconciliation-20261116", "prior_transport_run_id": 43935027835, "maximum_arm_get_attempts": 5, "maximum_arm_get_budget_seconds": 120, "maximum_arm_response_bytes": 8388608, "maximum_deployment_wait_seconds": 600, "maximum_execution_wait_seconds": 960, "automatic_deployment_submit_retries": 0, "automatic_job_start_retries": 0, "always_collect_before_cleanup": true, "respect_retry_after_within_budget": true, "prior_verified_run_id": 43941369222, "prior_verified_inventory_sha256": "25a11e7d0956a2178d6033a3687e1a1a185873d7e5ade9550a60dae09b40b8ab", "prior_source_differences_sha256": "27aba8f05af10eae2f5b50ac6b930be179c9fe552f8c245751aecf35f6a91664", "prior_preserved_receipts_sha256": "21c4bcd816686d4178c32bf224228c13639aa56a8225cf0cd3219af6fab0cd1f", "prior_protected_checkpoints_sha256": "214f2756ca0bc179bfaed880480113b5cd31cecd9de0e803e03013bcd4872ac7", "prior_failed_scope_run_id": 43950711805, "minimum_outside_unresolved_sources": 0, "maximum_outside_unresolved_sources": 10, "maximum_current_physical_sources": 23847, "maximum_current_represented_sources": 23857, "observed_failed_scope_physical_sources": 23761, "observed_failed_scope_inventory_sha256": "21c38c65316510448de249d3b3401f2129ca6366d3327608485333bea3166003", "historical_two_unresolved_identity_assignment_verified": false}')
