name: CodeQL
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '17 6 * * 1'
permissions:
  security-events: write
  packages: read
  actions: read
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python,javascript-typescript
      - name: Reconstruct archived source when needed
        run: |
          if [ ! -f app.py ] && [ -f tools/reconstruct_v07_source.py ]; then python tools/reconstruct_v07_source.py; fi
      - uses: github/codeql-action/analyze@v4
