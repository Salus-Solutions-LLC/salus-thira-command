name: CodeQL Local Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Reconstruct and verify archived source
        run: |
          if [ ! -f app.py ] && [ -f tools/reconstruct_v13_source.py ]; then python tools/reconstruct_v13_source.py; fi
          python tools/verify_v13_source.py
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: python
      - name: Analyze Python with CodeQL locally
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          output: codeql-results
          upload: never
      - name: Enforce CodeQL findings gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path('codeql-results').glob('*.sarif'))
          if not files:
              raise SystemExit('No CodeQL SARIF output was produced')
          findings = []
          for path in files:
              data = json.loads(path.read_text(encoding='utf-8'))
              for run in data.get('runs', []):
                  rules = {}
                  driver = run.get('tool', {}).get('driver', {})
                  for rule in driver.get('rules', []) or []:
                      rules[rule.get('id')] = rule
                  for result in run.get('results', []) or []:
                      findings.append((path.name, result, rules.get(result.get('ruleId'), {})))
          print(f'CODEQL_FINDINGS={len(findings)}')
          for filename, result, rule in findings:
              rule_id = result.get('ruleId', 'unknown')
              level = result.get('level', 'warning')
              message = result.get('message', {}).get('text', '')
              print(f'{filename}: {level}: {rule_id}: {message}')
          if findings:
              raise SystemExit('CodeQL produced findings that require review')
          print('CODEQL_LOCAL_ANALYSIS_PASS')
          PY
      - name: Preserve CodeQL SARIF
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codeql-sarif
          path: codeql-results
          if-no-files-found: error
          retention-days: 14
