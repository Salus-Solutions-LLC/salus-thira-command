name: Protection Advisor performance telemetry acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - development/salcapa-platform
    paths:
      - '.github/workflows/protection-advisor-performance-acceptance.yml'

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate Azure target variables
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP; do
            test -n "${!name}" || { echo "Missing repository variable: $name" >&2; exit 1; }
          done
          test "$AZURE_RESOURCE_GROUP" = "rg-salcapa-dev"

      - name: Azure login through workload identity federation
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify recent privacy-preserving page-load telemetry
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          APP=salcapa-dev-b48224-appinsights
          QUERY='traces | where timestamp > ago(60m) | where message has "\"event_type\":\"protection_advisor_page_load\"" | project timestamp, message | order by timestamp desc | take 20'
          FOUND=false
          for attempt in $(seq 1 12); do
            az monitor app-insights query --resource-group "$RESOURCE_GROUP" --app "$APP" --analytics-query "$QUERY" --output json > /tmp/query.json
            ROWS="$(jq '.tables[0].rows | length' /tmp/query.json)"
            if [ "$ROWS" -gt 0 ]; then
              FOUND=true
              break
            fi
            sleep 15
          done
          test "$FOUND" = "true"
          jq -r '.tables[0].rows[0][1]' /tmp/query.json > /tmp/event.json
          jq -e '
            .event_type == "protection_advisor_page_load" and
            .severity == "Info" and
            (.duration_ms | type == "number" and . >= 0 and . <= 120000) and
            (.navigation_type | IN("navigate","reload","back_forward","prerender","unknown")) and
            .embedded == true and
            ((keys - ["duration_ms","embedded","event_type","navigation_type","severity","ts"]) | length == 0)
          ' /tmp/event.json >/dev/null
          {
            echo "### Protection Advisor performance telemetry acceptance"
            echo ""
            echo "- Event: protection_advisor_page_load"
            echo "- Recent event observed: yes"
            echo "- Allowed fields only: yes"
            echo "- Direct identifiers present: no"
            echo "- Assessment answers present: no"
            echo "- Organization data present: no"
          } >> "$GITHUB_STEP_SUMMARY"
