name: SalCAPA v3.254 Level 1A scan log recovery

on:
  push:
    branches:
      - development/salcapa-platform
    paths:
      - '.github/workflows/azure-v3254-level1a-scan-log-recovery.yml'

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: salcapa-dev-approval
    permissions: {}
    steps:
      - run: echo 'Protected read-only completed-execution log recovery approved.'

  recover:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Confirm the already completed private execution
        env:
          EXPECTED_SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          EXPECTED_TENANT: ${{ vars.AZURE_TENANT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$EXPECTED_SUBSCRIPTION" = 076f90cd-cc6a-4547-a4ff-de3fc1825472
          test "$EXPECTED_TENANT" = e06fd260-a201-44da-b03b-9cde7e119d04
          test "$(az account show --query id -o tsv)" = "$EXPECTED_SUBSCRIPTION"
          test "$(az account show --query tenantId -o tsv)" = "$EXPECTED_TENANT"
          az containerapp job execution show -g rg-salcapa-dev -n salcapa-dev-b48224-scan-worker --job-execution-name salcapa-dev-b48224-scan-worker-5deaqfx -o json > "$RUNNER_TEMP/execution.json"
          jq -e '.name == "salcapa-dev-b48224-scan-worker-5deaqfx" and .properties.status == "Succeeded"' "$RUNNER_TEMP/execution.json" > /dev/null
          echo 'existing_private_readback_execution=Succeeded'
      - name: Recover only whitelisted result fields from Azure logs
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(az monitor log-analytics workspace show -g rg-salcapa-dev -n salcapa-dev-b48224-logs --query customerId -o tsv)"
          test -n "$workspace"
          query="ContainerAppConsoleLogs | where TimeGenerated between(datetime(2026-10-23T04:33:39Z)..datetime(2026-10-23T04:36:00Z)) | where JobName == 'salcapa-dev-b48224-scan-worker' | where Log contains 'level1a_scan_readback=' | project Log | take 20"
          az monitor log-analytics query --workspace "$workspace" --analytics-query "$query" -o json > "$RUNNER_TEMP/readback-logs.json"
          python - "$RUNNER_TEMP/readback-logs.json" <<'PY'
          import json,sys
          value=json.load(open(sys.argv[1],encoding='utf-8'))
          if isinstance(value,list):
              rows=value
          elif isinstance(value,dict) and 'tables' in value:
              table=(value.get('tables') or [{}])[0]
              cols=[x.get('name') for x in table.get('columns',[])]
              rows=[dict(zip(cols,row)) for row in table.get('rows',[])]
          elif isinstance(value,dict):
              rows=value.get('value') or []
          else:
              rows=[]
          if len(rows)>20:
              raise SystemExit('Bounded Azure log result exceeded limit')
          safe=[]
          for row in rows:
              raw=row.get('Log') if isinstance(row,dict) else None
              if not isinstance(raw,str) or len(raw)>4096: continue
              marker='level1a_scan_readback='
              if marker not in raw: continue
              try: result=json.loads(raw.split(marker,1)[1])
              except (ValueError,json.JSONDecodeError): continue
              if not (result.get('pending_row_count')==1
                      and result.get('promoted_copy_count') in (0,1)
                      and result.get('status') in ('Pending','Promoted','Malicious','Unscanned','Reconcile','Other')
                      and all(type(result.get(key)) is bool for key in
                          ('event_recorded','promoted_linked','promoted_private_hash_verified'))):
                  continue
              safe.append(result)
          print('bounded_log_row_count='+str(len(rows)))
          print('qualified_readback_marker_count='+str(len(safe)))
          if len(safe)!=1:
              raise SystemExit('Existing exact readback marker unavailable or ambiguous')
          result=safe[0]
          for key in ('status','pending_row_count','promoted_copy_count','event_recorded',
                      'promoted_linked','promoted_private_hash_verified'):
              print(key+'='+str(result[key]))
          PY
          echo 'No new job, document read, queue consumption or Azure setting change occurred.'
