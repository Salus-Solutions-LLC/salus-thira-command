name: Azure infrastructure validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/azure/**'
      - 'docs/AZURE_*.md'
      - 'deploy/AZURE_BACKUP_RESTORE_RUNBOOK.md'
      - '.github/workflows/azure-infrastructure-validate.yml'
      - '.github/workflows/azure-production-deploy.yml'
  push:
    branches:
      - 'development/**'
    paths:
      - 'infra/azure/**'
      - 'docs/AZURE_*.md'
      - 'deploy/AZURE_BACKUP_RESTORE_RUNBOOK.md'
      - '.github/workflows/azure-infrastructure-validate.yml'
      - '.github/workflows/azure-production-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-infra-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile Bicep without Azure credentials
        run: az bicep build --file infra/azure/main.bicep --stdout > /tmp/salcapa-arm.json
      - name: Enforce infrastructure and deployment policy
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          infrastructure = '\n'.join(
              p.read_text() for p in Path('infra/azure').glob('*') if p.is_file()
          )
          forbidden = [
              r'DOCKER\|[^\n]+:latest',
              r'AccountKey=',
              r'client_secret\s*[=:]\s*["\'][^"\']+',
          ]
          if any(re.search(pattern, infrastructure, re.IGNORECASE) for pattern in forbidden):
              raise SystemExit('Azure infrastructure contains a mutable image or secret material')

          workflow = Path('.github/workflows/azure-production-deploy.yml').read_text()
          required = [
              'workflow_dispatch:',
              'id-token: write',
              'environment: salcapa-',
              '-approval',
              'refs/heads/development/salcapa-platform',
              'MD-APPROVAL-',
              '@sha256:',
              'az deployment group what-if',
          ]
          missing = [value for value in required if value not in workflow]
          if missing:
              raise SystemExit('Azure deployment guardrails are incomplete')
          if re.search(r'^  (push|pull_request|schedule):', workflow, re.MULTILINE):
              raise SystemExit('Azure deployment must remain manual')
          if not re.search(r'uses: azure/login@[0-9a-f]{40}\b', workflow):
              raise SystemExit('Azure login action must be pinned to a commit SHA')

          cost = Path('docs/AZURE_COST_AND_APPROVAL.md').read_text()
          for value in ('Option A', 'Option B', 'Proposed monthly authorization ceiling', 'No Azure resource'):
              if value not in cost:
                  raise SystemExit('Azure cost and approval record is incomplete')
          print('AZURE_INFRA_POLICY_PASS')
          PY
