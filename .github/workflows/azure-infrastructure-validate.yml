name: Azure infrastructure validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/azure/**'
      - 'docs/AZURE_*.md'
      - 'docs/RELEASE_NOTES_v3.*.md'
      - 'source_archives/v3.25/**'
      - 'source_archives/v3.42/**'
      - 'tools/reconstruct_v325_source.py'
      - 'tools/verify_v325_source.py'
      - 'tools/reconstruct_v342_source.py'
      - 'tools/verify_v342_source.py'
      - 'tools/ci_passwordless_runtime_smoke.py'
      - 'tools/validate_live_readiness.py'
      - 'deploy/AZURE_BACKUP_RESTORE_RUNBOOK.md'
      - '.github/workflows/azure-infrastructure-validate.yml'
      - '.github/workflows/azure-production-deploy.yml'
      - '.github/workflows/azure-connection-verify.yml'
      - '.github/workflows/azure-foundation-activate.yml'
      - '.github/workflows/azure-image-publish.yml'
      - '.github/workflows/azure-database-bootstrap.yml'
      - '.github/workflows/azure-application-deploy.yml'
      - '.github/workflows/azure-recovery-readiness.yml'
      - 'deploy/azure/activations/foundation-dev.json'
      - 'deploy/azure/activations/image-dev.json'
      - 'deploy/azure/activations/database-dev.json'
      - 'deploy/azure/activations/application-dev.json'
      - 'deploy/azure/activations/recovery-readiness-dev.json'
  push:
    branches:
      - 'development/**'
      - 'candidate/**'
    paths:
      - 'docs/build-continuity.md'
      - 'docs/salcapa-handwriting-expanded-ocr-design.md'
      - 'infra/azure/**'
      - 'docs/AZURE_*.md'
      - 'docs/RELEASE_NOTES_v3.*.md'
      - 'source_archives/v3.25/**'
      - 'source_archives/v3.42/**'
      - 'tools/reconstruct_v325_source.py'
      - 'tools/verify_v325_source.py'
      - 'tools/reconstruct_v342_source.py'
      - 'tools/verify_v342_source.py'
      - 'tools/ci_passwordless_runtime_smoke.py'
      - 'tools/validate_live_readiness.py'
      - 'deploy/AZURE_BACKUP_RESTORE_RUNBOOK.md'
      - '.github/workflows/azure-infrastructure-validate.yml'
      - '.github/workflows/azure-production-deploy.yml'
      - '.github/workflows/azure-connection-verify.yml'
      - '.github/workflows/azure-foundation-activate.yml'
      - '.github/workflows/azure-image-publish.yml'
      - '.github/workflows/azure-database-bootstrap.yml'
      - '.github/workflows/azure-application-deploy.yml'
      - '.github/workflows/azure-recovery-readiness.yml'
      - 'deploy/azure/activations/foundation-dev.json'
      - 'deploy/azure/activations/image-dev.json'
      - 'deploy/azure/activations/database-dev.json'
      - 'deploy/azure/activations/application-dev.json'
      - 'deploy/azure/activations/recovery-readiness-dev.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-infra-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile Bicep without Azure credentials
        run: |
          az bicep build --file infra/azure/main.bicep --stdout > /tmp/salcapa-arm.json
          az bicep build --file infra/azure/database-bootstrap.bicep --stdout > /tmp/salcapa-database-bootstrap-arm.json
      - name: Enforce infrastructure and deployment policy
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          infrastructure = '\n'.join(
              p.read_text() for p in Path('infra/azure').glob('*') if p.is_file()
          )
          forbidden = [
              r'DOCKER\|[^\n]+:latest',
              r'AccountKey=',
              r'client_secret\s*[=:]\s*["\'][^"\']+',
              r"name:\s*'Standard_GRS'",
              r'Microsoft\.Web/serverfarms',
              r'Microsoft\.Web/sites',
              r'Standard_D2ds_v5',
              r'P0v3',
          ]
          if any(re.search(pattern, infrastructure, re.IGNORECASE) for pattern in forbidden):
              raise SystemExit('Azure infrastructure contains a forbidden cost, runtime, mutable-image, or secret pattern')

          infrastructure_required = [
              '@maxLength(6)',
              'Microsoft.ContainerRegistry/registries@2023-07-01',
              "name: 'Basic'",
              'adminUserEnabled: false',
              'Microsoft.ManagedIdentity/userAssignedIdentities@2023-01-31',
              'Microsoft.App/managedEnvironments@2025-01-01',
              "workloadProfileType: 'Consumption'",
              'Microsoft.App/containerApps@2025-01-01',
              'minReplicas: 0',
              'maxReplicas: 1',
              'Microsoft.DBforPostgreSQL/flexibleServers@2024-08-01',
              "name: 'Standard_B1ms'",
              "tier: 'Burstable'",
              "activeDirectoryAuth: 'Enabled'",
              "passwordAuth: 'Disabled'",
              "publicNetworkAccess: 'Disabled'",
              "version: '16'",
              'Microsoft.Network/privateDnsZones@2024-06-01',
              'registryPullRole',
              'deploymentRegistryPushRole',
              "name: 'Standard_LRS'",
              'isVersioningEnabled: true',
              "dailyQuotaGb: json('0.1')",
              'SamplingPercentage: 5',
              "param monthlyCostCeilingUsd int = 30",
              "param operationalBudgetUsd int = 25",
              "param entraRuntimeClientId string = ''",
              'param sourceCommit string',
              'sourceCommit: sourceCommit',
              'output federatedCredentialIssuer string',
              'output federatedCredentialSubject string',
              "output federatedCredentialAudience string = 'api://AzureADTokenExchange'",
              'output runtimeRedirectUri string',
              "name: 'SALUS_OIDC_CLIENT_AUTH_METHOD'",
              "value: 'managed_identity'",
              "name: 'SALUS_OIDC_MANAGED_IDENTITY_CLIENT_ID'",
              "name: 'AZURE_CLIENT_ID'",
              "name: 'SALUS_OIDC_DISCOVERY_URL'",
              "name: 'SALUS_OIDC_REDIRECT_URI'",
              "name: 'SALUS_OIDC_AUTO_PROVISION'",
              'Microsoft.Consumption/budgets@2023-11-01',
              "thresholdType: 'Actual'",
              "thresholdType: 'Forecasted'",
              'Actual80Percent',
              'Forecast100Percent',
              'Actual100Percent',
              'contactEmails:',
              "param approvalRecord string = 'MD-APPROVAL-AZURE-LEAN-20260904'",
          ]
          missing_infrastructure = [
              value for value in infrastructure_required if value not in infrastructure
          ]
          if missing_infrastructure:
              raise SystemExit(
                  'Azure lean infrastructure boundary is incomplete: '
                  + ', '.join(missing_infrastructure)
              )

          workflow = Path('.github/workflows/azure-production-deploy.yml').read_text()
          required = [
              'workflow_dispatch:',
              'Approved four-to-six-character globally unique resource suffix',
              "^[a-z0-9]{4,6}$",
              'id-token: write',
              'environment: salcapa-',
              '-approval',
              'refs/heads/development/salcapa-platform',
              'MD-APPROVAL-AZURE-LEAN-20260904',
              '@sha256:',
              'EXPECTED_REGISTRY=',
              'POSTGRES_ADMIN_OBJECT_ID',
              'POSTGRES_ADMIN_PRINCIPAL_NAME',
              'DEPLOYMENT_PRINCIPAL_OBJECT_ID',
              'ENTRA_RUNTIME_CLIENT_ID',
              'entraRuntimeClientId="$ENTRA_RUNTIME_CLIENT_ID"',
              'sourceCommit="$GITHUB_SHA"',
              'Deploy requires the exact non-secret ENTRA_RUNTIME_CLIENT_ID UUID after federation is configured.',
              'federatedCredentialIssuer.value',
              'federatedCredentialSubject.value',
              'federatedCredentialAudience.value == "api://AzureADTokenExchange"',
              'runtimeRedirectUri.value',
              'GITHUB_STEP_SUMMARY',
              'az deployment group what-if',
              'monthlyCostCeilingUsd=30',
              'operationalBudgetUsd=25',
              'budgetContactEmail="$AZURE_BUDGET_CONTACT_EMAIL"',
              'AZURE_BUDGET_CONTACT_EMAIL',
              'provisionApplication=true',
              'az containerapp update',
          ]
          missing = [value for value in required if value not in workflow]
          if missing:
              raise SystemExit('Azure deployment guardrails are incomplete: ' + ', '.join(missing))
          if re.search(r'^  (push|pull_request|schedule):', workflow, re.MULTILINE):
              raise SystemExit('Azure deployment must remain manual')
          foundation = workflow.split('\n  foundation:', 1)[1].split('\n  deploy:', 1)[0]
          deployment = workflow.split('\n  deploy:', 1)[1].split('\n  rollback:', 1)[0]
          if 'test -n "$ENTRA_RUNTIME_CLIENT_ID"' in foundation:
              raise SystemExit('Foundation must emit the managed identity before requiring the runtime client ID')
          if 'test -n "$ENTRA_RUNTIME_CLIENT_ID"' not in deployment:
              raise SystemExit('Application deployment must require the runtime client ID')
          if '--tags approvalRecord=' in workflow:
              raise SystemExit('Deployment metadata must be carried by governed Bicep resource tags')
          if not re.search(r'uses: azure/login@[0-9a-f]{40}\b', workflow):
              raise SystemExit('Azure login action must be pinned to a commit SHA')

          activation = Path('.github/workflows/azure-foundation-activate.yml').read_text()
          activation_required = [
              'push:',
              'development/salcapa-platform',
              "deploy/azure/activations/foundation-dev.json",
              'authorize:',
              'environment: salcapa-dev-approval',
              'permissions: {}',
              'needs: authorize',
              'id-token: write',
              'source_release == "release/v3.9"',
              '.source_commit | test("^[0-9a-f]{40}$")',
              'path: frozen-release',
              'git -C frozen-release rev-parse HEAD',
              'git merge-base --is-ancestor',
              'AZURE_RESOURCE_GROUP" = "rg-salcapa-dev"',
              'MD-APPROVAL-AZURE-LEAN-20260904',
              'monthly_cost_ceiling_usd == 30',
              'operational_budget_usd == 25',
              '.unique_suffix == "b48224"',
              'Microsoft.ContainerRegistry',
              'Microsoft.DBforPostgreSQL',
              'Microsoft.KeyVault',
              'Microsoft.ManagedIdentity',
              'Microsoft.Network',
              'Microsoft.OperationalInsights',
              'az provider show',
              'registrationState',
              'az deployment group what-if',
              '.changeType != "Delete"',
              'microsoft.app/containerapps',
              'az deployment group create',
              '.properties.provisioningState == "Succeeded"',
              'APP_COUNT=',
              'test "$APP_COUNT" = "0"',
              'GITHUB_STEP_SUMMARY',
          ]
          missing_activation = [
              value for value in activation_required if value not in activation
          ]
          if missing_activation:
              raise SystemExit(
                  'Azure approved foundation activation is incomplete: '
                  + ', '.join(missing_activation)
              )
          if re.search(r'^  (pull_request|workflow_dispatch|schedule):', activation, re.MULTILINE):
              raise SystemExit('Foundation activation may run only from the exact governed record push')
          if len(re.findall(r'uses: actions/checkout@[0-9a-f]{40}\b', activation)) < 2:
              raise SystemExit('Both foundation checkouts must be pinned to commit SHAs')
          if 'git fetch ' in activation:
              raise SystemExit('Foundation activation must not fetch after tokenless checkout')
          approval_gate = activation.split('\n  authorize:', 1)[1].split('\n  activate:', 1)[0]
          activation_job = activation.split('\n  activate:', 1)[1]
          if 'environment: salcapa-dev-approval' not in approval_gate:
              raise SystemExit('Protected environment must govern the authorization predecessor')
          if 'id-token: write' in approval_gate:
              raise SystemExit('Authorization predecessor must not receive an OIDC token')
          if 'needs: authorize' not in activation_job or 'id-token: write' not in activation_job:
              raise SystemExit('Azure execution must depend on approval and receive job-scoped OIDC')
          if 'environment:' in activation_job:
              raise SystemExit('Branch-bound OIDC execution must not change to an environment subject')
          if not re.search(r'uses: azure/login@[0-9a-f]{40}\b', activation):
              raise SystemExit('Foundation Azure login action must be pinned to a commit SHA')
          if 'AZURE_CLIENT_SECRET' in activation:
              raise SystemExit('Foundation activation may not use a long-lived client secret')
          if activation.index('az provider show') > activation.index('az deployment group what-if'):
              raise SystemExit('Provider readiness must run before foundation what-if')
          if activation.index('az provider show') > activation.index('az deployment group create'):
              raise SystemExit('Provider readiness must run before foundation deployment')


          image_publication = Path('.github/workflows/azure-image-publish.yml').read_text()
          image_publication_required = [
              'push:',
              'development/salcapa-platform',
              "deploy/azure/activations/image-dev.json",
              'authorize:',
              'environment: salcapa-dev-approval',
              'permissions: {}',
              'needs: authorize',
              'id-token: write',
              '.source_release | test("^release/v3\\\\.[0-9]+$")',
              '.activation_key | test("^salcapa-v3\\\\.[0-9]+-image-[0-9a-f]{8}$")',
              '.source_commit | test("^[0-9a-f]{40}$")',
              'EXPECTED_ACTIVATION_KEY="salcapa-${SOURCE_RELEASE#release/}-image-${SOURCE_COMMIT:0:8}"',
              'ref: ${{ steps.activation.outputs.source_release }}',
              'path: frozen-release',
              'git -C frozen-release rev-parse HEAD',
              'git merge-base --is-ancestor',
              'Frozen runtime release identity does not match activation',
              'ENTRA_RUNTIME_CLIENT_ID',
              'az acr show',
              'AcrPush',
              'az acr login',
              'docker build',
              'docker push',
              'source-$SOURCE_COMMIT',
              'org.opencontainers.image.revision=$SOURCE_COMMIT',
              'org.opencontainers.image.version=$RELEASE_VERSION',
              'EXPECTED_RELEASE_VERSION=$RELEASE_VERSION',
              'az acr manifest show-metadata',
              'SALCAPA_IMAGE_DIGEST=',
              'GITHUB_STEP_SUMMARY',
              'Mutable latest tag: not used',
              'Container App deployment: not performed',
          ]
          missing_image_publication = [
              value for value in image_publication_required if value not in image_publication
          ]
          if missing_image_publication:
              raise SystemExit(
                  'Azure immutable image publication is incomplete: '
                  + ', '.join(missing_image_publication)
              )
          if re.search(r'^  (pull_request|workflow_dispatch|schedule):', image_publication, re.MULTILINE):
              raise SystemExit('Image publication may run only from the exact governed record push')
          if len(re.findall(r'uses: actions/checkout@[0-9a-f]{40}\b', image_publication)) < 2:
              raise SystemExit('Both image-publication checkouts must be pinned to commit SHAs')
          if not re.search(r'uses: azure/login@[0-9a-f]{40}\b', image_publication):
              raise SystemExit('Image-publication Azure login action must be pinned to a commit SHA')
          if 'AZURE_CLIENT_SECRET' in image_publication or ':latest' in image_publication:
              raise SystemExit('Image publication may not use a client secret or mutable latest tag')
          if 'az deployment group create' in image_publication or 'az containerapp update' in image_publication:
              raise SystemExit('Image publication must not deploy the application')

          database_bootstrap = Path('.github/workflows/azure-database-bootstrap.yml').read_text()
          database_bootstrap_required = [
              'deploy/azure/activations/database-dev.json',
              'environment: salcapa-dev-approval',
              'permissions: {}',
              'needs: authorize',
              'id-token: write',
              'ref: release/v3.21',
              '.source_release == "release/v3.21"',
              '.image_digest | test(',
              'initial_users',
              'passwordAuth --output tsv)" = "Disabled"',
              'infra/azure/database-bootstrap.bicep',
              'az containerapp job start',
              'properties.status',
              'api-version=2024-08-01',
              'az rest --method put',
              'principalType:"ServicePrincipal"',
              'az rest --method delete',
              'cleanup() (',
              'Transient database-bootstrap resource deployment failed.',
              'az deployment group show',
              '.properties.outputs.bootstrapIdentityObjectId.value // empty',
              "tr '[:upper:]' '[:lower:]'",
              'Transient resources deployed and bootstrap identity output verified.',
              'Temporary PostgreSQL administrator verified.',
              '.properties.objectId | ascii_downcase',
              'Database bootstrap execution started:',
              'az containerapp job logs show',
              '--container bootstrap',
              '--tail 300',
              '[REDACTED]',
              'az containerapp job delete',
              'az identity delete',
              'Temporary administrator: removed',
              'Client secret or database password: not used',
          ]
          missing_database_bootstrap = [
              value for value in database_bootstrap_required
              if value not in database_bootstrap
          ]
          if missing_database_bootstrap:
              raise SystemExit(
                  'Azure database bootstrap governance is incomplete: '
                  + ', '.join(missing_database_bootstrap)
              )
          if re.search(r'^  (pull_request|workflow_dispatch|schedule):', database_bootstrap, re.MULTILINE):
              raise SystemExit('Database bootstrap may run only from the exact governed record push')
          if len(re.findall(r'uses: actions/checkout@[0-9a-f]{40}\b', database_bootstrap)) < 2:
              raise SystemExit('Both database-bootstrap checkouts must be pinned to commit SHAs')
          if not re.search(r'uses: azure/login@[0-9a-f]{40}\b', database_bootstrap):
              raise SystemExit('Database-bootstrap Azure login action must be pinned to a commit SHA')
          if 'AZURE_CLIENT_SECRET' in database_bootstrap or 'POSTGRES_PASSWORD' in database_bootstrap:
              raise SystemExit('Database bootstrap may not use a client secret or database password')
          if 'az postgres flexible-server ad-admin' in database_bootstrap:
              raise SystemExit('Database bootstrap may not depend on an unavailable Azure CLI extension command')

          database_bootstrap_template = Path('infra/azure/database-bootstrap.bicep').read_text()
          for value in (
              'Microsoft.ManagedIdentity/userAssignedIdentities@2023-01-31',
              'Microsoft.App/jobs@2025-01-01',
              "triggerType: 'Manual'",
              "'${runtimeIdentity.id}': {}",
              "'${bootstrapIdentity.id}': {}",
              "'-m'",
              'tools.azure_database_bootstrap',
              'SALUS_BOOTSTRAP_INITIAL_USERS_JSON',
          ):
              if value not in database_bootstrap_template:
                  raise SystemExit('Database-bootstrap Bicep is incomplete: ' + value)

          database_bootstrap_command = Path('tools/azure_database_bootstrap.py').read_text()
          for value in (
              'pgaadauth_create_principal_with_oid',
              'NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION',
              'SALUS_OIDC_AUTO_PROVISION',
              '"0"',
              "identity_provider='entra'",
              'external_subject',
              'IDENTITY_MAPPING_PROVISIONED',
              'SALCAPA_DATABASE_BOOTSTRAP_PASS',
          ):
              if value not in database_bootstrap_command:
                  raise SystemExit('Database-bootstrap command is incomplete: ' + value)
          if 'client_secret' in database_bootstrap_command.lower() or 'postgres_password' in database_bootstrap_command.lower():
              raise SystemExit('Database-bootstrap command may not contain a long-lived credential path')

          application_deployment = Path('.github/workflows/azure-application-deploy.yml').read_text()
          application_deployment_required = [
              'deploy/azure/activations/application-dev.json',
              'environment: salcapa-dev-approval',
              'permissions: {}',
              'needs: authorize',
              'id-token: write',
              'ref: release/v3.36',
              '.source_release == "release/v3.36"',
              '.activation_key == "salcapa-v3.36-application-63d51360"',
              '.image_digest | test(',
              'path: frozen-release',
              'git -C frozen-release rev-parse HEAD',
              'git merge-base --is-ancestor',
              'passwordAuth --output tsv)" = "Disabled"',
              'publicNetworkAccess --output tsv)" = "Disabled"',
              'adminUserEnabled --output tsv)" = "false"',
              'az acr manifest show-metadata',
              'az deployment group what-if',
              'az deployment group create',
              'provisionApplication=true',
              'containerImageDigest="$IMAGE_DIGEST"',
              'sourceCommit="$SOURCE_COMMIT"',
              'monthlyCostCeilingUsd=30',
              'operationalBudgetUsd=25',
              'salcapa-dev-b48224',
              '.properties.template.containers[0].image',
              '.properties.configuration.ingress.allowInsecure',
              '.properties.configuration.secrets // []',
              '.identity.userAssignedIdentities | length',
              'RUNTIME_IDENTITY_CLIENT_ID="$(az identity show',
              'env_value("AZURE_CLIENT_ID") == $client_id',
              'env_value("SALUS_DB_BACKEND") == "postgres"',
              'env_value("SALUS_POSTGRES_AUTH") == "entra"',
              'env_value("SALUS_SECRET_BACKEND") == "azure_keyvault"',
              'env_value("SALUS_STORAGE_BACKEND") == "azure"',
              'env_value("SALUS_TELEMETRY_BACKEND") == "azure_monitor"',
              'env_value("SALUS_AUTH_MODE") == "oidc"',
              'env_value("SALUS_OIDC_CLIENT_AUTH_METHOD") == "managed_identity"',
              'frozen-release/tools/validate_live_readiness.py',
              '--environment dev',
              '/health/ready',
              '--connect-timeout 5 --max-time 15',
              'Revision state summary (governed non-secret fields only):',
              'az containerapp revision list',
              'provisioningState:properties.provisioningState',
              'Bounded runtime system logs (sensitive values redacted):',
              '--type system',
              '--format json',
              'az containerapp replica list',
              '--revision "$REVISION"',
              '--replica "$REPLICA"',
              'timeout 45s az containerapp logs show',
              'Bounded revision-targeted container logs (sensitive values redacted):',
              'az containerapp logs show',
              '--tail 200',
              '[REDACTED]',
              '/api/auth/oidc/start',
              'login.microsoftonline.com/$EXPECTED_TENANT_ID/oauth2/v2.0/authorize',
              'Minimum replicas: 0',
              'Maximum replicas: 1',
              'Client secret: not used',
              'Custom DNS: not changed',
              'Public production cutover: not performed',
          ]
          missing_application_deployment = [
              value for value in application_deployment_required
              if value not in application_deployment
          ]
          if missing_application_deployment:
              raise SystemExit(
                  'Azure application deployment governance is incomplete: '
                  + ', '.join(missing_application_deployment)
              )
          if re.search(r'^  (pull_request|workflow_dispatch|schedule):', application_deployment, re.MULTILINE):
              raise SystemExit('Application deployment may run only from the exact governed record push')
          if len(re.findall(r'uses: actions/checkout@[0-9a-f]{40}\b', application_deployment)) < 2:
              raise SystemExit('Both application-deployment checkouts must be pinned to commit SHAs')
          if not re.search(r'uses: azure/login@[0-9a-f]{40}\b', application_deployment):
              raise SystemExit('Application-deployment Azure login action must be pinned to a commit SHA')
          if 'AZURE_CLIENT_SECRET' in application_deployment or ':latest' in application_deployment:
              raise SystemExit('Application deployment may not use a client secret or mutable latest tag')
          if 'customDomains:' in application_deployment or 'az network dns' in application_deployment:
              raise SystemExit('Development deployment may not change DNS')

          recovery_readiness = Path('.github/workflows/azure-recovery-readiness.yml').read_text()
          recovery_readiness_required = [
              'deploy/azure/activations/recovery-readiness-dev.json',
              'environment: salcapa-dev-approval',
              'permissions: {}',
              'needs: authorize',
              'id-token: write',
              'ref: release/v3.30',
              '.source_release == "release/v3.30"',
              '.source_commit == "00c40997225eb6ade3637b45a3c1ad543e066db7"',
              'uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c',
              'az rest --method get',
              'backupRetentionDays == 14',
              'earliestRestoreDate',
              'isVersioningEnabled == true',
              'deleteRetentionPolicy.days == 14',
              'containerDeleteRetentionPolicy.days == 14',
              'workspaceCapping.dailyQuotaGb == 0.1',
              'properties.notifications.actual80Percent',
              'frozen-release/tools/validate_live_readiness.py',
              'Restore operation: not performed',
              'Resource mutation: none',
              'Client secret: not used',
              'DNS or production cutover: not performed',
          ]
          missing_recovery_readiness = [
              value for value in recovery_readiness_required
              if value not in recovery_readiness
          ]
          if missing_recovery_readiness:
              raise SystemExit(
                  'Azure recovery-readiness governance is incomplete: '
                  + ', '.join(missing_recovery_readiness)
              )
          if re.search(r'^  (pull_request|workflow_dispatch|schedule):', recovery_readiness, re.MULTILINE):
              raise SystemExit('Recovery readiness may run only from the exact governed record push')
          if len(re.findall(r'uses: actions/checkout@[0-9a-f]{40}\b', recovery_readiness)) < 2:
              raise SystemExit('Both recovery-readiness checkouts must be pinned to commit SHAs')
          if any(value in recovery_readiness for value in (
              'AZURE_CLIENT_SECRET',
              'az deployment group create',
              'az postgres flexible-server restore',
              'az storage blob restore',
              'az rest --method put',
              'az rest --method post',
              'az rest --method delete',
          )):
              raise SystemExit('Recovery readiness must remain passwordless and read-only')

          recovery_rehearsal = Path('tools/ci_recovery_rehearsal.py').read_text()
          application_source = Path('app.py').read_text()
          recovery_rehearsal_required = [
              'CLEAN_ROOM_RECOVERY_REHEARSAL_PASS',
              'Independent Recovery Reviewer',
              'safety["filename"] != baseline["filename"]',
              'assert_restored_snapshot(baseline_records)',
              'assert_restored_snapshot(safety_records)',
              'boundary_before',
              'app.ALLOW_RESTORE = False',
          ]
          missing_recovery_rehearsal = [
              value for value in recovery_rehearsal_required
              if value not in recovery_rehearsal
          ]
          if missing_recovery_rehearsal:
              raise SystemExit(
                  'Clean-room recovery rehearsal is incomplete: '
                  + ', '.join(missing_recovery_rehearsal)
              )
          if any(value in recovery_rehearsal for value in (
              'management.azure.com',
              'az postgres',
              'az storage',
              'SALUS_STORAGE_BACKEND"] = "azure"',
          )):
              raise SystemExit('Clean-room recovery rehearsal must not mutate Azure')
          for value in (
              "strftime('%Y%m%dT%H%M%S%fZ')",
              'uuid.uuid4().hex[:12]',
          ):
              if value not in application_source:
                  raise SystemExit('Backup filename uniqueness control is incomplete: ' + value)

          pitr_exercise = Path('.github/workflows/azure-pitr-exercise.yml').read_text()
          pitr_exercise_required = [
              'deploy/azure/activations/pitr-exercise-dev.json',
              'environment: salcapa-dev-approval',
              'permissions: {}',
              'needs: authorize',
              'id-token: write',
              'ref: release/v3.33',
              '.source_release == "release/v3.33"',
              '.source_commit == "c24e8c99a0ee9f7cd93cb0adf115af9d36fe03f4"',
              '.operation == "exercise_point_in_time_restore"',
              '.source_server == "salcapa-dev-b48224-pg"',
              '.temporary_restore_server == "salcapa-dev-b48224-pitr"',
              '.restore_lag_minutes == 15',
              'uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c',
              'trap cleanup EXIT',
              'Fail closed: temporary restore target already exists.',
              'az postgres flexible-server restore',
              '--restore-time "$RESTORE_POINT"',
              '.authConfig.passwordAuth == "Disabled"',
              '.network.publicNetworkAccess == "Disabled"',
              'az postgres flexible-server db show',
              '--name salcapa',
              'SALUS_POSTGRES_HOST',
              'Application database target: remained the source server',
              'Source server before/after: Ready and unchanged',
              'az postgres flexible-server delete',
              'Temporary restore server: deleted',
              'Client secret or database password: not used',
              'Application traffic cutover: not performed',
              'DNS or production cutover: not performed',
              'LIVE_PITR_EXERCISE_ACCEPTED',
          ]
          missing_pitr_exercise = [
              value for value in pitr_exercise_required if value not in pitr_exercise
          ]
          if missing_pitr_exercise:
              raise SystemExit(
                  'Azure point-in-time recovery exercise governance is incomplete: '
                  + ', '.join(missing_pitr_exercise)
              )
          if re.search(r'^  (pull_request|workflow_dispatch|schedule):', pitr_exercise, re.MULTILINE):
              raise SystemExit('Point-in-time recovery exercise may run only from the exact governed record push')
          if len(re.findall(r'uses: actions/checkout@[0-9a-f]{40}\b', pitr_exercise)) < 2:
              raise SystemExit('Both point-in-time recovery checkouts must be pinned to commit SHAs')
          if not re.search(r'uses: azure/login@[0-9a-f]{40}\b', pitr_exercise):
              raise SystemExit('Point-in-time recovery Azure login action must be pinned to a commit SHA')
          if any(value in pitr_exercise for value in (
              'AZURE_CLIENT_SECRET',
              'POSTGRES_PASSWORD',
              'az network dns',
              'customDomains:',
              'az containerapp update',
              'az deployment group create',
          )):
              raise SystemExit('Point-in-time recovery exercise crosses a credential, DNS, application, or deployment boundary')

          connection = Path('.github/workflows/azure-connection-verify.yml').read_text()
          connection_required = [
              'id-token: write',
              ".github/workflows/azure-foundation-activate.yml",
              "deploy/azure/activations/foundation-dev.json",
              'Evaluate required Azure provider readiness',
              'Required Azure providers registered',
              'Required Azure providers missing',
              "steps.providers.outputs.ready == 'true'",
              'AZURE_BUDGET_CONTACT_EMAIL',
              'DEPLOYMENT_PRINCIPAL_OBJECT_ID',
              'az role assignment list',
              '--assignee-object-id',
              'EXPECTED_SCOPE=',
              'ascii_downcase',
              'User Access Administrator',
              'Role Based Access Control Administrator',
              'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1',
              'Run live foundation what-if without provisioning',
              'UNIQUE_SUFFIX: b48224',
              'provisionApplication=false',
              'sourceCommit="$GITHUB_SHA"',
              '--result-format FullResourcePayloads',
              '.changeType != "Delete"',
              'microsoft.app/containerapps',
              '.changeType | IN("Ignore", "NoEffect")',
              'Container App mutation by foundation preflight: none',
              'GITHUB_STEP_SUMMARY',
          ]
          missing_connection = [
              value for value in connection_required if value not in connection
          ]
          if missing_connection:
              raise SystemExit(
                  'Azure connection acceptance is incomplete: '
                  + ', '.join(missing_connection)
              )
          if not re.search(r'uses: azure/login@[0-9a-f]{40}\b', connection):
              raise SystemExit('Azure connection login action must be pinned to a commit SHA')
          if 'AZURE_CLIENT_SECRET' in connection:
              raise SystemExit('Azure connection acceptance may not use a long-lived client secret')
          if 'az deployment group create' in connection:
              raise SystemExit('Azure connection preflight must never provision resources')

          cost = Path('docs/AZURE_COST_AND_APPROVAL.md').read_text()
          for value in (
              'Option A',
              'Azure Container Apps',
              'Consumption environment',
              'Standard_LRS',
              'approximately $15–25/month',
              'Proposed monthly authorization ceiling',
              '$30.00',
              'MD-APPROVAL-AZURE-LEAN-20260904',
              'No DNS change or public production cutover',
              '$25.00',
              '80% actual',
              '100% forecasted',
              'AZURE_BUDGET_CONTACT_EMAIL',
          ):
              if value not in cost:
                  raise SystemExit('Azure cost and approval record is incomplete: ' + value)
          print('AZURE_LEAN_INFRA_POLICY_PASS')
          PY
