name: SalCAPA Fictional Demonstration Fixtures

on:
  push:
    branches: [development/salcapa-platform]
    paths:
      - 'salcapa_demo_fixtures.py'
      - 'salcapa_runtime.py'
      - 'tools/ci_salcapa_demo_fixtures_smoke.py'
      - 'tools/ci_salcapa_demo_full_lifecycle_smoke.py'
      - 'tools/ci_salcapa_demo_promotion_preflight.py'
      - 'tools/reconstruct_salcapa_demo_fixtures.py'
      - 'source_archives/development/salcapa_demo_fixtures.py.gz'
      - 'Dockerfile'
      - '.github/workflows/salcapa-demo-fixtures.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt bandit pip-audit
      - run: python tools/reconstruct_salcapa_demo_fixtures.py
      - run: python -m py_compile salcapa_demo_fixtures.py salcapa_runtime.py tools/ci_salcapa_demo_fixtures_smoke.py tools/ci_salcapa_demo_full_lifecycle_smoke.py tools/ci_salcapa_demo_promotion_preflight.py
      - run: python tools/ci_salcapa_demo_fixtures_smoke.py
      - run: python tools/ci_salcapa_demo_full_lifecycle_smoke.py
      - run: python tools/ci_salcapa_demo_promotion_preflight.py
      - run: bandit -q -r salcapa_demo_fixtures.py tools/ci_salcapa_demo_fixtures_smoke.py tools/ci_salcapa_demo_full_lifecycle_smoke.py tools/ci_salcapa_demo_promotion_preflight.py -ll
      - run: pip-audit -r requirements.txt
      - name: Repository hygiene
        run: |
          git diff --check
          test ! -e .env
          test ! -e id_rsa

  postgres-16:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: salus
          POSTGRES_PASSWORD: salus-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: salcapa
        options: >-
          --health-cmd "pg_isready -U salus -d salcapa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      SALUS_DB_BACKEND: postgres
      SALUS_DATABASE_URL: postgresql://salus:salus-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/salcapa
      SALUS_SEED_DEMO: '0'
      SALUS_ENV: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python tools/reconstruct_salcapa_demo_fixtures.py
      - run: python tools/ci_salcapa_demo_fixtures_smoke.py
      - run: python tools/ci_salcapa_demo_full_lifecycle_smoke.py
      - run: python tools/ci_salcapa_demo_promotion_preflight.py

  production-container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --pull=false -t salcapa-demo-fixture-candidate .
      - run: >-
          docker run --rm
          -e SALUS_ENV=development
          -e SALUS_AUTH_MODE=prototype
          -e SALUS_SEED_DEMO=0
          salcapa-demo-fixture-candidate
          python tools/ci_salcapa_demo_fixtures_smoke.py
      - run: >-
          docker run --rm
          -e SALUS_ENV=development
          -e SALUS_AUTH_MODE=prototype
          -e SALUS_SEED_DEMO=0
          salcapa-demo-fixture-candidate
          python tools/ci_salcapa_demo_full_lifecycle_smoke.py
      - run: >-
          docker run --rm
          -e SALUS_ENV=development
          -e SALUS_AUTH_MODE=prototype
          -e SALUS_SEED_DEMO=0
          salcapa-demo-fixture-candidate
          python tools/ci_salcapa_demo_promotion_preflight.py
