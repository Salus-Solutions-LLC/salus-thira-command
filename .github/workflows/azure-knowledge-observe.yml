name: SalCAPA knowledge worker throughput observation

on:
  push:
    branches:
      - development/salcapa-platform
    paths:
      - '.github/workflows/azure-knowledge-observe.yml'

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: salcapa-dev-approval
    permissions: {}
    steps:
      - name: Record protected observation approval gate passage
        run: echo 'Protected SalCAPA development observation approval gate passed.'

  observe:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Probe first Graph delta page without source bytes
        env:
          EXPECTED_SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          test "$(az account show --query id --output tsv)" = "$EXPECTED_SUBSCRIPTION"
          job=salcapa-dev-b48224-kb-scan
          az containerapp job show --resource-group rg-salcapa-dev --name "$job" --query properties.template --output json > /tmp/salcapa-job-template.json
          cat > /tmp/salcapa-ledger-audit.py <<'PY'
          import json
          from urllib.parse import urlparse, parse_qs
          from salcapa_m365_intake import GovernedM365Config, GovernedM365Intake, GRAPH_ROOT
          from salcapa_bulk_delta import SELECT, resolve_pending, _scoped_link

          config = GovernedM365Config.from_environment()
          intake = GovernedM365Intake(config)
          pending = resolve_pending(intake)
          endpoint = f"{GRAPH_ROOT}/drives/{config.drive_id}/items/{pending}/delta"
          response = intake.client.get(
              endpoint, headers=intake._headers(),
              params={"$select": SELECT, "$top": "200"},
          )
          output = {"http_status": response.status_code}
          if response.status_code == 200:
              payload = response.json()
              values = payload.get("value")
              link = payload.get("@odata.nextLink") or payload.get("@odata.deltaLink")
              parsed = urlparse(link or "")
              output.update(
                  item_count=len(values) if isinstance(values, list) else -1,
                  link_kind="next" if "@odata.nextLink" in payload else "delta" if "@odata.deltaLink" in payload else "none",
                  link_path=parsed.path.replace(config.drive_id, "<drive>").replace(pending, "<pending>"),
                  link_query_keys=sorted(parse_qs(parsed.query).keys()),
              )
              try:
                  _scoped_link(link, config.drive_id, pending)
                  output["scope_check"] = "passed"
              except Exception as exc:
                  output["scope_check"] = type(exc).__name__ + ": " + str(exc)
          else:
              try:
                  output["graph_error_code"] = response.json().get("error", {}).get("code", "")
              except Exception:
                  pass
          print("SALCAPA_GRAPH_PROBE=" + json.dumps(output, sort_keys=True), flush=True)
          PY
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/salcapa-job-template.json')
          template = json.loads(p.read_text())
          if len(template['containers']) != 1 or template['containers'][0]['name'] != 'salcapa-knowledge-scan':
              raise SystemExit('Unexpected governed job template')
          template['containers'][0]['command'] = ['python', '-c']
          template['containers'][0]['args'] = [Path('/tmp/salcapa-ledger-audit.py').read_text()]
          Path('/tmp/salcapa-audit-template.json').write_text(json.dumps(template))
          PY
          execution="$(az containerapp job start --resource-group rg-salcapa-dev --name "$job" --yaml /tmp/salcapa-audit-template.json --query name --output tsv --only-show-errors)"
          test -n "$execution"
          echo "Started read-only ledger audit execution"
          status=Running
          for attempt in {1..30}; do
            status="$(az containerapp job execution show --resource-group rg-salcapa-dev --name "$job" --job-execution-name "$execution" --query properties.status --output tsv --only-show-errors)"
            if [ "$status" = Succeeded ] || [ "$status" = Failed ]; then break; fi
            sleep 8
          done
          echo "Ledger audit status=$status"
          az containerapp job logs show --resource-group rg-salcapa-dev --name "$job" --execution "$execution" --container salcapa-knowledge-scan --tail 80 --format text --only-show-errors 2>/dev/null | grep 'SALCAPA_GRAPH_PROBE=' | tail -n 1 || true
          test "$status" = Succeeded
