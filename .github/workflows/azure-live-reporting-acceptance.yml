name: SalCAPA governed Azure live-reporting acceptance

on:
  push:
    branches:
      - development/salcapa-platform
    paths:
      - 'deploy/azure/activations/live-reporting-dev.json'

permissions:
  contents: read

concurrency:
  group: salcapa-live-reporting-acceptance-dev
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: salcapa-dev-approval
    permissions: {}
    steps:
      - name: Record protected live-reporting approval gate passage
        run: echo "Protected SalCAPA development live-reporting acceptance gate passed."

  accept:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact frozen v3.111 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/v3.111
          path: frozen-release
          fetch-depth: 1
          persist-credentials: false

      - name: Validate immutable live-reporting acceptance record
        id: activation
        env:
          ACTIVATION_FILE: deploy/azure/activations/live-reporting-dev.json
        run: |
          set -euo pipefail
          jq -e '
            type == "object" and
            (.schema_version == 1) and
            (.operation == "accept_live_reporting") and
            (.target_environment == "dev") and
            (.location == "southcentralus") and
            (.unique_suffix == "b48224") and
            (.approval_record == "MD-APPROVAL-AZURE-LEAN-20260904") and
            (.accepted_release == "release/v3.36") and
            (.accepted_commit == "63d513605f908d3308bb5dd1bbdbf1061878452b") and
            (.accepted_image_digest == "salcapadevb48224acr.azurecr.io/salcapa@sha256:746a2e92cdc6e4189a772db65b1a3311b25be42ad65d0f6bc8e5779e86a58b46") and
            (.candidate_release == "release/v3.111") and
            (.candidate_commit == "8bf4614ec79a27641c40dc1a21e1790746a08604") and
            (.candidate_image_digest == "salcapadevb48224acr.azurecr.io/salcapa@sha256:6df0d41dd93fa929af33793d619630f41822a41ae91ed9d7050d074981fa0311") and
            (.acceptance_script_sha256 == "7f87d6ad75c98a496676af934b32253f29bc8224976b9b87f4bb782088e42929") and
            (.source_server == "salcapa-dev-b48224-pg") and
            (.temporary_restore_server == "salcapa-dev-b48224-v311-report") and
            (.restore_lag_minutes == 15) and
            (.acceptance_revision == 5) and
            (.activation_key == "salcapa-v3.111-live-reporting-20260911-r5") and
            ((keys - [
              "acceptance_revision", "acceptance_script_sha256", "accepted_commit",
              "accepted_image_digest", "accepted_release", "activation_key",
              "approval_record", "candidate_commit", "candidate_image_digest",
              "candidate_release", "location", "operation", "restore_lag_minutes",
              "schema_version", "source_server", "target_environment",
              "temporary_restore_server", "unique_suffix"
            ]) | length == 0)
          ' "$ACTIVATION_FILE" >/dev/null
          test "$(git -C frozen-release rev-parse HEAD)" = "8bf4614ec79a27641c40dc1a21e1790746a08604"
          git merge-base --is-ancestor "8bf4614ec79a27641c40dc1a21e1790746a08604" "$GITHUB_SHA"
          test "$(sha256sum tools/azure_live_reporting_acceptance.py | cut -d ' ' -f 1)" = "$(jq -r '.acceptance_script_sha256' "$ACTIVATION_FILE")"
          jq -e '
            .source_release == "release/v3.36" and
            .source_commit == "63d513605f908d3308bb5dd1bbdbf1061878452b" and
            .image_digest == "salcapadevb48224acr.azurecr.io/salcapa@sha256:746a2e92cdc6e4189a772db65b1a3311b25be42ad65d0f6bc8e5779e86a58b46"
          ' deploy/azure/activations/application-dev.json >/dev/null
          {
            echo "candidate_image=$(jq -r '.candidate_image_digest' "$ACTIVATION_FILE")"
            echo "accepted_image=$(jq -r '.accepted_image_digest' "$ACTIVATION_FILE")"
          } >> "$GITHUB_OUTPUT"

      - name: Validate required non-secret repository variables
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
        run: |
          set -euo pipefail
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP AZURE_LOCATION; do
            test -n "${!name}" || { echo "Missing repository variable: $name" >&2; exit 1; }
          done
          test "$AZURE_RESOURCE_GROUP" = "rg-salcapa-dev"
          test "$AZURE_LOCATION" = "southcentralus"

      - name: Azure login through workload identity federation
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Restore, verify report delivery, and remove the isolated copy
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          EXPECTED_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          EXPECTED_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          CANDIDATE_IMAGE: ${{ steps.activation.outputs.candidate_image }}
          ACCEPTED_IMAGE: ${{ steps.activation.outputs.accepted_image }}
          ACTIVATION_FILE: deploy/azure/activations/live-reporting-dev.json
        run: |
          set -euo pipefail
          SOURCE_SERVER="$(jq -r '.source_server' "$ACTIVATION_FILE")"
          RESTORE_SERVER="$(jq -r '.temporary_restore_server' "$ACTIVATION_FILE")"
          RESTORE_LAG_MINUTES="$(jq -r '.restore_lag_minutes' "$ACTIVATION_FILE")"
          JOB_NAME="salcapa-dev-b48224-v311-rpt"
          CLEANUP_REQUIRED=0

          cleanup() {
            exit_code=$?
            trap - EXIT
            set +e
            az containerapp job delete --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" --yes >/dev/null 2>&1
            if [ "$CLEANUP_REQUIRED" = "1" ]; then
              az postgres flexible-server delete --resource-group "$RESOURCE_GROUP" --name "$RESTORE_SERVER" --yes >/dev/null 2>&1
            fi
            for attempt in $(seq 1 60); do
              ! az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" >/dev/null 2>&1 && break
              sleep 5
            done
            for attempt in $(seq 1 90); do
              ! az postgres flexible-server show --resource-group "$RESOURCE_GROUP" --name "$RESTORE_SERVER" >/dev/null 2>&1 && break
              sleep 10
            done
            if az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" >/dev/null 2>&1 ||
               az postgres flexible-server show --resource-group "$RESOURCE_GROUP" --name "$RESTORE_SERVER" >/dev/null 2>&1; then
              echo "Temporary live-reporting acceptance cleanup did not converge." >&2
              exit 1
            fi
            exit "$exit_code"
          }
          trap cleanup EXIT

          test "$(az account show --query id --output tsv)" = "$EXPECTED_SUBSCRIPTION_ID"
          test "$(az account show --query tenantId --output tsv)" = "$EXPECTED_TENANT_ID"
          test "$(az group show --name "$RESOURCE_GROUP" --query location --output tsv)" = "southcentralus"
          if az postgres flexible-server show --resource-group "$RESOURCE_GROUP" --name "$RESTORE_SERVER" >/dev/null 2>&1 ||
             az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" >/dev/null 2>&1; then
            echo "Fail closed: a temporary live-reporting acceptance resource already exists." >&2
            exit 1
          fi

          az postgres flexible-server show --resource-group "$RESOURCE_GROUP" --name "$SOURCE_SERVER" --output json > /tmp/source-before.json
          az containerapp show --resource-group "$RESOURCE_GROUP" --name salcapa-dev-b48224 --output json > /tmp/application-before.json
          SOURCE_FQDN="$(jq -r '.fullyQualifiedDomainName' /tmp/source-before.json)"
          jq -e '
            .version == "16" and .state == "Ready" and
            .authConfig.activeDirectoryAuth == "Enabled" and
            .authConfig.passwordAuth == "Disabled" and
            .network.publicNetworkAccess == "Disabled" and
            .backup.backupRetentionDays == 14 and
            (.backup.earliestRestoreDate | type == "string" and length > 10)
          ' /tmp/source-before.json >/dev/null
          jq -e --arg accepted_image "$ACCEPTED_IMAGE" --arg source_host "$SOURCE_FQDN" '
            .properties.template.containers[0].image == $accepted_image and
            ([.properties.template.containers[0].env[] | select(.name == "SALUS_POSTGRES_HOST") | .value] == [$source_host]) and
            .properties.configuration.ingress.allowInsecure == false and
            ((.properties.configuration.secrets // []) | length == 0)
          ' /tmp/application-before.json >/dev/null
          jq -S '{id,state,version,authConfig,network,backupRetentionDays:.backup.backupRetentionDays,geoRedundantBackup:.backup.geoRedundantBackup,fullyQualifiedDomainName}' /tmp/source-before.json | sha256sum | cut -d ' ' -f 1 > /tmp/source-before.sha
          jq -S '
            {
              id:.id,
              image:.properties.template.containers[0].image,
              env:([.properties.template.containers[0].env[]|{name,value,secretRef}]|sort_by(.name)),
              ingress:.properties.configuration.ingress,
              identity:.identity,
              scale:.properties.template.scale,
              secretsCount:((.properties.configuration.secrets//[])|length)
            }
            | walk(if type == "array" then sort_by(tojson) else . end)
          ' /tmp/application-before.json > /tmp/application-before.normalized.json
          sha256sum /tmp/application-before.normalized.json | cut -d ' ' -f 1 > /tmp/application-before.sha

          EARLIEST_RESTORE="$(jq -r '.backup.earliestRestoreDate' /tmp/source-before.json)"
          RESTORE_POINT="$(date -u -d "$RESTORE_LAG_MINUTES minutes ago" '+%Y-%m-%dT%H:%M:%SZ')"
          test "$(date -u -d "$RESTORE_POINT" +%s)" -ge "$(date -u -d "$EARLIEST_RESTORE" +%s)"
          CLEANUP_REQUIRED=1
          az postgres flexible-server restore --resource-group "$RESOURCE_GROUP" --name "$RESTORE_SERVER" --source-server "$SOURCE_SERVER" --restore-time "$RESTORE_POINT" --yes --output none
          az postgres flexible-server show --resource-group "$RESOURCE_GROUP" --name "$RESTORE_SERVER" --output json > /tmp/restored.json
          RESTORE_FQDN="$(jq -r '.fullyQualifiedDomainName' /tmp/restored.json)"
          jq -e '.version == "16" and .state == "Ready" and .authConfig.activeDirectoryAuth == "Enabled" and .authConfig.passwordAuth == "Disabled" and .network.publicNetworkAccess == "Disabled"' /tmp/restored.json >/dev/null
          test "$RESTORE_FQDN" != "$SOURCE_FQDN"

          # The database restore can outlive the five-minute GitHub OIDC assertion
          # used by the initial Azure login. Obtain a fresh short-lived assertion
          # without introducing a client secret or standing credential.
          FRESH_OIDC_TOKEN="$(curl --silent --show-error --fail \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" | jq -er '.value')"
          test -n "$FRESH_OIDC_TOKEN"
          az login --service-principal --username "$AZURE_CLIENT_ID" \
            --tenant "$EXPECTED_TENANT_ID" --federated-token "$FRESH_OIDC_TOKEN" \
            --output none
          unset FRESH_OIDC_TOKEN
          az account set --subscription "$EXPECTED_SUBSCRIPTION_ID"
          test "$(az account show --query id --output tsv)" = "$EXPECTED_SUBSCRIPTION_ID"
          test "$(az account show --query tenantId --output tsv)" = "$EXPECTED_TENANT_ID"

          DIGEST="${CANDIDATE_IMAGE##*@}"
          test "$(az acr manifest show-metadata --registry salcapadevb48224acr --name "salcapa@$DIGEST" --query digest --output tsv)" = "$DIGEST"
          SCRIPT_BASE64="$(base64 -w 0 tools/azure_live_reporting_acceptance.py)"
          az bicep build --file infra/azure/live-reporting-acceptance.bicep --stdout >/tmp/live-reporting-acceptance-arm.json
          DEPLOYMENT_NAME="salcapa-v311-report-acceptance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          az deployment group create \
            --name "$DEPLOYMENT_NAME" --resource-group "$RESOURCE_GROUP" \
            --template-file infra/azure/live-reporting-acceptance.bicep \
            --parameters location=southcentralus environmentName=dev uniqueSuffix=b48224 \
              imageDigest="$CANDIDATE_IMAGE" sourceCommit=8bf4614ec79a27641c40dc1a21e1790746a08604 \
              acceptedCommit=63d513605f908d3308bb5dd1bbdbf1061878452b \
              approvalRecord=MD-APPROVAL-AZURE-LEAN-20260904 restoredPostgresHost="$RESTORE_FQDN" \
              acceptanceScriptBase64="$SCRIPT_BASE64" --output none
          test "$(az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" --query properties.template.containers[0].image --output tsv)" = "$CANDIDATE_IMAGE"
          test "$(az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" --query identity.userAssignedIdentities --output json | jq 'length')" = "1"

          EXECUTION_NAME="$(az containerapp job start --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" --query name --output tsv)"
          test -n "$EXECUTION_NAME"
          STATE=""
          for attempt in $(seq 1 120); do
            STATE="$(az containerapp job execution show --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" --job-execution-name "$EXECUTION_NAME" --query properties.status --output tsv 2>/dev/null || true)"
            case "$STATE" in
              Succeeded) break ;;
              Failed|Degraded|Stopped) break ;;
            esac
            sleep 10
          done
          az containerapp job logs show --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" --execution "$EXECUTION_NAME" --container reporting-acceptance --tail 100 --format text --only-show-errors \
            | sed -E 's/((password|secret|token|connection[_ -]?string)[^:=]*[:=][[:space:]]*)[^[:space:]]+/\1[REDACTED]/Ig' > /tmp/acceptance.log || true
          echo "Sanitized isolated acceptance output:"
          cat /tmp/acceptance.log
          if [ "$STATE" != "Succeeded" ]; then
            echo "Live-reporting acceptance failed closed: $STATE" >&2
            exit 1
          fi
          grep -F '"acceptance": "LIVE_REPORTING_ACCEPTED"' /tmp/acceptance.log >/dev/null
          grep -F '"delivery_formats_verified": 3' /tmp/acceptance.log >/dev/null
          grep -F '"draft_hidden": true' /tmp/acceptance.log >/dev/null
          grep -F '"cross_member_denied": true' /tmp/acceptance.log >/dev/null
          grep -F '"released_snapshot_immutable": true' /tmp/acceptance.log >/dev/null
          grep -F '"integrity_failure_denied": true' /tmp/acceptance.log >/dev/null

          az postgres flexible-server show --resource-group "$RESOURCE_GROUP" --name "$SOURCE_SERVER" --output json > /tmp/source-after.json
          az containerapp show --resource-group "$RESOURCE_GROUP" --name salcapa-dev-b48224 --output json > /tmp/application-after.json
          jq -S '{id,state,version,authConfig,network,backupRetentionDays:.backup.backupRetentionDays,geoRedundantBackup:.backup.geoRedundantBackup,fullyQualifiedDomainName}' /tmp/source-after.json | sha256sum | cut -d ' ' -f 1 > /tmp/source-after.sha
          jq -S '
            {
              id:.id,
              image:.properties.template.containers[0].image,
              env:([.properties.template.containers[0].env[]|{name,value,secretRef}]|sort_by(.name)),
              ingress:.properties.configuration.ingress,
              identity:.identity,
              scale:.properties.template.scale,
              secretsCount:((.properties.configuration.secrets//[])|length)
            }
            | walk(if type == "array" then sort_by(tojson) else . end)
          ' /tmp/application-after.json > /tmp/application-after.normalized.json
          sha256sum /tmp/application-after.normalized.json | cut -d ' ' -f 1 > /tmp/application-after.sha
          cmp /tmp/source-before.sha /tmp/source-after.sha
          if ! cmp -s /tmp/application-before.sha /tmp/application-after.sha; then
            echo "Accepted application preservation check detected a governed configuration change." >&2
            jq -nr \
              --slurpfile before /tmp/application-before.normalized.json \
              --slurpfile after /tmp/application-after.normalized.json '
                ([($before[0] | paths(scalars)), ($after[0] | paths(scalars))] | unique)[] as $path
                | select(($before[0] | getpath($path)) != ($after[0] | getpath($path)))
                | "Changed governed application configuration path: " + ($path | map(tostring) | join("."))
              ' >&2
            exit 1
          fi

          az containerapp job delete --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" --yes
          az postgres flexible-server delete --resource-group "$RESOURCE_GROUP" --name "$RESTORE_SERVER" --yes
          CLEANUP_REQUIRED=0
          for attempt in $(seq 1 90); do
            ! az postgres flexible-server show --resource-group "$RESOURCE_GROUP" --name "$RESTORE_SERVER" >/dev/null 2>&1 && break
            sleep 10
          done
          ! az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" >/dev/null 2>&1
          ! az postgres flexible-server show --resource-group "$RESOURCE_GROUP" --name "$RESTORE_SERVER" >/dev/null 2>&1
          trap - EXIT

          {
            echo "### SalCAPA v3.111 live-reporting acceptance"
            echo ""
            echo "- Candidate runtime: exact frozen v3.111 immutable image digest"
            echo "- Database target: isolated 15-minute restore of accepted v3.36"
            echo "- Draft visibility: denied to Protected Member roles"
            echo "- Released delivery: immutable, hash-verified JSON, CSV, and printable HTML"
            echo "- Cross-member access and tampered snapshot delivery: denied"
            echo "- Human authority: simulated only for this isolated acceptance; no operational release represented"
            echo "- Source database and running application configuration: unchanged"
            echo "- Temporary job and restored database: removed"
            echo "- Application deployment, traffic shift, DNS change, password, and client secret: none"
            echo "LIVE_REPORTING_ACCEPTED"
          } >> "$GITHUB_STEP_SUMMARY"
