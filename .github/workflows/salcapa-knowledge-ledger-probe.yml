name: SalCAPA Knowledge Library ledger reconciliation

on:
  push:
    branches:
      - development/salcapa-platform
    paths:
      - '.github/workflows/salcapa-knowledge-ledger-probe.yml'
      - 'infra/azure/knowledge-ledger-acceptance-job.bicep'
      - 'tools/live_knowledge_ledger_probe.py'
  workflow_dispatch:

concurrency:
  group: salcapa-knowledge-diagnostic
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  authorize_scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: salcapa-dev-approval
    permissions: {}
    steps:
      - run: echo "Protected aggregate-only ledger reconciliation gate passed."

  scoped_ledger:
    needs: authorize_scoped
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Run isolated aggregate-only ledger reconciliation
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          test "$RESOURCE_GROUP" = "rg-salcapa-dev"
          az containerapp show --resource-group "$RESOURCE_GROUP" --name salcapa-dev-b48224 --output json > /tmp/salcapa-ledger-app.json
          az containerapp job show --resource-group "$RESOURCE_GROUP" --name salcapa-dev-b48224-kb-scan --output json > /tmp/salcapa-ledger-worker.json
          EXPECTED_IMAGE=salcapadevb48224acr.azurecr.io/salcapa@sha256:8ca732d9cdc7050797153157b14d58f0f795b1b36293b1029a1fcb419028d289
          test "$(jq -r '.properties.template.containers[0].image' /tmp/salcapa-ledger-app.json)" = "$EXPECTED_IMAGE"
          test "$(jq -r '.properties.template.containers[0].image' /tmp/salcapa-ledger-worker.json)" = "$EXPECTED_IMAGE"
          env_value() {
            jq -r --arg name "$1" 'first(.properties.template.containers[0].env[] | select(.name == $name) | .value)' /tmp/salcapa-ledger-worker.json
          }
          test "$(env_value SALUS_DB_BACKEND)" = "postgres"
          test "$(env_value SALUS_POSTGRES_AUTH)" = "entra"
          IDENTITY_ID="$(az identity show --resource-group "$RESOURCE_GROUP" --name salcapa-dev-b48224-identity --query id --output tsv --only-show-errors)"
          IDENTITY_CLIENT_ID="$(az identity show --resource-group "$RESOURCE_GROUP" --name salcapa-dev-b48224-identity --query clientId --output tsv --only-show-errors)"
          ENVIRONMENT_ID="$(az containerapp env show --resource-group "$RESOURCE_GROUP" --name salcapa-dev-b48224-aca-env --query id --output tsv --only-show-errors)"
          REGISTRY_SERVER="$(az acr show --resource-group "$RESOURCE_GROUP" --name salcapadevb48224acr --query loginServer --output tsv --only-show-errors)"
          SCRIPT_B64="$(base64 -w0 tools/live_knowledge_ledger_probe.py)"
          az deployment group create \
            --name "salcapa-ledger-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/azure/knowledge-ledger-acceptance-job.bicep \
            --parameters \
              environmentId="$ENVIRONMENT_ID" \
              identityId="$IDENTITY_ID" \
              registryServer="$REGISTRY_SERVER" \
              imageDigest="$EXPECTED_IMAGE" \
              managedIdentityClientId="$IDENTITY_CLIENT_ID" \
              tenantId="$(env_value SALUS_OIDC_TENANT_ID)" \
              applicationClientId="$(env_value SALUS_OIDC_CLIENT_ID)" \
              driveId="$(env_value SALUS_M365_INTAKE_DRIVE_ID)" \
              folderItemId="$(env_value SALUS_M365_INTAKE_FOLDER_ITEM_ID)" \
              postgresHost="$(env_value SALUS_POSTGRES_HOST)" \
              postgresDatabase="$(env_value SALUS_POSTGRES_DATABASE)" \
              postgresUser="$(env_value SALUS_POSTGRES_USER)" \
              postgresSslMode="$(env_value SALUS_POSTGRES_SSLMODE)" \
              acceptanceScriptBase64="$SCRIPT_B64" \
            --output none --only-show-errors
          JOB_NAME=salcapa-ledger-acceptance-b48224
          EXECUTION_NAME="$(az containerapp job start \
            --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" \
            --query name --output tsv --only-show-errors)"
          test -n "$EXECUTION_NAME"
          SUCCEEDED=false
          for attempt in $(seq 1 60); do
            STATUS="$(az containerapp job execution show \
              --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" \
              --job-execution-name "$EXECUTION_NAME" \
              --query properties.status --output tsv --only-show-errors)"
            if [ "$STATUS" = "Succeeded" ]; then SUCCEEDED=true; break; fi
            if [ "$STATUS" = "Failed" ]; then break; fi
            sleep 10
          done
          az containerapp job logs show \
            --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" \
            --execution "$EXECUTION_NAME" --container salcapa-ledger-acceptance \
            --tail 100 --format text --only-show-errors 2>&1 \
            | grep -E 'LEDGER_[A-Z0-9_]+=|RECONCILIATION_COMPLETE=' \
            || true
          test "$SUCCEEDED" = "true"
      - name: Remove isolated ledger diagnostic job
        if: always()
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          JOB_NAME=salcapa-ledger-acceptance-b48224
          if ! az account show --only-show-errors >/dev/null 2>&1; then exit 0; fi
          if az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" --only-show-errors >/dev/null 2>&1; then
            az containerapp job delete --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" --yes --only-show-errors
          fi
          test "$(az containerapp job list --resource-group "$RESOURCE_GROUP" \
            --query "[?name == '$JOB_NAME'] | length(@)" --output tsv --only-show-errors)" = "0"
