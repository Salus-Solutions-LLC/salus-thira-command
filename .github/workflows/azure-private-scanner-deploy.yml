name: SalCAPA protected private scanner test-job deployment

on:
  push:
    branches:
      - development/salcapa-platform
    paths:
      - 'deploy/azure/activations/private-scanner-test-dev.json'

permissions:
  contents: read

concurrency:
  group: salcapa-private-scanner-job-deploy-dev
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: salcapa-dev-approval
    permissions: {}
    steps:
      - run: echo 'Protected private scanner job-deployment gate passed.'

  deploy:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      SOURCE_RELEASE: release/v3.212
      SOURCE_COMMIT: 7867fa72ae404aa5ed37abd104ecc1c69b9ea190
      IMAGE_DIGEST: sha256:36b48158a6cb13bc8f408af0f9b6cefcf49014907ce117e14898a08f892498bc
      RESOURCE_GROUP: rg-salcapa-dev
      LOCATION: southcentralus
      EXPECTED_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      EXPECTED_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      APPROVAL_RECORD: MD-PRIVATE-SCANNER-JOB-20261003
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/v3.212
          path: frozen-release
          fetch-depth: 1
          persist-credentials: false
      - name: Confirm frozen source and private manual job bounds
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C frozen-release rev-parse HEAD)" = "$SOURCE_COMMIT"
          git merge-base --is-ancestor "$SOURCE_COMMIT" "$GITHUB_SHA"
          python - <<'PY'
          from pathlib import Path
          source = Path('frozen-release/infra/azure/private-scanner-acceptance.bicep').read_text(encoding='utf-8')
          required = (
              "name: '${stem}-scan-test'",
              "triggerType: 'Manual'",
              'replicaTimeout: 1200',
              'replicaRetryLimit: 0',
              'parallelism: 1',
              'replicaCompletionCount: 1',
              "cpu: json('0.25')",
              "memory: '0.5Gi'",
          )
          if any(item not in source for item in required):
              raise SystemExit('Frozen private-job resource bounds changed')
          if "ingress:" in source or "scheduleTriggerConfig:" in source:
              raise SystemExit('Private job has ingress or schedule')
          print('Frozen manual private job: 0.25 CPU, 0.5 GiB, one replica, 20-minute cap')
          PY
      - name: Verify exact reviewed activation record
        shell: bash
        run: |
          set -euo pipefail
          test -f deploy/azure/activations/private-scanner-test-dev.json
          jq -e --arg source "$SOURCE_COMMIT" --arg digest "$IMAGE_DIGEST" --arg approval "$APPROVAL_RECORD" '
            type == "object" and
            .schema_version == 1 and
            .operation == "create_private_scanner_test_job" and
            .target_environment == "dev" and
            .resource_group == "rg-salcapa-dev" and
            .location == "southcentralus" and
            .source_release == "release/v3.212" and
            .source_commit == $source and
            .image_digest == $digest and
            .approval_record == $approval and
            .preview_run_id == 37169892674 and
            .initial_executions == 0 and
            .job_timeout_seconds == 1200 and
            .job_cpu == 0.25 and
            .job_memory_gib == 0.5 and
            ((keys - ["schema_version","operation","target_environment","resource_group","location","source_release","source_commit","image_digest","approval_record","preview_run_id","initial_executions","job_timeout_seconds","job_cpu","job_memory_gib"]) | length == 0)
          ' deploy/azure/activations/private-scanner-test-dev.json >/dev/null
      - uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verify target and image without reading Member files
        shell: bash
        run: |
          set -euo pipefail
          test "$(az account show --query id -o tsv)" = "$EXPECTED_SUBSCRIPTION_ID"
          test "$(az account show --query tenantId -o tsv)" = "$EXPECTED_TENANT_ID"
          test "$(az group show -n "$RESOURCE_GROUP" --query location -o tsv)" = "$LOCATION"
          actual="$(az acr manifest show-metadata --registry salcapadevb48224acr --name "salcapa:source-$SOURCE_COMMIT" --query digest -o tsv)"
          test "$actual" = "$IMAGE_DIGEST"
          echo 'Azure target and frozen image digest verified.'
      - name: Recheck Azure what-if immediately before job creation
        shell: bash
        run: |
          set -euo pipefail
          az bicep build --file frozen-release/infra/azure/private-scanner-acceptance.bicep --outfile "$RUNNER_TEMP/private-scanner.json" >/dev/null
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --name "salcapa-private-scanner-preview-${GITHUB_RUN_ID}" \
            --template-file "$RUNNER_TEMP/private-scanner.json" \
            --parameters environmentName=dev uniqueSuffix=b48224 location="$LOCATION" \
              imageDigest="salcapadevb48224acr.azurecr.io/salcapa@$IMAGE_DIGEST" \
              sourceCommit="$SOURCE_COMMIT" \
              approvalRecord="$APPROVAL_RECORD" \
            --mode Incremental --no-pretty-print --output json > "$RUNNER_TEMP/private-scanner-whatif.json"
          python - "$RUNNER_TEMP/private-scanner-whatif.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          result = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          changes = result.get('changes') or result.get('properties', {}).get('changes')
          if not isinstance(changes, list):
              raise SystemExit('Azure preview did not return a change list')
          import os
          expected = (
              f"/subscriptions/{os.environ['EXPECTED_SUBSCRIPTION_ID']}"
              f"/resourcegroups/{os.environ['RESOURCE_GROUP']}"
              "/providers/microsoft.app/jobs/salcapa-dev-b48224-scan-test"
          ).lower()
          counts = {'create': 0, 'nochange': 0, 'ignore': 0, 'other': 0}
          creates = []
          for change in changes:
              kind = str(change.get('changeType', '')).lower() if isinstance(change, dict) else ''
              if kind in ('create', 'nochange', 'ignore'):
                  counts[kind] += 1
              else:
                  counts['other'] += 1
              if kind == 'create':
                  creates.append(change)
          print(
              'Azure preview change types: '
              f"Create={counts['create']}, NoChange={counts['nochange']}, "
              f"Ignore={counts['ignore']}, other={counts['other']}"
          )
          if counts['other'] or len(creates) != 1:
              raise SystemExit('Azure preview contains unexpected change types or creation count')
          resource = str(creates[0].get('resourceId', '')).lower()
          if resource != expected:
              raise SystemExit('Azure preview creation is not the exact private scanner job')
          print('Azure incremental preview: one exact private manual test job Create; no modifications or deletions.')
          PY
      - name: Create only the reviewed manual test job and verify its readback
        shell: bash
        run: |
          set -euo pipefail
          az deployment group create \
            --mode Incremental \
            --resource-group "$RESOURCE_GROUP" \
            --name "salcapa-private-scanner-deploy-$GITHUB_RUN_ID" \
            --template-file "$RUNNER_TEMP/private-scanner.json" \
            --parameters environmentName=dev uniqueSuffix=b48224 location="$LOCATION" \
              imageDigest="salcapadevb48224acr.azurecr.io/salcapa@$IMAGE_DIGEST" \
              sourceCommit="$SOURCE_COMMIT" approvalRecord="$APPROVAL_RECORD" \
            --output none
          JOB_ID="/subscriptions/$EXPECTED_SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.App/jobs/salcapa-dev-b48224-scan-test"
          az rest --method GET \
            --url "https://management.azure.com$JOB_ID?api-version=2025-01-01" \
            --output json > "$RUNNER_TEMP/private-scanner-job-readback.json"
          IDENTITY_ID="/subscriptions/$EXPECTED_SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.ManagedIdentity/userAssignedIdentities/salcapa-dev-b48224-identity"
          jq -e --arg job "$JOB_ID" --arg identity "$IDENTITY_ID" \
                --arg image "salcapadevb48224acr.azurecr.io/salcapa@$IMAGE_DIGEST" \
                --arg source "$SOURCE_COMMIT" --arg approval "$APPROVAL_RECORD" '
            (.id | ascii_downcase) == ($job | ascii_downcase) and
            .tags.sourceCommit == $source and
            .tags.approvalRecord == $approval and
            .identity.type == "UserAssigned" and
            (.identity.userAssignedIdentities | keys | length) == 1 and
            ([.identity.userAssignedIdentities | keys[] | ascii_downcase] | index($identity | ascii_downcase)) != null and
            .properties.configuration.triggerType == "Manual" and
            .properties.configuration.replicaTimeout == 1200 and
            .properties.configuration.replicaRetryLimit == 0 and
            .properties.configuration.manualTriggerConfig.parallelism == 1 and
            .properties.configuration.manualTriggerConfig.replicaCompletionCount == 1 and
            (.properties.template.containers | length) == 1 and
            .properties.template.containers[0].image == $image and
            .properties.template.containers[0].resources.cpu == 0.25 and
            .properties.template.containers[0].resources.memory == "0.5Gi" and
            .properties.configuration.scheduleTriggerConfig == null and
            (.properties | has("ingress") | not)
          ' "$RUNNER_TEMP/private-scanner-job-readback.json" >/dev/null
          echo 'Exact private manual scanner test job created and read back. No execution started.'
