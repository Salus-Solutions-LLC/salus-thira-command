name: SalCAPA Domain CI

on:
  push:
    branches:
      - development/salcapa-pricing-engine
  pull_request:
    paths:
      - 'pricing_engine.py'
      - 'pte_engine.py'
      - 'capability_posture*.py'
      - 'static/capability_posture.*'
      - 'tools/ci_salcapa_posture_smoke.py'
      - '.github/workflows/salcapa-domain.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: salcapa-domain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  salcapa-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install runtime and security tools
        run: python -m pip install -r requirements.txt -r requirements-ci.txt
      - name: Compile SalCAPA domain
        run: >-
          python -m py_compile
          pricing_engine.py pte_engine.py capability_posture.py
          capability_posture_store.py capability_posture_source.py
          capability_posture_api.py tools/ci_salcapa_posture_smoke.py
      - name: Validate capability posture JavaScript
        run: node --check static/capability_posture.js
      - name: Run SalCAPA pricing PTE posture smoke
        run: python tools/ci_salcapa_posture_smoke.py
      - name: Static security scan
        run: >-
          bandit -q -ll -s B608
          pricing_engine.py pte_engine.py capability_posture.py
          capability_posture_store.py capability_posture_source.py
          capability_posture_api.py tools/ci_salcapa_posture_smoke.py
