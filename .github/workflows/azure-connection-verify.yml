name: SalCAPA Azure connection verification

on:
  workflow_dispatch:
  push:
    branches:
      - development/salcapa-platform
    paths:
      - 'infra/azure/**'
      - 'docs/AZURE_*.md'
      - 'docs/RELEASE_NOTES_v3.*.md'
      - 'source_archives/v3.25/**'
      - 'tools/reconstruct_v325_source.py'
      - 'tools/verify_v325_source.py'
      - 'tools/ci_passwordless_runtime_smoke.py'
      - '.github/workflows/azure-connection-verify.yml'
      - '.github/workflows/azure-production-deploy.yml'
      - '.github/workflows/azure-infrastructure-validate.yml'
      - '.github/workflows/azure-foundation-activate.yml'
      - '.github/workflows/azure-image-publish.yml'
      - '.github/workflows/azure-database-bootstrap.yml'
      - 'deploy/azure/activations/foundation-dev.json'
      - 'deploy/azure/activations/image-dev.json'
      - 'deploy/azure/activations/database-dev.json'

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate required non-secret variables
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          POSTGRES_ADMIN_OBJECT_ID: ${{ vars.POSTGRES_ADMIN_OBJECT_ID }}
          POSTGRES_ADMIN_PRINCIPAL_NAME: ${{ vars.POSTGRES_ADMIN_PRINCIPAL_NAME }}
          POSTGRES_ADMIN_PRINCIPAL_TYPE: ${{ vars.POSTGRES_ADMIN_PRINCIPAL_TYPE }}
          DEPLOYMENT_PRINCIPAL_OBJECT_ID: ${{ vars.DEPLOYMENT_PRINCIPAL_OBJECT_ID }}
          AZURE_BUDGET_CONTACT_EMAIL: ${{ vars.AZURE_BUDGET_CONTACT_EMAIL }}
        run: |
          set -euo pipefail
          required=(
            AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP
            AZURE_LOCATION POSTGRES_ADMIN_OBJECT_ID POSTGRES_ADMIN_PRINCIPAL_NAME
            POSTGRES_ADMIN_PRINCIPAL_TYPE DEPLOYMENT_PRINCIPAL_OBJECT_ID
            AZURE_BUDGET_CONTACT_EMAIL
          )
          for name in "${required[@]}"; do
            test -n "${!name}" || { echo "Missing repository variable: $name" >&2; exit 1; }
          done
          if [[ ! "$POSTGRES_ADMIN_PRINCIPAL_TYPE" =~ ^(Group|User)$ ]]; then
            echo "POSTGRES_ADMIN_PRINCIPAL_TYPE must be Group or User." >&2
            exit 1
          fi
          if [[ ! "$AZURE_BUDGET_CONTACT_EMAIL" =~ ^[^[:space:]@]+@[^[:space:]@]+\.[^[:space:]@]+$ ]]; then
            echo "AZURE_BUDGET_CONTACT_EMAIL is not a valid notification address." >&2
            exit 1
          fi

      - name: Azure login through workload identity federation
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify exact Azure target and principal scope without provisioning
        env:
          EXPECTED_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          EXPECTED_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          EXPECTED_LOCATION: ${{ vars.AZURE_LOCATION }}
          DEPLOYMENT_PRINCIPAL_OBJECT_ID: ${{ vars.DEPLOYMENT_PRINCIPAL_OBJECT_ID }}
        run: |
          set -euo pipefail
          ACTUAL_SUBSCRIPTION_ID="$(az account show --query id --output tsv)"
          ACTUAL_TENANT_ID="$(az account show --query tenantId --output tsv)"
          ACTUAL_LOCATION="$(az group show --name "$RESOURCE_GROUP" --query location --output tsv)"
          test "$ACTUAL_SUBSCRIPTION_ID" = "$EXPECTED_SUBSCRIPTION_ID"
          test "$ACTUAL_TENANT_ID" = "$EXPECTED_TENANT_ID"
          test "$ACTUAL_LOCATION" = "$EXPECTED_LOCATION"

          EXPECTED_SCOPE="/subscriptions/$EXPECTED_SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP"
          az role assignment list \
            --assignee-object-id "$DEPLOYMENT_PRINCIPAL_OBJECT_ID" \
            --all \
            --query "[].{role:roleDefinitionName,scope:scope}" \
            --output json > /tmp/salcapa-role-assignments.json

          ASSIGNMENT_COUNT="$(jq 'length' /tmp/salcapa-role-assignments.json)"
          test "$ASSIGNMENT_COUNT" -gt 0 || { echo "Deployment principal has no visible role assignments." >&2; exit 1; }
          jq -e --arg scope "$EXPECTED_SCOPE" '
            all(.[];
              ((.scope | ascii_downcase) == ($scope | ascii_downcase)) or
              (.scope | ascii_downcase | startswith(($scope | ascii_downcase) + "/"))
            )
          ' /tmp/salcapa-role-assignments.json >/dev/null || {
              echo "Deployment principal has an assignment outside the approved resource-group boundary." >&2
              exit 1
            }
          jq -e --arg scope "$EXPECTED_SCOPE" '
            any(.[];
              (.role == "Contributor" or .role == "Owner") and
              ((.scope | ascii_downcase) == ($scope | ascii_downcase))
            )
          ' /tmp/salcapa-role-assignments.json >/dev/null || {
              echo "Deployment principal lacks resource-group deployment authority." >&2
              exit 1
            }
          jq -e --arg scope "$EXPECTED_SCOPE" '
            any(.[];
              (.role == "User Access Administrator" or .role == "Role Based Access Control Administrator" or .role == "Owner") and
              ((.scope | ascii_downcase) == ($scope | ascii_downcase))
            )
          ' /tmp/salcapa-role-assignments.json >/dev/null || {
              echo "Deployment principal lacks scoped role-assignment authority required by the template." >&2
              exit 1
            }
          echo "Azure workload identity accepted for the exact governed resource-group scope."

      - name: Inventory current foundation state and provider readiness
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          PROVIDERS=(
            Microsoft.App Microsoft.ContainerRegistry Microsoft.DBforPostgreSQL
            Microsoft.Insights Microsoft.KeyVault Microsoft.ManagedIdentity
            Microsoft.Network Microsoft.OperationalInsights Microsoft.Storage
            Microsoft.Consumption
          )
          {
            echo "### Azure provider readiness"
            echo ""
            echo "| Provider | Registration state |"
            echo "|---|---|"
            for provider in "${PROVIDERS[@]}"; do
              state="$(az provider show --namespace "$provider" --query registrationState --output tsv)"
              echo "| $provider | $state |"
              if [ "$state" != "Registered" ]; then
                echo "::warning::Azure provider $provider is $state"
              fi
            done
            echo ""
            echo "### Current rg-salcapa-dev resource inventory"
            echo ""
            count="$(az resource list --resource-group "$RESOURCE_GROUP" --query 'length(@)' --output tsv)"
            echo "- Resource count: $count"
            echo ""
            echo "| Resource type | Resource name |"
            echo "|---|---|"
            az resource list --resource-group "$RESOURCE_GROUP" --output json |
              jq -r '.[] | "| \(.type) | \(.name) |"'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Evaluate required Azure provider readiness
        id: providers
        run: |
          set -euo pipefail
          PROVIDERS=(
            Microsoft.App Microsoft.ContainerRegistry Microsoft.DBforPostgreSQL
            Microsoft.Insights Microsoft.KeyVault Microsoft.ManagedIdentity
            Microsoft.Network Microsoft.OperationalInsights Microsoft.Storage
            Microsoft.Consumption
          )
          ready=true
          for provider in "${PROVIDERS[@]}"; do
            if [ "$(az provider show --namespace "$provider" --query registrationState --output tsv)" != "Registered" ]; then
              ready=false
            fi
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      - name: Required Azure providers registered
        if: steps.providers.outputs.ready == 'true'
        run: echo "Azure provider readiness confirmed."

      - name: Required Azure providers missing
        if: steps.providers.outputs.ready != 'true'
        run: echo "Azure provider registration action remains required."

      - name: Evaluate runtime Entra application configuration
        id: runtime_entra
        env:
          ENTRA_RUNTIME_CLIENT_ID: ${{ vars.ENTRA_RUNTIME_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$ENTRA_RUNTIME_CLIENT_ID" ]; then
            state=pending
          elif [[ "$ENTRA_RUNTIME_CLIENT_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            state=configured
          else
            state=invalid
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Runtime Entra application configured
        if: steps.runtime_entra.outputs.state == 'configured'
        run: echo "Runtime Entra application client ID is configured for governed deployment validation."

      - name: Runtime Entra application pending
        if: steps.runtime_entra.outputs.state == 'pending'
        run: echo "Runtime Entra application and federated credential action remain pending."

      - name: Runtime Entra application configuration invalid
        if: steps.runtime_entra.outputs.state == 'invalid'
        run: echo "::warning::ENTRA_RUNTIME_CLIENT_ID is present but is not a valid UUID."

      - name: Run live foundation what-if without provisioning
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          LOCATION: ${{ vars.AZURE_LOCATION }}
          ENTRA_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          POSTGRES_ADMIN_OBJECT_ID: ${{ vars.POSTGRES_ADMIN_OBJECT_ID }}
          POSTGRES_ADMIN_PRINCIPAL_NAME: ${{ vars.POSTGRES_ADMIN_PRINCIPAL_NAME }}
          POSTGRES_ADMIN_PRINCIPAL_TYPE: ${{ vars.POSTGRES_ADMIN_PRINCIPAL_TYPE }}
          DEPLOYMENT_PRINCIPAL_OBJECT_ID: ${{ vars.DEPLOYMENT_PRINCIPAL_OBJECT_ID }}
          AZURE_BUDGET_CONTACT_EMAIL: ${{ vars.AZURE_BUDGET_CONTACT_EMAIL }}
          UNIQUE_SUFFIX: b48224
          APPROVAL_RECORD: MD-APPROVAL-AZURE-LEAN-20260904
        run: |
          set -euo pipefail
          EXPECTED_SCOPE="/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/$RESOURCE_GROUP"
          PARAMETERS=(
            uniqueSuffix="$UNIQUE_SUFFIX"
            location="$LOCATION"
            environmentName=dev
            provisionApplication=false
            entraTenantId="$ENTRA_TENANT_ID"
            postgresAdminObjectId="$POSTGRES_ADMIN_OBJECT_ID"
            postgresAdminPrincipalName="$POSTGRES_ADMIN_PRINCIPAL_NAME"
            postgresAdminPrincipalType="$POSTGRES_ADMIN_PRINCIPAL_TYPE"
            deploymentPrincipalObjectId="$DEPLOYMENT_PRINCIPAL_OBJECT_ID"
            sourceCommit="$GITHUB_SHA"
            approvalRecord="$APPROVAL_RECORD"
            monthlyCostCeilingUsd=30
            operationalBudgetUsd=25
            budgetContactEmail="$AZURE_BUDGET_CONTACT_EMAIL"
          )
          az deployment group what-if \
            --name "salcapa-preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/azure/main.bicep \
            --parameters "${PARAMETERS[@]}" \
            --result-format FullResourcePayloads \
            --no-pretty-print \
            --output json > /tmp/salcapa-foundation-what-if.json

          jq -e '.changes | type == "array"' /tmp/salcapa-foundation-what-if.json >/dev/null
          jq -e --arg scope "$EXPECTED_SCOPE" '
            all(.changes[];
              (.resourceId | type == "string") and
              (.resourceId | ascii_downcase | startswith($scope | ascii_downcase))
            )
          ' /tmp/salcapa-foundation-what-if.json >/dev/null || {
            echo "Foundation what-if contains a resource outside the governed development resource group." >&2
            exit 1
          }
          jq -e 'all(.changes[]; .changeType != "Delete")' \
            /tmp/salcapa-foundation-what-if.json >/dev/null || {
              echo "Foundation what-if contains a destructive delete." >&2
              exit 1
            }
          jq -e 'all(.changes[];
            if (.resourceId | ascii_downcase | contains("/providers/microsoft.app/containerapps/"))
            then (.changeType | IN("Ignore", "NoEffect"))
            else true
            end
          )' /tmp/salcapa-foundation-what-if.json >/dev/null || {
            echo "Foundation what-if attempted to create, modify, or delete the SalCAPA application." >&2
            exit 1
          }

          CHANGE_COUNT="$(jq '.changes | length' /tmp/salcapa-foundation-what-if.json)"
          {
            echo "### Governed SalCAPA Azure foundation preflight"
            echo ""
            echo "- Result: live Azure what-if passed without provisioning"
            echo "- Scope: $RESOURCE_GROUP only"
            echo "- Region: $LOCATION"
            echo "- Unique suffix: $UNIQUE_SUFFIX"
            echo "- Proposed resource changes: $CHANGE_COUNT"
            echo "- Destructive deletes: none"
            echo "- Container App mutation by foundation preflight: none"
            echo "- Monthly authorization ceiling: USD 30"
          } >> "$GITHUB_STEP_SUMMARY"
