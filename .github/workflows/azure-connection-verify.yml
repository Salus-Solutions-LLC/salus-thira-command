name: SalCAPA Azure connection verification

on:
  workflow_dispatch:
  push:
    branches:
      - development/salcapa-platform
    paths:
      - 'infra/azure/**'
      - 'docs/AZURE_*.md'
      - '.github/workflows/azure-connection-verify.yml'
      - '.github/workflows/azure-production-deploy.yml'

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate required non-secret variables
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          POSTGRES_ADMIN_OBJECT_ID: ${{ vars.POSTGRES_ADMIN_OBJECT_ID }}
          POSTGRES_ADMIN_PRINCIPAL_NAME: ${{ vars.POSTGRES_ADMIN_PRINCIPAL_NAME }}
          POSTGRES_ADMIN_PRINCIPAL_TYPE: ${{ vars.POSTGRES_ADMIN_PRINCIPAL_TYPE }}
          DEPLOYMENT_PRINCIPAL_OBJECT_ID: ${{ vars.DEPLOYMENT_PRINCIPAL_OBJECT_ID }}
          AZURE_BUDGET_CONTACT_EMAIL: ${{ vars.AZURE_BUDGET_CONTACT_EMAIL }}
        run: |
          set -euo pipefail
          required=(
            AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP
            AZURE_LOCATION POSTGRES_ADMIN_OBJECT_ID POSTGRES_ADMIN_PRINCIPAL_NAME
            POSTGRES_ADMIN_PRINCIPAL_TYPE DEPLOYMENT_PRINCIPAL_OBJECT_ID
            AZURE_BUDGET_CONTACT_EMAIL
          )
          for name in "${required[@]}"; do
            test -n "${!name}" || { echo "Missing repository variable: $name" >&2; exit 1; }
          done
          if [[ ! "$POSTGRES_ADMIN_PRINCIPAL_TYPE" =~ ^(Group|User)$ ]]; then
            echo "POSTGRES_ADMIN_PRINCIPAL_TYPE must be Group or User." >&2
            exit 1
          fi
          if [[ ! "$AZURE_BUDGET_CONTACT_EMAIL" =~ ^[^[:space:]@]+@[^[:space:]@]+\.[^[:space:]@]+$ ]]; then
            echo "AZURE_BUDGET_CONTACT_EMAIL is not a valid notification address." >&2
            exit 1
          fi

      - name: Azure login through workload identity federation
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify exact Azure target and principal scope without provisioning
        env:
          EXPECTED_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          EXPECTED_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          EXPECTED_LOCATION: ${{ vars.AZURE_LOCATION }}
          DEPLOYMENT_PRINCIPAL_OBJECT_ID: ${{ vars.DEPLOYMENT_PRINCIPAL_OBJECT_ID }}
        run: |
          set -euo pipefail
          ACTUAL_SUBSCRIPTION_ID="$(az account show --query id --output tsv)"
          ACTUAL_TENANT_ID="$(az account show --query tenantId --output tsv)"
          ACTUAL_LOCATION="$(az group show --name "$RESOURCE_GROUP" --query location --output tsv)"
          test "$ACTUAL_SUBSCRIPTION_ID" = "$EXPECTED_SUBSCRIPTION_ID"
          test "$ACTUAL_TENANT_ID" = "$EXPECTED_TENANT_ID"
          test "$ACTUAL_LOCATION" = "$EXPECTED_LOCATION"

          EXPECTED_SCOPE="/subscriptions/$EXPECTED_SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP"
          az role assignment list \
            --assignee-object-id "$DEPLOYMENT_PRINCIPAL_OBJECT_ID" \
            --all \
            --query "[].{role:roleDefinitionName,scope:scope}" \
            --output json > /tmp/salcapa-role-assignments.json

          ASSIGNMENT_COUNT="$(jq 'length' /tmp/salcapa-role-assignments.json)"
          test "$ASSIGNMENT_COUNT" -gt 0 || { echo "Deployment principal has no visible role assignments." >&2; exit 1; }
          jq -e --arg scope "$EXPECTED_SCOPE" 'all(.[]; (.scope | ascii_downcase) == ($scope | ascii_downcase))' \
            /tmp/salcapa-role-assignments.json >/dev/null || {
              echo "Deployment principal has an assignment outside the approved resource group." >&2
              exit 1
            }
          jq -e 'any(.[]; .role == "Contributor" or .role == "Owner")' \
            /tmp/salcapa-role-assignments.json >/dev/null || {
              echo "Deployment principal lacks resource-group deployment authority." >&2
              exit 1
            }
          jq -e 'any(.[]; .role == "User Access Administrator" or .role == "Role Based Access Control Administrator" or .role == "Owner")' \
            /tmp/salcapa-role-assignments.json >/dev/null || {
              echo "Deployment principal lacks scoped role-assignment authority required by the template." >&2
              exit 1
            }
          echo "Azure workload identity accepted for the exact governed resource-group scope."
