name: SalCAPA Azure connection verification

on:
  workflow_dispatch:
  push:
    branches:
      - development/salcapa-platform
    paths:
      - .github/workflows/azure-connection-verify.yml
      - .github/workflows/azure-production-deploy.yml
      - infra/azure/**
      - docs/AZURE_*.md

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate required non-secret variables
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          POSTGRES_ADMIN_OBJECT_ID: ${{ vars.POSTGRES_ADMIN_OBJECT_ID }}
          POSTGRES_ADMIN_PRINCIPAL_NAME: ${{ vars.POSTGRES_ADMIN_PRINCIPAL_NAME }}
          POSTGRES_ADMIN_PRINCIPAL_TYPE: ${{ vars.POSTGRES_ADMIN_PRINCIPAL_TYPE }}
          DEPLOYMENT_PRINCIPAL_OBJECT_ID: ${{ vars.DEPLOYMENT_PRINCIPAL_OBJECT_ID }}
          AZURE_BUDGET_CONTACT_EMAIL: ${{ vars.AZURE_BUDGET_CONTACT_EMAIL }}
        run: |
          set -euo pipefail
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP AZURE_LOCATION POSTGRES_ADMIN_OBJECT_ID POSTGRES_ADMIN_PRINCIPAL_NAME POSTGRES_ADMIN_PRINCIPAL_TYPE DEPLOYMENT_PRINCIPAL_OBJECT_ID AZURE_BUDGET_CONTACT_EMAIL; do
            test -n "${!name}" || { echo "Missing repository variable: $name" >&2; exit 1; }
          done
          [[ "$POSTGRES_ADMIN_PRINCIPAL_TYPE" =~ ^(Group|User)$ ]] || {
            echo "POSTGRES_ADMIN_PRINCIPAL_TYPE must be Group or User." >&2
            exit 1
          }
          [[ "$AZURE_BUDGET_CONTACT_EMAIL" =~ ^[^[:space:]@]+@[^[:space:]@]+\.[^[:space:]@]+$ ]] || {
            echo "AZURE_BUDGET_CONTACT_EMAIL is not a valid notification address." >&2
            exit 1
          }

      - name: Azure login through workload identity federation
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify scoped Azure target without deploying
        env:
          EXPECTED_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          EXPECTED_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          EXPECTED_LOCATION: ${{ vars.AZURE_LOCATION }}
          DEPLOYMENT_PRINCIPAL_OBJECT_ID: ${{ vars.DEPLOYMENT_PRINCIPAL_OBJECT_ID }}
        run: |
          set -euo pipefail
          ACTUAL_SUBSCRIPTION_ID="$(az account show --query id --output tsv)"
          ACTUAL_TENANT_ID="$(az account show --query tenantId --output tsv)"
          ACTUAL_LOCATION="$(az group show --name "$RESOURCE_GROUP" --query location --output tsv)"
          test "$ACTUAL_SUBSCRIPTION_ID" = "$EXPECTED_SUBSCRIPTION_ID"
          test "$ACTUAL_TENANT_ID" = "$EXPECTED_TENANT_ID"
          test "$ACTUAL_LOCATION" = "$EXPECTED_LOCATION"
          RESOURCE_GROUP_ID="$(az group show --name "$RESOURCE_GROUP" --query id --output tsv)"
          ROLE_ROWS="$(az role assignment list --assignee-object-id "$DEPLOYMENT_PRINCIPAL_OBJECT_ID" --include-inherited --all --query "[].{role:roleDefinitionName,scope:scope}" --output tsv)"
          test -n "$ROLE_ROWS" || { echo "The deployment principal has no visible Azure role assignment." >&2; exit 1; }
          OUT_OF_SCOPE="$(az role assignment list --assignee-object-id "$DEPLOYMENT_PRINCIPAL_OBJECT_ID" --include-inherited --all --query "[?scope!='${RESOURCE_GROUP_ID}'].scope" --output tsv)"
          test -z "$OUT_OF_SCOPE" || {
            echo "The deployment principal has an assignment outside the approved development resource group." >&2
            exit 1
          }
          ROLE_NAMES="$(az role assignment list --assignee-object-id "$DEPLOYMENT_PRINCIPAL_OBJECT_ID" --scope "$RESOURCE_GROUP_ID" --query "[?scope=='${RESOURCE_GROUP_ID}'].roleDefinitionName" --output tsv)"
          if ! grep -Eq '^(Contributor|Owner) <<<"$ROLE_NAMES"; then
            echo "The deployment principal requires Contributor at the approved resource group." >&2
            exit 1
          fi
          if ! grep -Eq '^(Role Based Access Control Administrator|User Access Administrator|Owner) <<<"$ROLE_NAMES"; then
            echo "The deployment principal requires scoped role-assignment authority for managed-identity grants." >&2
            exit 1
          fi
          echo "Azure workload identity and resource-group-only scope verified."
