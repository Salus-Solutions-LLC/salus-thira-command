name: SalCAPA scanner read-only diagnostic

on:
  push:
    branches:
      - development/salcapa-platform
    paths:
      - '.github/workflows/salcapa-scanner-readonly-diagnostic.yml'

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    environment: salcapa-dev-approval
    permissions: {}
    steps:
      - run: echo "Protected read-only scanner diagnostic gate passed."

  diagnose:
    needs: authorize
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Inspect scanner scheduling and alert routing without Member data
        env:
          EXPECTED_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          EXPECTED_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(az account show --query id --output tsv)" = "$EXPECTED_SUBSCRIPTION_ID"
          test "$(az account show --query tenantId --output tsv)" = "$EXPECTED_TENANT_ID"
          az containerapp job show -g rg-salcapa-dev -n salcapa-dev-b48224-scan-worker -o json > "$RUNNER_TEMP/result-job.json"
          az containerapp job show -g rg-salcapa-dev -n salcapa-dev-b48224-scan-inv -o json > "$RUNNER_TEMP/inventory-job.json"
          az containerapp job execution list -g rg-salcapa-dev -n salcapa-dev-b48224-scan-worker -o json > "$RUNNER_TEMP/result-executions.json"
          az containerapp job execution list -g rg-salcapa-dev -n salcapa-dev-b48224-scan-inv -o json > "$RUNNER_TEMP/inventory-executions.json"
          az monitor metrics alert show -g rg-salcapa-dev -n salcapa-dev-b48224-scan-result-worker-failed -o json > "$RUNNER_TEMP/result-failed-alert.json"
          az monitor metrics alert show -g rg-salcapa-dev -n salcapa-dev-b48224-scan-inventory-failed -o json > "$RUNNER_TEMP/inventory-failed-alert.json"
          az resource show -g rg-salcapa-dev --resource-type Microsoft.Insights/scheduledQueryRules --api-version 2023-12-01 -n salcapa-dev-b48224-scan-result-worker-missed -o json > "$RUNNER_TEMP/result-missed-alert.json"
          az resource show -g rg-salcapa-dev --resource-type Microsoft.Insights/scheduledQueryRules --api-version 2023-12-01 -n salcapa-dev-b48224-scan-inventory-missed -o json > "$RUNNER_TEMP/inventory-missed-alert.json"
          az monitor action-group show -g rg-salcapa-dev -n salcapa-dev-b48224-scan-alerts-v2 -o json > "$RUNNER_TEMP/action-group.json"
          python - "$RUNNER_TEMP" <<'PY'
          import json
          import sys
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          base = Path(sys.argv[1])
          expected = "sha256:0936238597e51f13138d9121724328d170ab71000693b5bde4272456d320b966"
          cutoff = datetime.now(timezone.utc) - timedelta(hours=12)

          def load(name):
              return json.loads((base / name).read_text(encoding="utf-8"))

          def rows(value):
              return value.get("value", []) if isinstance(value, dict) else value

          def recent_executions(name):
              result = []
              for row in rows(load(name)):
                  props = row.get("properties", {})
                  raw = props.get("startTime") or ""
                  try:
                      stamp = datetime.fromisoformat(raw.replace("Z", "+00:00"))
                  except ValueError:
                      continue
                  if stamp >= cutoff:
                      result.append((stamp, str(props.get("status") or "Unknown")))
              return sorted(result)

          healthy = True
          for label, job_file, execution_file in (
              ("result", "result-job.json", "result-executions.json"),
              ("inventory", "inventory-job.json", "inventory-executions.json"),
          ):
              job = load(job_file)
              props = job.get("properties", {})
              config = props.get("configuration", {})
              containers = props.get("template", {}).get("containers", [])
              images = [str(item.get("image") or "") for item in containers]
              schedule = config.get("scheduleTriggerConfig", {}).get("cronExpression")
              recent = recent_executions(execution_file)
              counts = {}
              for _, status in recent:
                  counts[status] = counts.get(status, 0) + 1
              schedule_ok = schedule == ("*/5 * * * *" if label == "result" else "0 2 * * *")
              image_ok = len(images) == 1 and expected in images[0]
              healthy = healthy and schedule_ok and image_ok
              print(f"{label}_schedule_ok={schedule_ok}")
              print(f"{label}_expected_image={image_ok}")
              print(f"{label}_executions_12h={len(recent)}")
              print(f"{label}_status_counts={json.dumps(counts, sort_keys=True)}")
              print(f"{label}_last_start_utc={recent[-1][0].isoformat() if recent else 'none'}")

          action = load("action-group.json").get("properties", {})
          print("alert_group_enabled=" + str(bool(action.get("enabled"))))
          receiver_count = len(action.get("emailReceivers") or [])
          healthy = healthy and bool(action.get("enabled")) and receiver_count > 0
          print("alert_group_receiver_count=" + str(receiver_count))
          alert_files = {
              "salcapa-dev-b48224-scan-result-worker-failed": "result-failed-alert.json",
              "salcapa-dev-b48224-scan-result-worker-missed": "result-missed-alert.json",
              "salcapa-dev-b48224-scan-inventory-failed": "inventory-failed-alert.json",
              "salcapa-dev-b48224-scan-inventory-missed": "inventory-missed-alert.json",
          }
          for name, filename in sorted(alert_files.items()):
              props = load(filename).get("properties", {})
              raw_actions = props.get("actions", [])
              if isinstance(raw_actions, dict):
                  raw_actions = raw_actions.get("actionGroups", [])
              action_ids = [str(item.get("actionGroupId") if isinstance(item, dict) else item).lower()
                            for item in raw_actions]
              enabled = bool(props.get("enabled"))
              routed = any(value.endswith("/salcapa-dev-b48224-scan-alerts-v2") for value in action_ids)
              healthy = healthy and enabled and routed
              print(f"{name}_enabled={enabled}")
              print(f"{name}_v2_route={routed}")
          print("scanner_configuration_healthy=" + str(healthy))
          if not healthy:
              raise SystemExit(1)
          PY
