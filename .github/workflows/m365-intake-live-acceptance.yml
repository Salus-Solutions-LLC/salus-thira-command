name: SalCAPA Microsoft 365 intake live acceptance

on:
  push:
    branches:
      - development/salcapa-platform
    paths:
      - .github/workflows/m365-intake-live-acceptance.yml
      - tools/live_m365_intake_acceptance.py

permissions:
  contents: read
  id-token: write

concurrency:
  group: salcapa-m365-intake-live-acceptance
  cancel-in-progress: false

jobs:
  accept-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: salcapa-dev-approval
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Azure login through workload identity federation
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verify exact deployed v3.136 image
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          EXPECTED_IMAGE: salcapadevb48224acr.azurecr.io/salcapa@sha256:e7a1a14af003806fa19875cb6ce13cef9e51c6c1f48338939ef7b174e39bc3a9
        run: |
          set -euo pipefail
          test "$(az containerapp show --resource-group "$RESOURCE_GROUP" --name salcapa-dev-b48224 --query 'properties.template.containers[0].image' --output tsv)" = "$EXPECTED_IMAGE"
      - name: Run bounded live OneDrive and SharePoint intake acceptance
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          SCRIPT_B64="$(base64 -w0 tools/live_m365_intake_acceptance.py)"
          COMMAND="python -c \"import base64;exec(compile(base64.b64decode('$SCRIPT_B64'),'<m365-intake-live-acceptance>','exec'))\""
          az containerapp exec \
            --resource-group "$RESOURCE_GROUP" \
            --name salcapa-dev-b48224 \
            --container salcapa \
            --command "$COMMAND" \
            --only-show-errors | tee /tmp/m365-intake-acceptance.log
          grep -q 'M365_LIVE_INTAKE_PASS' /tmp/m365-intake-acceptance.log
      - name: Remove bounded temporary Microsoft 365 Azure test job
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          mapfile -t CANDIDATES < <(
            az containerapp job list --resource-group "$RESOURCE_GROUP" \
              --query "[?contains(name, 'm365') && (contains(name, 'test') || contains(name, 'accept'))].name" \
              --output tsv --only-show-errors
          )
          if [ "${#CANDIDATES[@]}" -gt 1 ]; then
            echo "Multiple Microsoft 365 test jobs matched; refusing broad cleanup." >&2
            exit 1
          fi
          if [ "${#CANDIDATES[@]}" -eq 1 ]; then
            az containerapp job delete \
              --resource-group "$RESOURCE_GROUP" \
              --name "${CANDIDATES[0]}" \
              --yes --only-show-errors
          fi
          REMAINING="$(
            az containerapp job list --resource-group "$RESOURCE_GROUP" \
              --query "[?contains(name, 'm365') && (contains(name, 'test') || contains(name, 'accept'))] | length(@)" \
              --output tsv --only-show-errors
          )"
          test "$REMAINING" = "0"
