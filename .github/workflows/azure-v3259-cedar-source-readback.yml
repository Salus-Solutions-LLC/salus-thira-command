name: SalCAPA v3.259 Cedar paid source readback

on:
  push:
    branches:
      - development/salcapa-platform
    paths:
      - '.github/workflows/azure-v3259-cedar-source-readback.yml'

permissions:
  contents: read

concurrency:
  group: salcapa-v3259-cedar-source-readback
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: salcapa-dev-approval
    permissions: {}
    steps:
      - run: echo 'Protected one-time Cedar source readback approval gate passed.'

  readback:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify one-time source and Azure identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          git merge-base --is-ancestor 6e3900844c6a5cf7fbcfbed1a93375f7585fe74a "$GITHUB_SHA"
          test "$(git show 6e3900844c6a5cf7fbcfbed1a93375f7585fe74a:salcapa_runtime.py | grep -c 'SALCAPA_RELEASE_VERSION = "3.259"')" = 1
      - uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verify exact private job and effective override permissions
        env:
          EXPECTED_SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          EXPECTED_TENANT: ${{ vars.AZURE_TENANT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test "$EXPECTED_SUBSCRIPTION" = '076f90cd-cc6a-4547-a4ff-de3fc1825472'
          test "$EXPECTED_TENANT" = 'e06fd260-a201-44da-b03b-9cde7e119d04'
          test "$(az account show --query id -o tsv)" = "$EXPECTED_SUBSCRIPTION"
          test "$(az account show --query tenantId -o tsv)" = "$EXPECTED_TENANT"
          az containerapp job show -g rg-salcapa-dev -n salcapa-dev-b48224-scan-inv -o json > "$RUNNER_TEMP/job-before.json"
          python - "$RUNNER_TEMP/job-before.json" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1],encoding='utf-8'))
          c=j['properties']['configuration']
          t=j['properties']['template']
          containers=t.get('containers') or []
          expected='salcapadevb48224acr.azurecr.io/salcapa@sha256:715a9e3b74d981226749af04589e2730f3c44359066392cc8fcf16f78e477b44'
          assert j['name']=='salcapa-dev-b48224-scan-inv'
          assert c['triggerType']=='Schedule' and c['scheduleTriggerConfig']['cronExpression']=='0 2 * * *'
          assert len(containers)==1 and containers[0]['image']==expected
          assert j['id'].lower().endswith('/providers/microsoft.app/jobs/salcapa-dev-b48224-scan-inv')
          print('private_inventory_job_exact_image_and_schedule=verified')
          PY
          JOB_ID="$(jq -r .id "$RUNNER_TEMP/job-before.json")"
          az rest --method get --url "https://management.azure.com${JOB_ID}/providers/Microsoft.Authorization/permissions?api-version=2022-04-01" -o json > "$RUNNER_TEMP/permissions.json"
          python - "$RUNNER_TEMP/permissions.json" <<'PY'
          import fnmatch,json,sys
          value=json.load(open(sys.argv[1],encoding='utf-8'))['value']
          def allowed(action):
              for row in value:
                  granted=any(fnmatch.fnmatchcase(action.lower(),x.lower()) for x in row.get('actions',[]))
                  denied=any(fnmatch.fnmatchcase(action.lower(),x.lower()) for x in row.get('notActions',[]))
                  if granted and not denied: return True
              return False
          assert allowed('Microsoft.App/jobs/read')
          assert allowed('Microsoft.App/jobs/start/action')
          assert allowed('Microsoft.App/jobs/write')
          print('private_job_read_start_and_write_permissions=verified')
          PY
      - name: Start one private content-free source comparison
        id: start
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/job-before.json" "$RUNNER_TEMP/readback-template.json" <<'PY'
          import json,sys
          from pathlib import Path
          job=json.load(open(sys.argv[1],encoding='utf-8'))
          template=job['properties']['template']
          code="""
          import hashlib,json
          from app import db,storage
          expected='97A4F3BF4C60DFD5162C4ECF34EFC345F747DD71127284C105FF121BA681C752'
          conn=db()
          try:
              rows=[dict(r) for r in conn.execute(
                  '''SELECT u.assessment_id,u.content_sha256,u.size_bytes,u.scan_status,
                            u.stored_name,i.item_key
                     FROM level1a_intake_uploads u
                     JOIN level1a_intake_items i ON i.id=u.intake_request_id
                       AND i.tenant_id=u.tenant_id AND i.order_id=u.order_id
                     WHERE u.order_id=?''',(10,))]
              matches=[r for r in rows if r['content_sha256'].upper()==expected]
              result={'upload_rows_bounded':len(rows)<=5,
                      'exact_cedar_row':len(matches)==1,
                      'correct_item_and_assessment':False,
                      'clean_and_expected_size':False,
                      'private_copy_exact_sha':False}
              if result['upload_rows_bounded'] and result['exact_cedar_row']:
                  row=matches[0]
                  result['correct_item_and_assessment']=(row['item_key']=='FUN' and row['assessment_id']==5)
                  result['clean_and_expected_size']=(row['scan_status']=='Clean' and row['size_bytes']==39214)
                  if result['correct_item_and_assessment'] and result['clean_and_expected_size']:
                      data=storage.get_bytes(row['stored_name'])
                      result['private_copy_exact_sha']=(len(data)==39214 and hashlib.sha256(data).hexdigest().upper()==expected)
              print('cedar_source_readback_20261028='+json.dumps(result,sort_keys=True))
              if not all(result.values()): raise SystemExit(1)
          except Exception as exc:
              print('cedar_source_readback_error='+type(exc).__name__)
              raise
          finally:
              conn.close()
          """
          template['containers'][0]['command']=['python']
          template['containers'][0]['args']=['-c',code]
          Path(sys.argv[2]).write_text(json.dumps(template),encoding='utf-8')
          PY
          az containerapp job start -g rg-salcapa-dev -n salcapa-dev-b48224-scan-inv --yaml "$RUNNER_TEMP/readback-template.json" -o json > "$RUNNER_TEMP/start.json"
          python - "$RUNNER_TEMP/start.json" "$GITHUB_OUTPUT" <<'PY'
          import json,re,sys
          name=json.load(open(sys.argv[1],encoding='utf-8')).get('name','')
          assert re.fullmatch(r'salcapa-dev-b48224-scan-inv-[a-z0-9]+',name)
          with open(sys.argv[2],'a',encoding='utf-8') as out: out.write('execution='+name+'\n')
          print('private_source_comparison_started=true')
          PY
          az containerapp job show -g rg-salcapa-dev -n salcapa-dev-b48224-scan-inv -o json > "$RUNNER_TEMP/job-after.json"
          jq -cS '{configuration:.properties.configuration,template:.properties.template,identity:.identity}' "$RUNNER_TEMP/job-before.json" > "$RUNNER_TEMP/before-shape.json"
          jq -cS '{configuration:.properties.configuration,template:.properties.template,identity:.identity}' "$RUNNER_TEMP/job-after.json" > "$RUNNER_TEMP/after-shape.json"
          cmp "$RUNNER_TEMP/before-shape.json" "$RUNNER_TEMP/after-shape.json"
          echo 'private_job_definition_unchanged=true'
      - name: Read back exact execution and allowlisted result
        env:
          EXECUTION: ${{ steps.start.outputs.execution }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXECUTION"
          for attempt in $(seq 1 60); do
            az containerapp job execution list -g rg-salcapa-dev -n salcapa-dev-b48224-scan-inv -o json > "$RUNNER_TEMP/executions.json"
            status="$(jq -r --arg n "$EXECUTION" '[.[] | select(.name==$n) | .properties.status] | first // empty' "$RUNNER_TEMP/executions.json")"
            if test "$status" = Succeeded; then break; fi
            if test "$status" = Failed || test "$status" = Stopped; then echo 'private_source_execution_failed=true'; exit 1; fi
            sleep 5
          done
          test "$status" = Succeeded
          workspace="$(az monitor log-analytics workspace show -g rg-salcapa-dev -n salcapa-dev-b48224-logs --query customerId -o tsv)"
          test -n "$workspace"
          for attempt in $(seq 1 30); do
            az monitor log-analytics query --workspace "$workspace" --analytics-query "ContainerAppConsoleLogs | where TimeGenerated > ago(15m) | where JobName == 'salcapa-dev-b48224-scan-inv' | where Log contains 'cedar_source_readback_20261028=' | project Log | take 10" -o json > "$RUNNER_TEMP/logs.json"
            if python - "$RUNNER_TEMP/logs.json" <<'PY'
          import json,sys
          v=json.load(open(sys.argv[1],encoding='utf-8'))
          if isinstance(v,dict) and 'tables' in v:
              t=(v.get('tables') or [{}])[0]
              cols=[c.get('name') for c in t.get('columns',[])]
              rows=[dict(zip(cols,r)) for r in t.get('rows',[])]
          else: rows=v if isinstance(v,list) else v.get('value',[])
          marker='cedar_source_readback_20261028='
          matches=[]
          for r in rows:
              line=r.get('Log') or ''
              if marker not in line: continue
              try: result=json.loads(line.split(marker,1)[1])
              except ValueError: continue
              keys={'upload_rows_bounded','exact_cedar_row','correct_item_and_assessment',
                    'clean_and_expected_size','private_copy_exact_sha'}
              if set(result)==keys and all(type(x) is bool for x in result.values()):
                  matches.append(result)
          if len(matches)!=1 or not all(matches[0].values()): raise SystemExit(1)
          print('cedar_source_exact_private_readback=verified')
          PY
            then exit 0; fi
            sleep 10
          done
          echo 'cedar_source_log_readback=unavailable'
          exit 1
