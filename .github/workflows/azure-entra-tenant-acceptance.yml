name: SalCAPA governed Azure Entra and tenant-isolation acceptance

on:
  push:
    branches:
      - development/salcapa-platform
    paths:
      - 'deploy/azure/activations/entra-tenant-isolation-dev.json'

permissions:
  contents: read

concurrency:
  group: salcapa-entra-tenant-isolation-acceptance-dev
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: salcapa-dev-approval
    permissions: {}
    steps:
      - name: Record protected identity acceptance gate passage
        run: echo "Protected SalCAPA development Entra and tenant-isolation acceptance gate passed."

  accept:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact frozen v3.111 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/v3.111
          path: frozen-release
          fetch-depth: 1
          persist-credentials: false

      - name: Validate immutable identity acceptance record
        id: activation
        env:
          ACTIVATION_FILE: deploy/azure/activations/entra-tenant-isolation-dev.json
        run: |
          set -euo pipefail
          jq -e '
            type == "object" and
            (.schema_version == 1) and
            (.operation == "accept_entra_tenant_isolation") and
            (.target_environment == "dev") and
            (.location == "southcentralus") and
            (.unique_suffix == "b48224") and
            (.approval_record == "MD-APPROVAL-AZURE-LEAN-20260904") and
            (.accepted_release == "release/v3.36") and
            (.accepted_commit == "63d513605f908d3308bb5dd1bbdbf1061878452b") and
            (.accepted_image_digest == "salcapadevb48224acr.azurecr.io/salcapa@sha256:746a2e92cdc6e4189a772db65b1a3311b25be42ad65d0f6bc8e5779e86a58b46") and
            (.candidate_release == "release/v3.111") and
            (.candidate_commit == "8bf4614ec79a27641c40dc1a21e1790746a08604") and
            (.candidate_image_digest == "salcapadevb48224acr.azurecr.io/salcapa@sha256:6df0d41dd93fa929af33793d619630f41822a41ae91ed9d7050d074981fa0311") and
            (.acceptance_script_sha256 == "024fc32fc2fc3b74cb3582772388cb5b0ad87887d1df8f3f938990b99c49fab4") and
            (.acceptance_revision == 2) and
            (.activation_key == "salcapa-v3.111-entra-tenant-isolation-20260911-r2") and
            ((keys - [
              "acceptance_revision", "acceptance_script_sha256", "accepted_commit",
              "accepted_image_digest", "accepted_release", "activation_key",
              "approval_record", "candidate_commit", "candidate_image_digest",
              "candidate_release", "location", "operation", "schema_version",
              "target_environment", "unique_suffix"
            ]) | length == 0)
          ' "$ACTIVATION_FILE" >/dev/null
          test "$(git -C frozen-release rev-parse HEAD)" = "8bf4614ec79a27641c40dc1a21e1790746a08604"
          git merge-base --is-ancestor "8bf4614ec79a27641c40dc1a21e1790746a08604" "$GITHUB_SHA"
          test "$(sha256sum tools/azure_entra_tenant_acceptance.py | cut -d ' ' -f 1)" = "$(jq -r '.acceptance_script_sha256' "$ACTIVATION_FILE")"
          jq -e '
            .source_release == "release/v3.36" and
            .source_commit == "63d513605f908d3308bb5dd1bbdbf1061878452b" and
            .image_digest == "salcapadevb48224acr.azurecr.io/salcapa@sha256:746a2e92cdc6e4189a772db65b1a3311b25be42ad65d0f6bc8e5779e86a58b46"
          ' deploy/azure/activations/application-dev.json >/dev/null
          {
            echo "candidate_image=$(jq -r '.candidate_image_digest' "$ACTIVATION_FILE")"
            echo "accepted_image=$(jq -r '.accepted_image_digest' "$ACTIVATION_FILE")"
          } >> "$GITHUB_OUTPUT"

      - name: Validate required non-secret repository variables
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          ENTRA_RUNTIME_CLIENT_ID: ${{ vars.ENTRA_RUNTIME_CLIENT_ID }}
        run: |
          set -euo pipefail
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP AZURE_LOCATION ENTRA_RUNTIME_CLIENT_ID; do
            test -n "${!name}" || { echo "Missing repository variable: $name" >&2; exit 1; }
          done
          test "$AZURE_RESOURCE_GROUP" = "rg-salcapa-dev"
          test "$AZURE_LOCATION" = "southcentralus"

      - name: Azure login through workload identity federation
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify live Entra configuration and exact-image tenant boundary
        env:
          EXPECTED_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          EXPECTED_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ENTRA_RUNTIME_CLIENT_ID: ${{ vars.ENTRA_RUNTIME_CLIENT_ID }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          CANDIDATE_IMAGE: ${{ steps.activation.outputs.candidate_image }}
          ACCEPTED_IMAGE: ${{ steps.activation.outputs.accepted_image }}
        run: |
          set -euo pipefail
          APP_NAME="salcapa-dev-b48224"
          IDENTITY_NAME="salcapa-dev-b48224-identity"
          JOB_NAME="salcapa-dev-b48224-v311-entra"

          cleanup() {
            exit_code=$?
            trap - EXIT
            set +e
            az containerapp job delete --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" --yes >/dev/null 2>&1
            for attempt in $(seq 1 60); do
              ! az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" >/dev/null 2>&1 && break
              sleep 5
            done
            if az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" >/dev/null 2>&1; then
              echo "Temporary identity acceptance cleanup did not converge." >&2
              exit 1
            fi
            exit "$exit_code"
          }
          trap cleanup EXIT

          test "$(az account show --query id --output tsv)" = "$EXPECTED_SUBSCRIPTION_ID"
          test "$(az account show --query tenantId --output tsv)" = "$EXPECTED_TENANT_ID"
          test "$(az group show --name "$RESOURCE_GROUP" --query location --output tsv)" = "southcentralus"
          if az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" >/dev/null 2>&1; then
            echo "Fail closed: a temporary identity acceptance job already exists." >&2
            exit 1
          fi

          az containerapp show --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --output json > /tmp/application-before.json
          RUNTIME_IDENTITY_CLIENT_ID="$(az identity show --resource-group "$RESOURCE_GROUP" --name "$IDENTITY_NAME" --query clientId --output tsv)"
          APP_FQDN="$(jq -r '.properties.configuration.ingress.fqdn' /tmp/application-before.json)"
          REDIRECT_URI="https://${APP_FQDN}/api/auth/oidc/callback"
          DISCOVERY_URI="https://login.microsoftonline.com/${EXPECTED_TENANT_ID}/v2.0/.well-known/openid-configuration"
          test -n "$RUNTIME_IDENTITY_CLIENT_ID"
          test -n "$APP_FQDN"
          jq -e --arg accepted_image "$ACCEPTED_IMAGE" --arg tenant "$EXPECTED_TENANT_ID" \
            --arg client "$ENTRA_RUNTIME_CLIENT_ID" --arg runtime_client "$RUNTIME_IDENTITY_CLIENT_ID" \
            --arg redirect "$REDIRECT_URI" --arg discovery "$DISCOVERY_URI" '
              .properties.template.containers[0].image == $accepted_image and
              .properties.configuration.ingress.allowInsecure == false and
              ((.properties.configuration.secrets // []) | length == 0) and
              ([.properties.template.containers[0].env[] | select(.name == "SALUS_AUTH_MODE") | .value] == ["oidc"]) and
              ([.properties.template.containers[0].env[] | select(.name == "SALUS_OIDC_TENANT_ID") | .value] == [$tenant]) and
              ([.properties.template.containers[0].env[] | select(.name == "SALUS_OIDC_DISCOVERY_URL") | .value] == [$discovery]) and
              ([.properties.template.containers[0].env[] | select(.name == "SALUS_OIDC_CLIENT_ID") | .value] == [$client]) and
              ([.properties.template.containers[0].env[] | select(.name == "SALUS_OIDC_CLIENT_AUTH_METHOD") | .value] == ["managed_identity"]) and
              ([.properties.template.containers[0].env[] | select(.name == "SALUS_OIDC_MANAGED_IDENTITY_CLIENT_ID") | .value] == [$runtime_client]) and
              ([.properties.template.containers[0].env[] | select(.name == "SALUS_OIDC_REDIRECT_URI") | .value] == [$redirect]) and
              ([.properties.template.containers[0].env[] | select(.name == "SALUS_OIDC_PROVIDER_NAME") | .value] == ["entra"]) and
              ([.properties.template.containers[0].env[] | select(.name == "SALUS_OIDC_AUTO_PROVISION") | .value] == ["0"])
          ' /tmp/application-before.json >/dev/null

          curl --silent --show-error --fail "$DISCOVERY_URI" > /tmp/discovery.json
          jq -e --arg tenant "$EXPECTED_TENANT_ID" '
            .issuer == ("https://login.microsoftonline.com/" + $tenant + "/v2.0") and
            (.authorization_endpoint | startswith("https://login.microsoftonline.com/")) and
            (.token_endpoint | startswith("https://login.microsoftonline.com/")) and
            (.jwks_uri | startswith("https://login.microsoftonline.com/"))
          ' /tmp/discovery.json >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "https://${APP_FQDN}/api/auth/session")" = "401"

          jq -S '{id:.id,image:.properties.template.containers[0].image,env:([.properties.template.containers[0].env[]|{name,value,secretRef}]|sort_by(.name)),ingress:.properties.configuration.ingress,identity:.identity,scale:.properties.template.scale,secretsCount:((.properties.configuration.secrets//[])|length)}' /tmp/application-before.json | sha256sum | cut -d ' ' -f 1 > /tmp/application-before.sha
          DIGEST="${CANDIDATE_IMAGE##*@}"
          test "$(az acr manifest show-metadata --registry salcapadevb48224acr --name "salcapa@$DIGEST" --query digest --output tsv)" = "$DIGEST"
          SCRIPT_BASE64="$(base64 -w 0 tools/azure_entra_tenant_acceptance.py)"
          az bicep build --file infra/azure/entra-tenant-acceptance.bicep --stdout >/tmp/entra-tenant-acceptance-arm.json
          az deployment group create \
            --name "salcapa-v311-entra-acceptance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/azure/entra-tenant-acceptance.bicep \
            --parameters location=southcentralus environmentName=dev uniqueSuffix=b48224 \
              imageDigest="$CANDIDATE_IMAGE" sourceCommit=8bf4614ec79a27641c40dc1a21e1790746a08604 \
              acceptedCommit=63d513605f908d3308bb5dd1bbdbf1061878452b \
              approvalRecord=MD-APPROVAL-AZURE-LEAN-20260904 entraTenantId="$EXPECTED_TENANT_ID" \
              entraRuntimeClientId="$ENTRA_RUNTIME_CLIENT_ID" entraRedirectUri="$REDIRECT_URI" \
              acceptanceScriptBase64="$SCRIPT_BASE64" --output none
          test "$(az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" --query properties.template.containers[0].image --output tsv)" = "$CANDIDATE_IMAGE"
          test "$(az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" --query identity.userAssignedIdentities --output json | jq 'length')" = "1"

          EXECUTION_NAME="$(az containerapp job start --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" --query name --output tsv)"
          test -n "$EXECUTION_NAME"
          STATE=""
          for attempt in $(seq 1 90); do
            STATE="$(az containerapp job execution show --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" --job-execution-name "$EXECUTION_NAME" --query properties.status --output tsv 2>/dev/null || true)"
            case "$STATE" in
              Succeeded) break ;;
              Failed|Degraded|Stopped) break ;;
            esac
            sleep 10
          done
          az containerapp job logs show --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" --execution "$EXECUTION_NAME" --container entra-acceptance --tail 100 --format text --only-show-errors \
            | sed -E 's/((password|secret|token|connection[_ -]?string)[^:=]*[:=][[:space:]]*)[^[:space:]]+/\1[REDACTED]/Ig' > /tmp/acceptance.log || true
          echo "Sanitized isolated acceptance output:"
          cat /tmp/acceptance.log
          test "$STATE" = "Succeeded"
          grep -F '"acceptance": "ENTRA_TENANT_ISOLATION_ACCEPTED"' /tmp/acceptance.log >/dev/null
          grep -F '"fictional_tenants_verified": 3' /tmp/acceptance.log >/dev/null
          grep -F '"server_authority_verified": true' /tmp/acceptance.log >/dev/null
          grep -F '"cross_tenant_visibility_denied": true' /tmp/acceptance.log >/dev/null
          grep -F '"unknown_disabled_foreign_denied": true' /tmp/acceptance.log >/dev/null
          grep -F '"issuer_audience_replay_denied": true' /tmp/acceptance.log >/dev/null
          grep -F '"managed_identity_no_client_secret": true' /tmp/acceptance.log >/dev/null

          az containerapp show --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --output json > /tmp/application-after.json
          jq -S '{id:.id,image:.properties.template.containers[0].image,env:([.properties.template.containers[0].env[]|{name,value,secretRef}]|sort_by(.name)),ingress:.properties.configuration.ingress,identity:.identity,scale:.properties.template.scale,secretsCount:((.properties.configuration.secrets//[])|length)}' /tmp/application-after.json | sha256sum | cut -d ' ' -f 1 > /tmp/application-after.sha
          cmp /tmp/application-before.sha /tmp/application-after.sha

          az containerapp job delete --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" --yes
          for attempt in $(seq 1 60); do
            ! az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" >/dev/null 2>&1 && break
            sleep 5
          done
          ! az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" >/dev/null 2>&1
          trap - EXIT

          {
            echo "### SalCAPA v3.111 Entra and tenant-isolation acceptance"
            echo ""
            echo "- Live accepted demonstration: tenant-specific Entra discovery, passwordless managed-identity client authentication, exact redirect, no runtime secrets, and anonymous-session denial verified"
            echo "- Candidate runtime: exact frozen v3.111 immutable image digest"
            echo "- Isolated boundary: three fictional tenant mappings with server-derived tenant, role, and clearance"
            echo "- Denials: cross-tenant visibility, unknown and disabled identities, foreign tenant, invalid issuer/audience, and replay"
            echo "- Human interactive login: not used; no credential or authority was simulated as human acceptance"
            echo "- Accepted application, database, and traffic: unchanged"
            echo "- Temporary consumption job: removed"
            echo "ENTRA_TENANT_ISOLATION_ACCEPTED"
          } >> "$GITHUB_STEP_SUMMARY"
