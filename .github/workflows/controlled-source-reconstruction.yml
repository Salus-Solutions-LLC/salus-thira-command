name: Controlled Source Reconstruction
on:
  push:
    branches:
      - security/codeql-remediation
permissions:
  contents: read
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Reconstruct and verify authoritative source
        run: |
          python tools/reconstruct_v13_source.py
          python tools/verify_v13_source.py
      - name: Package controlled remediation source
        run: |
          mkdir -p remediation-source/static
          cp app.py remediation-source/app.py
          cp static/app.js remediation-source/static/app.js
          cp static/index.html remediation-source/static/index.html
          sha256sum remediation-source/app.py remediation-source/static/app.js remediation-source/static/index.html > remediation-source/SHA256SUMS
      - name: Preserve reconstructed source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: controlled-remediation-source
          path: remediation-source
          if-no-files-found: error
          retention-days: 1
