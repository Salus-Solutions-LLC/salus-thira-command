name: SalCAPA Level 1A private adverse preflight diagnosis

on:
  push:
    branches: [development/salcapa-platform]
    paths: ['.github/workflows/azure-level1a-private-adverse-preflight.yml']

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: salcapa-dev-approval
    permissions: {}
    steps:
      - run: echo 'Protected read-only Level 1A adverse preflight gate passed.'

  inspect:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      RESOURCE_GROUP: rg-salcapa-dev
      JOB_NAME: salcapa-dev-b48224-scan-test
      PRIOR_IMAGE_DIGEST: sha256:36b48158a6cb13bc8f408af0f9b6cefcf49014907ce117e14898a08f892498bc
    steps:
      - uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Classify exact preflight clauses without printing Azure values
        shell: bash
        run: |
          set -euo pipefail
          test "$(az account show --query id -o tsv)" = "${{ vars.AZURE_SUBSCRIPTION_ID }}"
          test "$(az account show --query tenantId -o tsv)" = "${{ vars.AZURE_TENANT_ID }}"
          export JOB_ID="/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.App/jobs/$JOB_NAME"
          az rest --method GET --url "https://management.azure.com$JOB_ID?api-version=2025-01-01" -o json > "$RUNNER_TEMP/job.json"
          python - "$RUNNER_TEMP/job.json" <<'PY'
          import json,os,sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          props=data.get('properties') or {}
          cfg=props.get('configuration') or {}
          template=props.get('template') or {}
          containers=template.get('containers') or []
          container=containers[0] if len(containers)==1 else {}
          identity=data.get('identity') or {}
          identities=identity.get('userAssignedIdentities') or {}
          expected_identity=(f"/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/"
              f"{os.environ['RESOURCE_GROUP']}/providers/Microsoft.ManagedIdentity/"
              "userAssignedIdentities/salcapa-dev-b48224-identity")
          env={item.get('name'):item.get('value') for item in container.get('env',[])}
          expected_env={
              'SALUS_ACCEPTANCE_PRIVATE_JOB':'1',
              'SALUS_ACCEPTANCE_JOB_NAME':'salcapa-dev-b48224-scan-test',
              'SALUS_ENV':'dev','SALUS_AUTH_MODE':'session',
              'SALUS_DB_BACKEND':'postgres','SALUS_STORAGE_BACKEND':'azure',
              'SALUS_PACKAGE_SCAN_MODE':'defender',
              'SALUS_AZURE_STORAGE_CONTAINER':'evidence',
          }
          checks={
              'job_id':str(data.get('id','')).casefold()==os.environ['JOB_ID'].casefold(),
              'source_tag':(data.get('tags') or {}).get('sourceCommit')=='7867fa72ae404aa5ed37abd104ecc1c69b9ea190',
              'approval_tag':(data.get('tags') or {}).get('approvalRecord')=='MD-PRIVATE-SCANNER-JOB-20261003',
              'provisioned':props.get('provisioningState')=='Succeeded',
              'identity_type':identity.get('type')=='UserAssigned',
              'identity_exact':{key.casefold() for key in identities}=={expected_identity.casefold()},
              'manual_trigger':cfg.get('triggerType')=='Manual',
              'timeout':cfg.get('replicaTimeout')==1200,
              'retry_limit':cfg.get('replicaRetryLimit')==0,
              'parallelism':(cfg.get('manualTriggerConfig') or {}).get('parallelism')==1,
              'completion_count':(cfg.get('manualTriggerConfig') or {}).get('replicaCompletionCount')==1,
              'no_schedule':cfg.get('scheduleTriggerConfig') is None,
              'no_ingress':props.get('ingress') is None,
              'one_container':len(containers)==1 and not template.get('initContainers'),
              'container_name':container.get('name')=='fictional-scan-acceptance',
              'prior_image':container.get('image')==('salcapadevb48224acr.azurecr.io/salcapa@'+os.environ['PRIOR_IMAGE_DIGEST']),
              'command':container.get('command')==['python','-m','tools.private_scanner_acceptance','--execute'],
              'cpu':(container.get('resources') or {}).get('cpu')==0.25,
              'memory':(container.get('resources') or {}).get('memory')=='0.5Gi',
              'resource_fields':(container.get('resources') or {})=={'cpu':0.25,'memory':'0.5Gi'},
              'ephemeral_storage_present':'ephemeralStorage' in (container.get('resources') or {}),
              'ephemeral_storage_string':isinstance((container.get('resources') or {}).get('ephemeralStorage'),str),
              'no_other_resource_fields':set((container.get('resources') or {})) <= {'cpu','memory','ephemeralStorage'},
              'required_env':all(env.get(key)==value for key,value in expected_env.items()),
              'client_identity_present':bool(env.get('AZURE_CLIENT_ID')),
              'postgres_target':str(env.get('SALUS_POSTGRES_HOST') or '').startswith('salcapa-dev-b48224-pg.'),
              'quarantine_target':env.get('SALUS_ACCEPTANCE_EXPECTED_QUARANTINE_URL')==env.get('SALUS_SCAN_QUARANTINE_URL') and str(env.get('SALUS_SCAN_QUARANTINE_URL') or '').startswith('https://salcapadevb48224scan.blob.core.windows.net/'),
          }
          for name,ok in checks.items():
              print(f'{name}_matches={str(ok).lower()}')
          print('read_only_clause_count='+str(len(checks)))
          PY
