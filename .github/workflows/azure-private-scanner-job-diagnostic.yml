name: SalCAPA private scanner test-job state diagnostic

on:
  push:
    branches:
      - development/salcapa-platform
    paths:
      - '.github/workflows/azure-private-scanner-job-diagnostic.yml'

permissions:
  contents: read

concurrency:
  group: salcapa-private-scanner-job-diagnostic-dev
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: salcapa-dev-approval
    permissions: {}
    steps:
      - run: echo 'Protected read-only job-state diagnostic gate passed.'

  diagnose:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      RESOURCE_GROUP: rg-salcapa-dev
      EXPECTED_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      EXPECTED_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
    steps:
      - uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Read only the exact deployment and job state
        shell: bash
        run: |
          set -euo pipefail
          test "$(az account show --query id -o tsv)" = "$EXPECTED_SUBSCRIPTION_ID"
          test "$(az account show --query tenantId -o tsv)" = "$EXPECTED_TENANT_ID"
          test "$(az group show -n "$RESOURCE_GROUP" --query location -o tsv)" = southcentralus
          DEPLOYMENT="salcapa-private-scanner-deploy-37170484459"
          if az deployment group show -g "$RESOURCE_GROUP" -n "$DEPLOYMENT" -o json > "$RUNNER_TEMP/job-deployment.json" 2> "$RUNNER_TEMP/deployment-read-error"; then
            python - "$RUNNER_TEMP/job-deployment.json" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          props=data.get('properties') or {}
          err=props.get('error') or {}
          state=str(props.get('provisioningState','unknown'))
          code=str(err.get('code','none'))
          print(f"deployment_state={state}; error_code={code if code.replace('_','').isalnum() else 'redacted'}")
          PY
            az deployment operation group list -g "$RESOURCE_GROUP" -n "$DEPLOYMENT" -o json > "$RUNNER_TEMP/job-operations.json"
            python - "$RUNNER_TEMP/job-operations.json" <<'PY'
          import collections, json, sys
          rows=json.load(open(sys.argv[1],encoding='utf-8'))
          counts=collections.Counter()
          for row in rows:
              p=row.get('properties') or {}
              message=p.get('statusMessage') or {}
              if not isinstance(message,dict): message={}
              error=message.get('error') or {}
              if not isinstance(error,dict): error={}
              code=error.get('code') or 'none'
              code=str(code)
              if not code.replace('_','').isalnum() or len(code)>64: code='redacted'
              counts[(str(p.get('provisioningState','unknown')),code)]+=1
          for (state,code),n in sorted(counts.items()):
              print(f"operation_state={state}; error_code={code}; count={n}")
          PY
          else
            echo 'deployment_read=unavailable; no conclusion about job creation'
          fi
          JOB_ID="/subscriptions/$EXPECTED_SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.App/jobs/salcapa-dev-b48224-scan-test"
          if az rest --method GET --url "https://management.azure.com$JOB_ID?api-version=2025-01-01" -o json > "$RUNNER_TEMP/job-state.json" 2> "$RUNNER_TEMP/job-read-error"; then
            python - "$RUNNER_TEMP/job-state.json" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          p=data.get('properties') or {}
          cfg=p.get('configuration') or {}
          c=((p.get('template') or {}).get('containers') or [{}])[0]
          ids=(data.get('identity') or {}).get('userAssignedIdentities') or {}
          print('job_read=success')
          print('provisioning_state='+str(p.get('provisioningState','unknown')))
          print('trigger='+str(cfg.get('triggerType','unknown')))
          print('replica_timeout='+str(cfg.get('replicaTimeout','unknown')))
          print('replica_retry='+str(cfg.get('replicaRetryLimit','unknown')))
          print('identity_count='+str(len(ids)))
          print('image_matches='+str(c.get('image','').endswith('@sha256:36b48158a6cb13bc8f408af0f9b6cefcf49014907ce117e14898a08f892498bc')))
          print('approval_tag_matches='+str((data.get('tags') or {}).get('approvalRecord')=='MD-PRIVATE-SCANNER-JOB-20261003'))
          print('source_tag_matches='+str((data.get('tags') or {}).get('sourceCommit')=='7867fa72ae404aa5ed37abd104ecc1c69b9ea190'))
          expected_job='/subscriptions/076f90cd-cc6a-4547-a4ff-de3fc1825472/resourcegroups/rg-salcapa-dev/providers/microsoft.app/jobs/salcapa-dev-b48224-scan-test'
          print('job_id_matches='+str(str(data.get('id','')).lower()==expected_job))
          print('identity_type_matches='+str((data.get('identity') or {}).get('type')=='UserAssigned'))
          expected_identity='/subscriptions/076f90cd-cc6a-4547-a4ff-de3fc1825472/resourcegroups/rg-salcapa-dev/providers/microsoft.managedidentity/userassignedidentities/salcapa-dev-b48224-identity'
          print('identity_matches='+str([key.lower() for key in ids]==[expected_identity]))
          manual=cfg.get('manualTriggerConfig') or {}
          print('parallelism_matches='+str(manual.get('parallelism')==1))
          print('completion_count_matches='+str(manual.get('replicaCompletionCount')==1))
          resources=c.get('resources') or {}
          print('cpu_matches='+str(str(resources.get('cpu'))=='0.25'))
          print('cpu_numeric_matches='+str(resources.get('cpu')==0.25 and type(resources.get('cpu')) in (int,float)))
          print('memory_matches='+str(resources.get('memory')=='0.5Gi'))
          print('schedule_absent_or_null='+str(cfg.get('scheduleTriggerConfig') is None))
          print('ingress_absent_or_null='+str(p.get('ingress') is None))
          print('schedule_key_present='+str('scheduleTriggerConfig' in cfg))
          print('ingress_key_present='+str('ingress' in p))
          if not all((
              str(data.get('id','')).lower()==expected_job,
              (data.get('tags') or {}).get('sourceCommit')=='7867fa72ae404aa5ed37abd104ecc1c69b9ea190',
              (data.get('tags') or {}).get('approvalRecord')=='MD-PRIVATE-SCANNER-JOB-20261003',
              (data.get('identity') or {}).get('type')=='UserAssigned',
              [key.lower() for key in ids]==[expected_identity],
              p.get('provisioningState')=='Succeeded',
              cfg.get('triggerType')=='Manual',
              cfg.get('replicaTimeout')==1200,
              cfg.get('replicaRetryLimit')==0,
              manual.get('parallelism')==1,
              manual.get('replicaCompletionCount')==1,
              len((p.get('template') or {}).get('containers') or [])==1,
              c.get('image')=='salcapadevb48224acr.azurecr.io/salcapa@sha256:36b48158a6cb13bc8f408af0f9b6cefcf49014907ce117e14898a08f892498bc',
              resources.get('cpu')==0.25 and type(resources.get('cpu')) in (int,float),
              resources.get('memory')=='0.5Gi',
              cfg.get('scheduleTriggerConfig') is None,
              p.get('ingress') is None,
          )):
              raise SystemExit('Exact private manual scanner job readback differs from reviewed bounds')
          print('exact_private_job_readback=passed')
          PY
            if az containerapp job execution list -g "$RESOURCE_GROUP" -n salcapa-dev-b48224-scan-test -o json > "$RUNNER_TEMP/job-executions.json" 2> "$RUNNER_TEMP/execution-read-error"; then
              python - "$RUNNER_TEMP/job-executions.json" <<'PY'
          import json, sys
          rows=json.load(open(sys.argv[1],encoding='utf-8'))
          print('execution_count='+str(len(rows) if isinstance(rows,list) else 'unavailable'))
          PY
            else
              echo 'execution_count=unavailable'
            fi
          else
            echo 'job_read=unavailable; no conclusion about existence or configuration'
          fi
