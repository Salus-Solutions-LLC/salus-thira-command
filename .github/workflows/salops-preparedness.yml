name: SalOPS Preparedness

on:
  push:
    branches:
      - development/salcapa-platform
    paths:
      - 'salcapa_runtime.py'
      - 'salops_preparedness.py'
      - 'source_archives/development/salops_preparedness.py.gz'
      - 'source_archives/development/ci_salops_preparedness_smoke.py.gz'
      - 'tools/reconstruct_salops_preparedness.py'
      - 'static/salops-preparedness.js'
      - 'static/salops-preparedness.css'
      - 'tools/ci_salops_preparedness_smoke.py'
      - 'Dockerfile'
      - 'run_mac_linux.sh'
      - 'run_windows.bat'
      - '.github/workflows/salops-preparedness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Reconstruct and verify governed base source
        run: |
          python tools/reconstruct_v343_source.py
          python tools/verify_v343_source.py
          python tools/reconstruct_salops_preparedness.py
          python tools/reconstruct_personnel_assessment.py
          python tools/reconstruct_salintel_relationships.py
      - name: Install application and security test tools
        run: python -m pip install -r requirements.txt -r requirements-ci.txt
      - name: Compile preparedness runtime
        run: python -m py_compile salcapa_runtime.py salops_preparedness.py tools/ci_salops_preparedness_smoke.py
      - name: Validate preparedness interface JavaScript
        run: node --check static/salops-preparedness.js
      - name: Verify repository boundary
        run: python tools/check_repository_hygiene.py
      - name: Static security scan
        run: bandit -q -r salcapa_runtime.py salops_preparedness.py -ll -s B608
      - name: SQLite preparedness acceptance
        run: python tools/ci_salops_preparedness_smoke.py

  postgres16:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: salops_preparedness_ci
          POSTGRES_USER: salus
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U salus -d salops_preparedness_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Reconstruct and verify governed base source
        run: |
          python tools/reconstruct_v343_source.py
          python tools/verify_v343_source.py
          python tools/reconstruct_salops_preparedness.py
          python tools/reconstruct_personnel_assessment.py
          python tools/reconstruct_salintel_relationships.py
      - name: Install application
        run: python -m pip install -r requirements.txt
      - name: PostgreSQL 16 preparedness acceptance
        env:
          SALUS_DB_BACKEND: postgres
          SALUS_DATABASE_URL: postgresql://salus@127.0.0.1:5432/salops_preparedness_ci
          SALUS_AUTH_MODE: prototype
          SALUS_SEED_DEMO: '1'
          SALUS_LOCAL_STORAGE_DIR: /tmp/salops-preparedness-pg-attachments
          SALUS_BACKUP_DIR: /tmp/salops-preparedness-pg-backups
        run: python tools/ci_salops_preparedness_smoke.py

