name: SalCAPA governed live demonstration acceptance

on:
  push:
    branches:
      - development/salcapa-platform
    paths:
      - 'deploy/azure/activations/live-demo-acceptance-dev.json'

permissions:
  contents: read

concurrency:
  group: salcapa-live-demonstration-acceptance-dev
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: salcapa-dev-approval
    permissions: {}
    steps:
      - name: Record protected live demonstration acceptance gate passage
        run: echo "Protected SalCAPA development live demonstration acceptance gate passed."

  accept:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact frozen v3.123 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/v3.123
          path: frozen-release
          fetch-depth: 1
          persist-credentials: false

      - name: Validate immutable live acceptance record
        id: activation
        env:
          ACTIVATION_FILE: deploy/azure/activations/live-demo-acceptance-dev.json
        run: |
          set -euo pipefail
          jq -e '
            type == "object" and
            (.schema_version == 1) and
            (.operation == "accept_live_demonstration") and
            (.target_environment == "dev") and
            (.location == "southcentralus") and
            (.unique_suffix == "b48224") and
            (.approval_record == "MD-APPROVAL-AZURE-LEAN-20260904") and
            (.source_release == "release/v3.123") and
            (.source_commit == "4b976032fe2b8420ca2ec652ae7a7bfc5b130d87") and
            (.image_digest == "salcapadevb48224acr.azurecr.io/salcapa@sha256:33b17998643d102b02dc998c409d96f743ec7d5bd8928f05efa999cf8c59b3be") and
            (.deployment_workflow_run == 35186525899) and
            (.postgres_server == "salcapa-dev-b48224-pg") and
            (.write_fictional_fixtures == true) and
            (.real_data_authorized == false) and
            (.expected_environment_count == 3) and
            (.expected_persona_count == 24) and
            (.fixture_authority == "ISSUE-124") and
            (.demonstration_acknowledgement == "FICTIONAL DEMONSTRATION DATA ONLY") and
            (.acceptance_revision == 1) and
            (.activation_key == "salcapa-v3.123-live-demo-20260917-r1") and
            ((keys - [
              "acceptance_revision", "activation_key", "approval_record",
              "demonstration_acknowledgement", "deployment_workflow_run",
              "expected_environment_count", "expected_persona_count",
              "fixture_authority", "image_digest", "location", "operation",
              "postgres_server", "real_data_authorized", "schema_version",
              "source_commit", "source_release", "target_environment",
              "unique_suffix", "write_fictional_fixtures"
            ]) | length == 0)
          ' "$ACTIVATION_FILE" >/dev/null
          test "$(git -C frozen-release rev-parse HEAD)" = "4b976032fe2b8420ca2ec652ae7a7bfc5b130d87"
          git merge-base --is-ancestor "4b976032fe2b8420ca2ec652ae7a7bfc5b130d87" "$GITHUB_SHA"
          jq -e '
            .source_release == "release/v3.123" and
            .source_commit == "4b976032fe2b8420ca2ec652ae7a7bfc5b130d87" and
            .image_digest == "salcapadevb48224acr.azurecr.io/salcapa@sha256:33b17998643d102b02dc998c409d96f743ec7d5bd8928f05efa999cf8c59b3be"
          ' deploy/azure/activations/application-dev.json >/dev/null
          echo "image_digest=$(jq -r '.image_digest' "$ACTIVATION_FILE")" >> "$GITHUB_OUTPUT"

      - name: Validate required non-secret repository variables
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
        run: |
          set -euo pipefail
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP AZURE_LOCATION; do
            test -n "${!name}" || { echo "Missing repository variable: $name" >&2; exit 1; }
          done
          test "$AZURE_RESOURCE_GROUP" = "rg-salcapa-dev"
          test "$AZURE_LOCATION" = "southcentralus"

      - name: Azure login through workload identity federation
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare, verify, and remove the bounded live acceptance job
        env:
          EXPECTED_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          EXPECTED_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          IMAGE_DIGEST: ${{ steps.activation.outputs.image_digest }}
          ACTIVATION_FILE: deploy/azure/activations/live-demo-acceptance-dev.json
        run: |
          set -euo pipefail
          APP_NAME="salcapa-dev-b48224"
          SERVER_NAME="$(jq -r '.postgres_server' "$ACTIVATION_FILE")"
          JOB_NAME="salcapa-dev-b48224-e2e"

          test "$(az account show --query id --output tsv)" = "$EXPECTED_SUBSCRIPTION_ID"
          test "$(az account show --query tenantId --output tsv)" = "$EXPECTED_TENANT_ID"
          test "$(az group show --name "$RESOURCE_GROUP" --query location --output tsv)" = "southcentralus"
          if az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" >/dev/null 2>&1; then
            echo "Fail closed: a temporary live demonstration acceptance job already exists." >&2
            exit 1
          fi

          cleanup() {
            exit_code=$?
            trap - EXIT
            set +e
            az containerapp job delete --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" --yes >/dev/null 2>&1
            for attempt in $(seq 1 60); do
              ! az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" >/dev/null 2>&1 && break
              sleep 5
            done
            if az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" >/dev/null 2>&1; then
              echo "Temporary live demonstration acceptance cleanup did not converge." >&2
              exit 1
            fi
            exit "$exit_code"
          }
          trap cleanup EXIT

          az postgres flexible-server show --resource-group "$RESOURCE_GROUP" --name "$SERVER_NAME" --output json > /tmp/database-before.json
          az containerapp show --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --output json > /tmp/application-before.json
          POSTGRES_HOST="$(jq -r '.fullyQualifiedDomainName' /tmp/database-before.json)"
          jq -e '
            .version == "16" and .state == "Ready" and
            .authConfig.activeDirectoryAuth == "Enabled" and
            .authConfig.passwordAuth == "Disabled" and
            .network.publicNetworkAccess == "Disabled" and
            .backup.backupRetentionDays == 14
          ' /tmp/database-before.json >/dev/null
          jq -e --arg image "$IMAGE_DIGEST" --arg host "$POSTGRES_HOST" '
            def env_value($name):
              first(.properties.template.containers[0].env[] | select(.name == $name) | .value);
            .properties.template.containers[0].image == $image and
            env_value("SALUS_POSTGRES_HOST") == $host and
            env_value("SALUS_DB_BACKEND") == "postgres" and
            env_value("SALUS_POSTGRES_AUTH") == "entra" and
            env_value("SALUS_AUTH_MODE") == "oidc" and
            .properties.configuration.ingress.external == true and
            .properties.configuration.ingress.allowInsecure == false and
            ((.properties.configuration.secrets // []) | length == 0) and
            .properties.template.scale.minReplicas == 0 and
            .properties.template.scale.maxReplicas == 1
          ' /tmp/application-before.json >/dev/null
          jq -S '{
            id:.id,
            image:.properties.template.containers[0].image,
            env:([.properties.template.containers[0].env[] | {name,value,secretRef}] | sort_by(.name)),
            ingress:{
              external:.properties.configuration.ingress.external,
              allowInsecure:.properties.configuration.ingress.allowInsecure,
              targetPort:.properties.configuration.ingress.targetPort,
              transport:.properties.configuration.ingress.transport,
              fqdn:.properties.configuration.ingress.fqdn,
              clientCertificateMode:.properties.configuration.ingress.clientCertificateMode,
              traffic:([.properties.configuration.ingress.traffic[] | {revisionName,label,latestRevision,weight}] | sort_by(.revisionName,.label))
            },
            identity:{
              type:.identity.type,
              userAssignedIdentities:(.identity.userAssignedIdentities | to_entries | sort_by(.key))
            },
            scale:.properties.template.scale,
            secretsCount:((.properties.configuration.secrets // []) | length)
          }' /tmp/application-before.json | sha256sum | cut -d ' ' -f 1 > /tmp/application-before.sha

          DIGEST="${IMAGE_DIGEST##*@}"
          test "$(az acr manifest show-metadata --registry salcapadevb48224acr --name "salcapa@$DIGEST" --query digest --output tsv)" = "$DIGEST"
          az bicep build --file infra/azure/live-demo-acceptance.bicep --stdout > /tmp/live-demo-acceptance-arm.json
          DEPLOYMENT_NAME="salcapa-v3123-live-demo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          az deployment group create             --name "$DEPLOYMENT_NAME"             --resource-group "$RESOURCE_GROUP"             --template-file infra/azure/live-demo-acceptance.bicep             --parameters location=southcentralus environmentName=dev uniqueSuffix=b48224               imageDigest="$IMAGE_DIGEST"               sourceCommit=4b976032fe2b8420ca2ec652ae7a7bfc5b130d87               approvalRecord=MD-APPROVAL-AZURE-LEAN-20260904               postgresHost="$POSTGRES_HOST"             --output none
          az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" --output json > /tmp/acceptance-job.json
          jq -e --arg image "$IMAGE_DIGEST" --arg host "$POSTGRES_HOST" '
            def env_value($name):
              first(.properties.template.containers[0].env[] | select(.name == $name) | .value);
            .properties.template.containers[0].image == $image and
            env_value("SALUS_POSTGRES_HOST") == $host and
            env_value("SALUS_AUTH_MODE") == "local" and
            (.identity.userAssignedIdentities | length) == 1
          ' /tmp/acceptance-job.json >/dev/null

          EXECUTION_NAME="$(az containerapp job start --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" --query name --output tsv)"
          test -n "$EXECUTION_NAME"
          STATE=""
          for attempt in $(seq 1 120); do
            STATE="$(az containerapp job execution show --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" --job-execution-name "$EXECUTION_NAME" --query properties.status --output tsv 2>/dev/null || true)"
            case "$STATE" in
              Succeeded) break ;;
              Failed|Degraded|Stopped)
                az containerapp job logs show --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" --execution "$EXECUTION_NAME" --container live-demo-acceptance --tail 200 --format text --only-show-errors 2>/dev/null | sed -E 's/((password|secret|token|connection[_ -]?string)[^:=]*[:=][[:space:]]*)[^[:space:]]+/\1[REDACTED]/Ig' >&2 || true
                echo "Live demonstration acceptance failed closed: $STATE" >&2
                exit 1
                ;;
            esac
            sleep 10
          done
          test "$STATE" = "Succeeded"
          az containerapp job logs show             --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME"             --execution "$EXECUTION_NAME" --container live-demo-acceptance             --tail 200 --format text --only-show-errors             | sed -E 's/((password|secret|token|connection[_ -]?string)[^:=]*[:=][[:space:]]*)[^[:space:]]+/\1[REDACTED]/Ig'             > /tmp/acceptance.log
          grep -F 'SalCAPA demonstration role, tenant, recovery, and governed-state preflight passed.' /tmp/acceptance.log >/dev/null
          grep -F 'SALCAPA_DEMO_EVALUATOR_SMOKE_PASS postgres' /tmp/acceptance.log >/dev/null

          az containerapp job delete --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" --yes
          for attempt in $(seq 1 60); do
            ! az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" >/dev/null 2>&1 && break
            sleep 5
          done
          ! az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" >/dev/null 2>&1
          trap - EXIT

          az containerapp show --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --output json > /tmp/application-after.json
          jq -S '{
            id:.id,
            image:.properties.template.containers[0].image,
            env:([.properties.template.containers[0].env[] | {name,value,secretRef}] | sort_by(.name)),
            ingress:{
              external:.properties.configuration.ingress.external,
              allowInsecure:.properties.configuration.ingress.allowInsecure,
              targetPort:.properties.configuration.ingress.targetPort,
              transport:.properties.configuration.ingress.transport,
              fqdn:.properties.configuration.ingress.fqdn,
              clientCertificateMode:.properties.configuration.ingress.clientCertificateMode,
              traffic:([.properties.configuration.ingress.traffic[] | {revisionName,label,latestRevision,weight}] | sort_by(.revisionName,.label))
            },
            identity:{
              type:.identity.type,
              userAssignedIdentities:(.identity.userAssignedIdentities | to_entries | sort_by(.key))
            },
            scale:.properties.template.scale,
            secretsCount:((.properties.configuration.secrets // []) | length)
          }' /tmp/application-after.json | sha256sum | cut -d ' ' -f 1 > /tmp/application-after.sha
          cmp /tmp/application-before.sha /tmp/application-after.sha
          FQDN="$(jq -r '.properties.configuration.ingress.fqdn' /tmp/application-after.json)"
          [[ "$FQDN" == salcapa-dev-b48224.*.southcentralus.azurecontainerapps.io ]]
          READY=false
          STATUS=000
          for attempt in $(seq 1 30); do
            STATUS="$(curl --connect-timeout 5 --max-time 15 --silent --show-error --output /tmp/salcapa-ready.json --write-out '%{http_code}' "https://$FQDN/health/ready" || true)"
            if [ "$STATUS" = "200" ] && python frozen-release/tools/validate_live_readiness.py /tmp/salcapa-ready.json --environment dev >/dev/null 2>&1; then
              READY=true
              break
            fi
            sleep 10
          done
          test "$READY" = "true"
          python frozen-release/tools/validate_live_readiness.py /tmp/salcapa-ready.json --environment dev
          curl --connect-timeout 5 --max-time 15 --silent --show-error --dump-header /tmp/salcapa-oidc.headers --output /dev/null "https://$FQDN/api/auth/oidc/start"
          OIDC_LOCATION="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]+:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' /tmp/salcapa-oidc.headers)"
          [[ "$OIDC_LOCATION" == "https://login.microsoftonline.com/$EXPECTED_TENANT_ID/oauth2/v2.0/authorize"* ]]

          {
            echo "### SalCAPA v3.123 live demonstration acceptance"
            echo ""
            echo "- Runtime: exact frozen v3.123 immutable image"
            echo "- Environments: Aster Ridge, Cedar Vale, and Northstar; fictional demonstration only"
            echo "- Personas: 24 non-authenticating fixture identities"
            echo "- Journeys: SalINTEL, SalTHIRA, SalCAPA coordination, SalOPS, and PROVE evidence verified"
            echo "- Tenant and role boundaries: server-controlled; cross-tenant and unauthorized writes denied"
            echo "- Record states: Draft, Pending, Proposed, Open, or Requested; no human approval or release represented"
            echo "- PostgreSQL: governed fictional fixtures persisted through the normal fixture interface"
            echo "- Application image, identity, ingress, traffic, DNS, scale, and secret configuration: unchanged"
            echo "- Temporary consumption job: removed"
            echo "LIVE_DEMONSTRATION_ACCEPTED"
          } >> "$GITHUB_STEP_SUMMARY"
