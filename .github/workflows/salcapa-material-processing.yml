name: SalCAPA Material Processing

on:
  push:
    branches: [development/salcapa-platform, candidate/**]
    paths:
      - salcapa_material_processing.py
      - salcapa_office_processing.py
      - salcapa_pdf_processing.py
      - tools/salcapa_pdf_worker.py
      - salcapa_image_ocr_processing.py
      - tools/salcapa_image_ocr_worker.py
      - salcapa_audio_video_processing.py
      - tools/salcapa_audio_video_worker.py
      - static/salcapa-material-review.js
      - static/salcapa-material-review.css
      - tools/ci_salcapa_material_processing_smoke.py
      - tools/ci_salcapa_office_processing_smoke.py
      - tools/ci_salcapa_pdf_processing_smoke.py
      - tools/ci_salcapa_image_ocr_processing_smoke.py
      - tools/ci_salcapa_audio_video_processing_smoke.py
      - tools/reconstruct_salcapa_material_processing.py
      - tools/reconstruct_salcapa_office_processing.py
      - tools/reconstruct_salcapa_pdf_processing.py
      - tools/reconstruct_salcapa_image_ocr_processing.py
      - tools/reconstruct_salcapa_audio_video_processing.py
      - source_archives/development/salcapa_material_processing.py.gz
      - source_archives/development/salcapa-material-review.js.gz
      - source_archives/development/salcapa-material-review.css.gz
      - source_archives/development/ci_salcapa_material_processing_smoke.py.gz
      - source_archives/development/salcapa_office_processing.py.gz
      - source_archives/development/ci_salcapa_office_processing_smoke.py.gz
      - source_archives/development/salcapa_pdf_processing.py.gz
      - source_archives/development/salcapa_pdf_worker.py.gz
      - source_archives/development/ci_salcapa_pdf_processing_smoke.py.gz
      - source_archives/development/salcapa_image_ocr_processing.py.gz
      - source_archives/development/salcapa_image_ocr_worker.py.gz
      - source_archives/development/ci_salcapa_image_ocr_processing_smoke.py.gz
      - source_archives/development/salcapa_audio_video_processing.py.gz
      - source_archives/development/salcapa_audio_video_worker.py.gz
      - source_archives/development/ci_salcapa_audio_video_processing_smoke.py.gz
      - salcapa_runtime.py
      - Dockerfile
      - requirements.txt
      - requirements-ci.txt
      - .github/workflows/salcapa-material-processing.yml
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sqlite-security-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - run: pip install -r requirements.txt -r requirements-ci.txt
      - run: python tools/reconstruct_v343_source.py && python tools/verify_v343_source.py
      - run: python tools/reconstruct_salcapa_material_processing.py
      - run: python tools/reconstruct_salcapa_office_processing.py
      - run: python tools/reconstruct_salcapa_pdf_processing.py
      - run: python tools/reconstruct_salcapa_image_ocr_processing.py
      - run: python tools/reconstruct_salcapa_audio_video_processing.py
      - run: python tools/ci_salcapa_material_processing_smoke.py
      - run: python tools/ci_salcapa_office_processing_smoke.py
      - run: python tools/ci_salcapa_pdf_processing_smoke.py
      - run: python tools/ci_salcapa_image_ocr_processing_smoke.py
      - run: python -m py_compile salcapa_audio_video_processing.py tools/salcapa_audio_video_worker.py tools/ci_salcapa_audio_video_processing_smoke.py
      - run: python -m bandit -q -r salcapa_material_processing.py salcapa_office_processing.py salcapa_pdf_processing.py salcapa_image_ocr_processing.py salcapa_audio_video_processing.py tools/salcapa_pdf_worker.py tools/salcapa_image_ocr_worker.py tools/salcapa_audio_video_worker.py tools/ci_salcapa_material_processing_smoke.py tools/ci_salcapa_office_processing_smoke.py tools/ci_salcapa_pdf_processing_smoke.py tools/ci_salcapa_image_ocr_processing_smoke.py tools/ci_salcapa_audio_video_processing_smoke.py -ll -s B608
      - run: pip-audit -r requirements.txt

  postgres-16:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: salus
          POSTGRES_PASSWORD: salus
          POSTGRES_DB: salcapa
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U salus -d salcapa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SALUS_DB_BACKEND: postgres
      SALUS_DATABASE_URL: postgresql://salus:salus@127.0.0.1:5432/salcapa # repo-hygiene: allow; disposable CI service credential
      SALUS_AUTH_MODE: prototype
      SALUS_SEED_DEMO: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - run: pip install -r requirements.txt -r requirements-ci.txt
      - run: python tools/reconstruct_v343_source.py && python tools/verify_v343_source.py
      - run: python tools/reconstruct_salcapa_material_processing.py
      - run: python tools/reconstruct_salcapa_office_processing.py
      - run: python tools/reconstruct_salcapa_pdf_processing.py
      - run: python tools/reconstruct_salcapa_image_ocr_processing.py
      - run: python tools/reconstruct_salcapa_audio_video_processing.py
      - run: python tools/ci_salcapa_material_processing_smoke.py
      - run: python tools/ci_salcapa_office_processing_smoke.py
      - run: python tools/ci_salcapa_pdf_processing_smoke.py
      - run: python tools/ci_salcapa_image_ocr_processing_smoke.py
      - run: python -m py_compile salcapa_audio_video_processing.py tools/salcapa_audio_video_worker.py tools/ci_salcapa_audio_video_processing_smoke.py

  production-container:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: salus
          POSTGRES_PASSWORD: salus
          POSTGRES_DB: salcapa
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U salus -d salcapa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t salcapa-material-processing .
      - run: docker run --rm --entrypoint python salcapa-material-processing tools/ci_salcapa_material_processing_smoke.py
      - run: docker run --rm --entrypoint python salcapa-material-processing tools/ci_salcapa_office_processing_smoke.py
      - run: docker run --rm --entrypoint python salcapa-material-processing tools/ci_salcapa_pdf_processing_smoke.py
      - run: docker run --rm --entrypoint python salcapa-material-processing tools/ci_salcapa_image_ocr_processing_smoke.py
      - run: docker run --rm --entrypoint python salcapa-material-processing tools/ci_salcapa_audio_video_processing_smoke.py
      - name: PostgreSQL 16 transcription acceptance
        env:
          SALUS_MEDIA_TEST_DATABASE_URL: postgresql://salus:salus@127.0.0.1:5432/salcapa # repo-hygiene: allow; disposable CI service credential
        run: >-
          docker run --rm --network host --entrypoint python
          -e SALUS_DB_BACKEND=postgres
          -e SALUS_DATABASE_URL=${SALUS_MEDIA_TEST_DATABASE_URL}
          salcapa-material-processing tools/ci_salcapa_audio_video_processing_smoke.py
