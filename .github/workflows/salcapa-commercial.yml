name: SalCAPA Commercial Planning

on:
  push:
    branches: [development/salcapa-platform]
    paths:
      - 'salcapa_commercial.py'
      - 'salcapa_runtime.py'
      - 'tools/run_current_release_smoke.py'
      - 'source_archives/development/salcapa_commercial.py.gz'
      - 'source_archives/development/ci_salcapa_commercial_smoke.py.gz'
      - 'tools/reconstruct_salcapa_commercial.py'
      - 'tools/ci_salcapa_commercial_smoke.py'
      - '.github/workflows/salcapa-commercial.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
      - name: Reconstruct governed sources
        run: |
          python tools/reconstruct_v343_source.py
          python tools/reconstruct_salops_preparedness.py
          python tools/reconstruct_personnel_assessment.py
          python tools/reconstruct_salintel_relationships.py
          python tools/reconstruct_salintel_research.py
          python tools/reconstruct_salintel_handoffs.py
          python tools/reconstruct_facility_assessment.py
          python tools/reconstruct_salintel_monitoring.py
          python tools/reconstruct_salcapa_assurance.py
          python tools/reconstruct_salcapa_contextual_guidance.py
          python tools/reconstruct_salops_plan_assembly.py
          python tools/reconstruct_salcapa_commercial.py
      - name: Install application and security tools
        run: python -m pip install -r requirements.txt -r requirements-ci.txt
      - name: Compile commercial capability
        run: python -m py_compile salcapa_commercial.py salcapa_runtime.py tools/ci_salcapa_commercial_smoke.py tools/run_current_release_smoke.py
      - name: Static security scan
        run: bandit -q -r salcapa_commercial.py salcapa_runtime.py -ll -s B608
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - name: SQLite commercial acceptance
        run: python tools/run_current_release_smoke.py tools/ci_salcapa_commercial_smoke.py

  postgres16:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: salcapa_commercial_ci
          POSTGRES_USER: salus
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U salus -d salcapa_commercial_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Reconstruct governed sources
        run: |
          python tools/reconstruct_v343_source.py
          python tools/reconstruct_salops_preparedness.py
          python tools/reconstruct_personnel_assessment.py
          python tools/reconstruct_salintel_relationships.py
          python tools/reconstruct_salintel_research.py
          python tools/reconstruct_salintel_handoffs.py
          python tools/reconstruct_facility_assessment.py
          python tools/reconstruct_salintel_monitoring.py
          python tools/reconstruct_salcapa_assurance.py
          python tools/reconstruct_salcapa_contextual_guidance.py
          python tools/reconstruct_salops_plan_assembly.py
          python tools/reconstruct_salcapa_commercial.py
      - name: Install application
        run: python -m pip install -r requirements.txt
      - name: PostgreSQL 16 commercial acceptance
        env:
          SALUS_DB_BACKEND: postgres
          SALUS_DATABASE_URL: postgresql://salus@127.0.0.1:5432/salcapa_commercial_ci
          SALUS_AUTH_MODE: prototype
          SALUS_SEED_DEMO: '1'
          SALUS_LOCAL_STORAGE_DIR: /tmp/commercial-pg-attachments
          SALUS_BACKUP_DIR: /tmp/commercial-pg-backups
        run: python tools/run_current_release_smoke.py tools/ci_salcapa_commercial_smoke.py

  production-container:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build production container
        run: docker build --tag salcapa-commercial:ci .
      - name: Run commercial acceptance in container
        run: |
          docker run --rm \
            -e SALUS_DB_BACKEND=sqlite \
            -e SALUS_DB_PATH=/app/data/commercial-container.db \
            -e SALUS_LOCAL_STORAGE_DIR=/app/attachments \
            -e SALUS_BACKUP_DIR=/app/backups \
            -e SALUS_AUTH_MODE=prototype \
            -e SALUS_SEED_DEMO=1 \
            salcapa-commercial:ci python tools/run_current_release_smoke.py tools/ci_salcapa_commercial_smoke.py
