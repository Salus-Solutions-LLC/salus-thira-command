name: SalCAPA v3.252 historical exception correlation

on:
  push:
    branches:
      - development/salcapa-platform
    paths:
      - '.github/workflows/salcapa-v3252-historical-exception-correlation.yml'

permissions:
  contents: read

concurrency:
  group: salcapa-v3252-historical-exception-correlation-dev
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    environment: salcapa-dev-approval
    permissions: {}
    steps:
      - run: echo 'Protected historical exception correlation gate passed.'

  diagnose:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Run one bounded read-only query through the existing private inventory job
        env:
          EXPECTED_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          EXPECTED_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(az account show --query id -o tsv)" = "$EXPECTED_SUBSCRIPTION_ID"
          test "$(az account show --query tenantId -o tsv)" = "$EXPECTED_TENANT_ID"
          az containerapp job show -g rg-salcapa-dev -n salcapa-dev-b48224-scan-inv -o json > "$RUNNER_TEMP/inventory-job.json"
          python - "$RUNNER_TEMP/inventory-job.json" "$RUNNER_TEMP/read-only-template.yaml" <<'PY'
          import json
          import sys
          from pathlib import Path

          job=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          props=job.get('properties') or {}
          config=props.get('configuration') or {}
          template=props.get('template') or {}
          containers=template.get('containers') or []
          expected='salcapadevb48224acr.azurecr.io/salcapa@sha256:715a9e3b74d981226749af04589e2730f3c44359066392cc8fcf16f78e477b44'
          if (job.get('name')!='salcapa-dev-b48224-scan-inv'
              or config.get('triggerType')!='Schedule'
              or (config.get('scheduleTriggerConfig') or {}).get('cronExpression')!='0 2 * * *'
              or len(containers)!=1 or containers[0].get('image')!=expected):
              raise SystemExit('Inventory job differs from reviewed diagnostic bounds')
          code = """
          import json
          from collections import Counter
          try:
              from app import db, package_quarantine
              from salus_scan_inventory import compare_quarantine_versions, list_azure_quarantine_versions
              reader=package_quarantine(for_worker=True)
              conn=db()
              try:
                  ledger=[dict(row) for row in conn.execute(
                      "SELECT tenant_id,blob_name,blob_version_id,size_bytes,legal_hold "
                      "FROM package_intake_pending_scans")]
                  open_rows=[dict(row) for row in conn.execute(
                      "SELECT exception_type,blob_name,blob_version_id "
                      "FROM package_quarantine_inventory_exceptions WHERE status='Open'")]
              finally:
                  conn.close()
              azure=list(list_azure_quarantine_versions(reader.container))
              if max(len(ledger),len(azure),len(open_rows))>100:
                  raise ValueError('Review capacity exceeded')
              comparison=compare_quarantine_versions(ledger,azure,max_versions=100)
              fields=('unlinked_versions','missing_versions','size_mismatches','hold_mismatches')
              if any(comparison[field] for field in fields):
                  raise ValueError('Current inventory is not clear')
              expected_types={'Unlinked','Missing','SizeMismatch','HoldMismatch'}
              ledger_keys={(row['blob_name'],row['blob_version_id']) for row in ledger}
              azure_keys={(row['name'],row['version_id']) for row in azure}
              counts=Counter()
              for row in open_rows:
                  kind=row['exception_type']
                  key=(row['blob_name'],row['blob_version_id'])
                  if kind not in expected_types or not all(isinstance(x,str) and x for x in key):
                      raise ValueError('Historical exception row is invalid')
                  counts[(kind,key in ledger_keys,key in azure_keys)]+=1
              groups=[{'type':kind,'in_current_ledger':in_ledger,
                       'in_current_azure':in_azure,'count':count}
                      for (kind,in_ledger,in_azure),count in sorted(counts.items())]
              print(json.dumps({'current_exceptions':0,'historical_open_count':len(open_rows),
                                'presence_groups':groups},sort_keys=True))
          except Exception as exc:
              print(json.dumps({'historical_correlation':'failed',
                                'error_type':type(exc).__name__},sort_keys=True))
              raise SystemExit(1)
          """
          containers[0]['command']=['python']
          containers[0]['args']=['-c',code]
          Path(sys.argv[2]).write_text(json.dumps(template),encoding='utf-8')
          print('exact_inventory_job_preflight=passed')
          PY
          az containerapp job start -g rg-salcapa-dev -n salcapa-dev-b48224-scan-inv --yaml "$RUNNER_TEMP/read-only-template.yaml" -o json > "$RUNNER_TEMP/diagnostic-execution.json"
          python - "$RUNNER_TEMP/diagnostic-execution.json" <<'PY'
          import json,re,sys
          value=json.load(open(sys.argv[1],encoding='utf-8'))
          name=value.get('name') or ''
          if not re.fullmatch(r'salcapa-dev-b48224-scan-inv-[a-z0-9]+',name):
              raise SystemExit('Diagnostic execution name unavailable')
          print('historical_correlation_execution='+name)
          PY
