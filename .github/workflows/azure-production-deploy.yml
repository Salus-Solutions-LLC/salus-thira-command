name: SalCAPA Azure controlled deployment

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Validate, provision foundation, deploy, or roll back an approved immutable image
        required: true
        type: choice
        default: validate
        options:
          - validate
          - foundation
          - deploy
          - rollback
      target_environment:
        description: Governed Azure environment
        required: true
        type: choice
        default: dev
        options:
          - dev
          - prod
      image_digest:
        description: Full immutable digest in the governed SalCAPA Azure Container Registry; required for deploy/rollback
        required: false
        type: string
      unique_suffix:
        description: Approved four-to-six-character globally unique resource suffix
        required: true
        type: string
      location:
        description: Approved Azure region
        required: true
        type: choice
        default: southcentralus
        options:
          - southcentralus
          - eastus2
      approval_record:
        description: Approval record; deployment actions require the approved lean Azure record
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: salcapa-azure-${{ inputs.target_environment }}
  cancel-in-progress: false

env:
  APPROVED_AZURE_RECORD: MD-APPROVAL-AZURE-LEAN-20260904
  MONTHLY_COST_CEILING_USD: '30'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enforce governed source, approval, and immutable inputs
        env:
          OPERATION: ${{ inputs.operation }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          APPROVAL_RECORD: ${{ inputs.approval_record }}
          UNIQUE_SUFFIX: ${{ inputs.unique_suffix }}
          AZURE_BUDGET_CONTACT_EMAIL: ${{ vars.AZURE_BUDGET_CONTACT_EMAIL }}
          ENTRA_RUNTIME_CLIENT_ID: ${{ vars.ENTRA_RUNTIME_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [[ "$OPERATION" != "validate" && "$GITHUB_REF" != "refs/heads/development/salcapa-platform" ]]; then
            echo "Azure changes are restricted to the governed development branch." >&2
            exit 1
          fi
          if [[ ! "$UNIQUE_SUFFIX" =~ ^[a-z0-9]{4,6}$ ]]; then
            echo "Invalid resource suffix." >&2
            exit 1
          fi
          if [[ "$OPERATION" != "validate" && "$APPROVAL_RECORD" != "$APPROVED_AZURE_RECORD" ]]; then
            echo "The approved lean Azure authorization record is required." >&2
            exit 1
          fi
          if [[ "$MONTHLY_COST_CEILING_USD" != "30" ]]; then
            echo "Azure monthly ceiling may not exceed the approved $30." >&2
            exit 1
          fi
          if [[ "$OPERATION" != "validate" && ! "$AZURE_BUDGET_CONTACT_EMAIL" =~ ^[^[:space:]@]+@[^[:space:]@]+\.[^[:space:]@]+$ ]]; then
            echo "Protected repository variable AZURE_BUDGET_CONTACT_EMAIL is required for governed provisioning." >&2
            exit 1
          fi
          if [[ "$OPERATION" == "deploy" && ! "$ENTRA_RUNTIME_CLIENT_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "Deploy requires the exact non-secret ENTRA_RUNTIME_CLIENT_ID UUID after federation is configured." >&2
            exit 1
          fi
          if [[ "$OPERATION" == "deploy" || "$OPERATION" == "rollback" ]]; then
            if [[ ! "$IMAGE_DIGEST" =~ ^[a-z0-9][a-z0-9.-]*\.azurecr\.io/[a-z0-9][a-z0-9._/-]*@sha256:[0-9a-f]{64}$ ]]; then
              echo "A full immutable Azure Container Registry digest is required." >&2
              exit 1
            fi
            EXPECTED_REGISTRY="salcapa${TARGET_ENVIRONMENT}${UNIQUE_SUFFIX}acr.azurecr.io/"
            if [[ "$IMAGE_DIGEST" != "$EXPECTED_REGISTRY"* ]]; then
              echo "The image must come from the target environment's governed registry." >&2
              exit 1
            fi
          fi
      - name: Compile infrastructure without Azure credentials
        run: az bicep build --file infra/azure/main.bicep --stdout > /tmp/salcapa-arm.json

  foundation:
    if: inputs.operation == 'foundation'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: salcapa-${{ inputs.target_environment }}-approval
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Azure login through workload identity federation
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: What-if and provision approved lean foundation
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          UNIQUE_SUFFIX: ${{ inputs.unique_suffix }}
          LOCATION: ${{ inputs.location }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          ENTRA_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          POSTGRES_ADMIN_OBJECT_ID: ${{ vars.POSTGRES_ADMIN_OBJECT_ID }}
          POSTGRES_ADMIN_PRINCIPAL_NAME: ${{ vars.POSTGRES_ADMIN_PRINCIPAL_NAME }}
          POSTGRES_ADMIN_PRINCIPAL_TYPE: ${{ vars.POSTGRES_ADMIN_PRINCIPAL_TYPE }}
          DEPLOYMENT_PRINCIPAL_OBJECT_ID: ${{ vars.DEPLOYMENT_PRINCIPAL_OBJECT_ID }}
          AZURE_BUDGET_CONTACT_EMAIL: ${{ vars.AZURE_BUDGET_CONTACT_EMAIL }}
          ENTRA_RUNTIME_CLIENT_ID: ${{ vars.ENTRA_RUNTIME_CLIENT_ID }}
          APPROVAL_RECORD: ${{ inputs.approval_record }}
        run: |
          set -euo pipefail
          test -n "$RESOURCE_GROUP"
          test -n "$ENTRA_TENANT_ID"
          test -n "$POSTGRES_ADMIN_OBJECT_ID"
          test -n "$POSTGRES_ADMIN_PRINCIPAL_NAME"
          test -n "$DEPLOYMENT_PRINCIPAL_OBJECT_ID"
          if [[ ! "$POSTGRES_ADMIN_PRINCIPAL_TYPE" =~ ^(Group|User)$ ]]; then
            echo "The PostgreSQL Entra administrator type must be Group or User." >&2
            exit 1
          fi
          BUDGET_USD="$(bash tools/azure_operational_budget.sh "$RESOURCE_GROUP" "$TARGET_ENVIRONMENT" "$UNIQUE_SUFFIX" foundation)"
          PARAMETERS=(
            uniqueSuffix="$UNIQUE_SUFFIX"
            location="$LOCATION"
            environmentName="$TARGET_ENVIRONMENT"
            provisionApplication=false
            entraTenantId="$ENTRA_TENANT_ID"
            entraRuntimeClientId="$ENTRA_RUNTIME_CLIENT_ID"
            postgresAdminObjectId="$POSTGRES_ADMIN_OBJECT_ID"
            postgresAdminPrincipalName="$POSTGRES_ADMIN_PRINCIPAL_NAME"
            postgresAdminPrincipalType="$POSTGRES_ADMIN_PRINCIPAL_TYPE"
            deploymentPrincipalObjectId="$DEPLOYMENT_PRINCIPAL_OBJECT_ID"
            sourceCommit="$GITHUB_SHA"
            approvalRecord="$APPROVAL_RECORD"
            monthlyCostCeilingUsd=30
            operationalBudgetUsd="$BUDGET_USD"
            budgetContactEmail="$AZURE_BUDGET_CONTACT_EMAIL"
          )
          if [[ "$(az group exists --name "$RESOURCE_GROUP")" == "true" ]]; then
            BUDGET_NAME="salcapa-$TARGET_ENVIRONMENT-$UNIQUE_SUFFIX-monthly-budget"
            BUDGET_START_DATE="$(az consumption budget show --resource-group "$RESOURCE_GROUP" --budget-name "$BUDGET_NAME" --query timePeriod.startDate -o tsv)"
            [[ "$BUDGET_START_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]] || exit 1
            PARAMETERS+=(budgetStartDate="$BUDGET_START_DATE")
          fi
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/azure/main.bicep \
            --parameters "${PARAMETERS[@]}"
          DEPLOYMENT_NAME="salcapa-foundation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          az deployment group create \
            --name "$DEPLOYMENT_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/azure/main.bicep \
            --parameters "${PARAMETERS[@]}"

          az deployment group show \
            --name "$DEPLOYMENT_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.outputs \
            --output json > /tmp/salcapa-foundation-outputs.json
          jq -e '
            .managedIdentityPrincipalId.value != null and
            .managedIdentityClientId.value != null and
            .federatedCredentialIssuer.value != null and
            .federatedCredentialSubject.value != null and
            .federatedCredentialAudience.value == "api://AzureADTokenExchange" and
            .runtimeRedirectUri.value != null
          ' /tmp/salcapa-foundation-outputs.json >/dev/null
          {
            echo "### SalCAPA foundation federation contract"
            echo ""
            echo "Use the deployment outputs for the single-tenant runtime app registration:"
            echo ""
            echo "- Issuer: $(jq -r '.federatedCredentialIssuer.value' /tmp/salcapa-foundation-outputs.json)"
            echo "- Subject: $(jq -r '.federatedCredentialSubject.value' /tmp/salcapa-foundation-outputs.json)"
            echo "- Audience: $(jq -r '.federatedCredentialAudience.value' /tmp/salcapa-foundation-outputs.json)"
            echo "- Redirect URI: $(jq -r '.runtimeRedirectUri.value' /tmp/salcapa-foundation-outputs.json)"
            echo "- Managed identity client ID: $(jq -r '.managedIdentityClientId.value' /tmp/salcapa-foundation-outputs.json)"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: inputs.operation == 'deploy'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: salcapa-${{ inputs.target_environment }}-approval
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Azure login through workload identity federation
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: What-if and deploy immutable SalCAPA application
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          UNIQUE_SUFFIX: ${{ inputs.unique_suffix }}
          LOCATION: ${{ inputs.location }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          ENTRA_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          POSTGRES_ADMIN_OBJECT_ID: ${{ vars.POSTGRES_ADMIN_OBJECT_ID }}
          POSTGRES_ADMIN_PRINCIPAL_NAME: ${{ vars.POSTGRES_ADMIN_PRINCIPAL_NAME }}
          POSTGRES_ADMIN_PRINCIPAL_TYPE: ${{ vars.POSTGRES_ADMIN_PRINCIPAL_TYPE }}
          DEPLOYMENT_PRINCIPAL_OBJECT_ID: ${{ vars.DEPLOYMENT_PRINCIPAL_OBJECT_ID }}
          AZURE_BUDGET_CONTACT_EMAIL: ${{ vars.AZURE_BUDGET_CONTACT_EMAIL }}
          ENTRA_RUNTIME_CLIENT_ID: ${{ vars.ENTRA_RUNTIME_CLIENT_ID }}
          APPROVAL_RECORD: ${{ inputs.approval_record }}
        run: |
          set -euo pipefail
          test -n "$RESOURCE_GROUP"
          test -n "$ENTRA_TENANT_ID"
          test -n "$ENTRA_RUNTIME_CLIENT_ID"
          test -n "$POSTGRES_ADMIN_OBJECT_ID"
          test -n "$POSTGRES_ADMIN_PRINCIPAL_NAME"
          test -n "$DEPLOYMENT_PRINCIPAL_OBJECT_ID"
          BUDGET_USD="$(bash tools/azure_operational_budget.sh "$RESOURCE_GROUP" "$TARGET_ENVIRONMENT" "$UNIQUE_SUFFIX" existing)"
          PARAMETERS=(
            uniqueSuffix="$UNIQUE_SUFFIX"
            location="$LOCATION"
            environmentName="$TARGET_ENVIRONMENT"
            containerImageDigest="$IMAGE_DIGEST"
            provisionApplication=true
            entraTenantId="$ENTRA_TENANT_ID"
            entraRuntimeClientId="$ENTRA_RUNTIME_CLIENT_ID"
            postgresAdminObjectId="$POSTGRES_ADMIN_OBJECT_ID"
            postgresAdminPrincipalName="$POSTGRES_ADMIN_PRINCIPAL_NAME"
            postgresAdminPrincipalType="$POSTGRES_ADMIN_PRINCIPAL_TYPE"
            deploymentPrincipalObjectId="$DEPLOYMENT_PRINCIPAL_OBJECT_ID"
            sourceCommit="$GITHUB_SHA"
            approvalRecord="$APPROVAL_RECORD"
            monthlyCostCeilingUsd=30
            operationalBudgetUsd="$BUDGET_USD"
            budgetContactEmail="$AZURE_BUDGET_CONTACT_EMAIL"
          )
          if [[ "$(az group exists --name "$RESOURCE_GROUP")" == "true" ]]; then
            BUDGET_NAME="salcapa-$TARGET_ENVIRONMENT-$UNIQUE_SUFFIX-monthly-budget"
            BUDGET_START_DATE="$(az consumption budget show --resource-group "$RESOURCE_GROUP" --budget-name "$BUDGET_NAME" --query timePeriod.startDate -o tsv)"
            [[ "$BUDGET_START_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]] || exit 1
            PARAMETERS+=(budgetStartDate="$BUDGET_START_DATE")
          fi
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/azure/main.bicep \
            --parameters "${PARAMETERS[@]}"
          DEPLOYMENT_NAME="salcapa-app-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          az deployment group create \
            --name "$DEPLOYMENT_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/azure/main.bicep \
            --parameters "${PARAMETERS[@]}"

  rollback:
    if: inputs.operation == 'rollback'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: salcapa-${{ inputs.target_environment }}-approval
    steps:
      - name: Azure login through workload identity federation
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Select approved prior immutable digest
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP_NAME: salcapa-${{ inputs.target_environment }}-${{ inputs.unique_suffix }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          APPROVAL_RECORD: ${{ inputs.approval_record }}
        run: |
          set -euo pipefail
          test -n "$RESOURCE_GROUP"
          az containerapp update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINER_APP_NAME" \
            --image "$IMAGE_DIGEST" \
            --set-env-vars SALUS_ALLOW_RESTORE=0 SALUS_SEED_DEMO=0 SALUS_ALLOW_SQLITE_PRODUCTION=0
          APP_ID="$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$CONTAINER_APP_NAME" --query id --output tsv)"
          az resource tag --ids "$APP_ID" --is-incremental --tags rollbackApproval="$APPROVAL_RECORD" rollbackCommit="$GITHUB_SHA" monthlyCostCeilingUsd=30
