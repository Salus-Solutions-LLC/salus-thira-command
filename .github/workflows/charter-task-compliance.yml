name: Charter task compliance controls
on:
  pull_request:
  push:
    branches: [development/salcapa-platform]
permissions:
  contents: read
jobs:
  verify-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify current authority coverage
        run: python tools/ci_charter_task_compliance.py
      - name: Verify positive and adverse control behavior
        run: python -m unittest discover -s tests -p test_charter_task_compliance.py -v
      - name: Install Word heading-check dependency
        run: pip install python-docx==1.2.0
      - name: Verify heading spacing and adverse override detection
        run: python -m unittest discover -s tests -p test_salus_document_styles.py -v

