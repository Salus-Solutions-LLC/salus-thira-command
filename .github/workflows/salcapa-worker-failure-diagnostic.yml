name: SalCAPA scoped worker failure diagnostic

on:
  push:
    branches:
      - development/salcapa-platform
    paths:
      - '.github/workflows/salcapa-worker-failure-diagnostic.yml'

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    environment: salcapa-dev-approval
    permissions: {}
    steps:
      - run: echo "Protected read-only diagnostic gate passed."

  diagnose:
    needs: authorize
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Query one failed worker window and emit redacted signatures
        env:
          EXPECTED_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          EXPECTED_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail
          test "$(az account show --query id --output tsv)" = "$EXPECTED_SUBSCRIPTION_ID"
          test "$(az account show --query tenantId --output tsv)" = "$EXPECTED_TENANT_ID"
          WORKSPACE_ID="$(az monitor log-analytics workspace show --resource-group rg-salcapa-dev --workspace-name salcapa-dev-b48224-logs --query customerId --output tsv)"
          test -n "$WORKSPACE_ID"
          az containerapp job execution list --resource-group rg-salcapa-dev --name salcapa-dev-b48224-kb-scan --output json > "$RUNNER_TEMP/scoped-worker-executions.json"
          python - "$RUNNER_TEMP/scoped-worker-executions.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          rows = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if isinstance(rows, dict):
              rows = rows.get("value", [])
          scoped = []
          for row in rows:
              props = row.get("properties", {})
              start = str(props.get("startTime") or "")
              if not start.startswith("2026-10-02T11:"):
                  continue
              try:
                  minute = int(start[14:16])
              except ValueError:
                  continue
              if minute < 28 or minute > 45:
                  continue
              containers = props.get("template", {}).get("containers", []) or props.get("containers", [])
              images = [str(item.get("image", "")) for item in containers if isinstance(item, dict)]
              image = "candidate" if any("2121f1e9675bccbc53b78b1d40371c8168e1db5f7e595fc5be75b23e72e0e2f1" in value for value in images) else ("accepted" if any("77b9ecd15c25a5baad55be47a6385429df3eb9c3f5712a0cd94745d22cf6f8b1" in value for value in images) else "unspecified")
              scoped.append((start[:16], str(props.get("status", "unknown")), str(props.get("endTime") or "")[:16], image))
          print("scoped_executions=" + str(len(scoped)))
          for start, status, end, image in sorted(scoped):
              print("execution_minute=" + start + " status=" + status + " end_minute=" + end + " image=" + image)
          PY
          az monitor log-analytics query --workspace "$WORKSPACE_ID" --analytics-query "ContainerAppConsoleLogs | where TimeGenerated between (datetime(2026-10-02T11:28:00Z) .. datetime(2026-10-02T11:45:00Z)) | where JobName == 'salcapa-dev-b48224-kb-scan' | project TimeGenerated, ContainerImage, Log | take 1000" --output json > "$RUNNER_TEMP/scoped-worker-logs.json"
          python - "$RUNNER_TEMP/scoped-worker-logs.json" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          rows = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if isinstance(rows, dict):
              rows = rows.get("tables", [{}])[0].get("rows", [])
          signatures = set()
          image_counts = {"candidate": 0, "accepted": 0, "other": 0}
          line_kinds = set()
          safe_hints = {
              "BadZipFile": "corrupt_office_package",
              "DOCUMENT_PACKAGE_INVALID": "invalid_document_package",
              "429": "rate_limit",
              "401": "authentication",
              "403": "authorization",
              "timeout": "timeout",
              "database": "database",
              "not configured": "configuration",
              "permission": "permission",
              "out of memory": "memory",
              "No space left": "storage_capacity",
          }
          allowed_frames = {
              "salcapa_office_processing.py",
              "salcapa_knowledge_worker.py",
              "salcapa_knowledge_promotion.py",
              "salcapa_m365_intake.py",
              "salcapa_runtime.py",
          }
          for row in rows:
              line = row.get("Log", "") if isinstance(row, dict) else str(row)
              minute = str(row.get("TimeGenerated", "unknown"))[:16] if isinstance(row, dict) else "unknown"
              image_text = str(row.get("ContainerImage", "")) if isinstance(row, dict) else ""
              image_kind = ("candidate" if "2121f1e9675bccbc53b78b1d40371c8168e1db5f7e595fc5be75b23e72e0e2f1" in image_text
                            else "accepted" if "77b9ecd15c25a5baad55be47a6385429df3eb9c3f5712a0cd94745d22cf6f8b1" in image_text
                            else "other")
              image_counts[image_kind] += 1
              category = ("phase" if "SALCAPA_WORKER_PHASE=" in line
                          else "batch_result" if "SALCAPA_KNOWLEDGE_BATCH=" in line
                          else "traceback" if "Traceback" in line
                          else "exception" if "Exception" in line or "Error" in line
                          else "warning" if "WARNING" in line
                          else "other")
              line_kinds.add("console_category=" + image_kind + ":" + category)
              prefix = "minute=" + minute + " image=" + image_kind + " "
              for word, label in safe_hints.items():
                  if word.lower() in line.lower():
                      signatures.add(prefix + "hint=" + label)
              for name in re.findall(r"\b([A-Za-z_][A-Za-z_0-9.]*(?:Error|Exception)):", line):
                  signatures.add(prefix + "exception=" + name)
              for filename, number, function in re.findall(
                  r'File "[^"]*[/\\]([^/\\"]+)", line (\d+), in ([A-Za-z_][A-Za-z_0-9]*)',
                  line,
              ):
                  if filename in allowed_frames:
                      signatures.add(prefix + "frame=" + filename + ":" + number + ":" + function)
              for phase in re.findall(r"SALCAPA_WORKER_PHASE=([A-Za-z_]{2,64})", line):
                  signatures.add(prefix + "phase=" + phase)
          print("scoped_rows=" + str(len(rows)))
          print("console_image_counts=" + ",".join(key + ":" + str(value) for key, value in sorted(image_counts.items())))
          for category in sorted(line_kinds):
              print(category)
          for signature in sorted(signatures):
              print(signature)
          if not signatures:
              print("no_safe_failure_signature_found")
          PY
          az monitor log-analytics query --workspace "$WORKSPACE_ID" --analytics-query "ContainerAppSystemLogs | where TimeGenerated between (datetime(2026-10-02T11:28:00Z) .. datetime(2026-10-02T11:45:00Z)) | where JobName == 'salcapa-dev-b48224-kb-scan' | project TimeGenerated, Reason, Log | take 1000" --output json > "$RUNNER_TEMP/scoped-worker-system-logs.json"
          python - "$RUNNER_TEMP/scoped-worker-system-logs.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          rows = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if isinstance(rows, dict):
              rows = rows.get("tables", [{}])[0].get("rows", [])
          labels = {
              "imagepull": "image_pull",
              "failedtopull": "image_pull",
              "backoff": "retry_backoff",
              "oom": "memory_limit",
              "memory": "memory",
              "timeout": "timeout",
              "deadline": "deadline",
              "failed": "failed",
              "killed": "killed",
              "unhealthy": "unhealthy",
              "exit code": "exit_code",
              "containercreated": "created",
              "containerstarted": "started",
          }
          signatures = set()
          for row in rows:
              reason = str(row.get("Reason", "")) if isinstance(row, dict) else ""
              message = str(row.get("Log", "")) if isinstance(row, dict) else str(row)
              minute = str(row.get("TimeGenerated", "unknown"))[:16] if isinstance(row, dict) else "unknown"
              for word, label in labels.items():
                  if word in (reason + " " + message).lower():
                      signatures.add("system_minute=" + minute + " hint=" + label)
          print("system_rows=" + str(len(rows)))
          for signature in sorted(signatures):
              print(signature)
          PY
