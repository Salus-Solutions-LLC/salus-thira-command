name: SalCAPA governed historical outside-cohort log recovery
on:
  pull_request:
    paths:
      - '.github/workflows/salcapa-knowledge-outside-log-recovery.yml'
      - 'deploy/azure/activations/knowledge-outside-log-recovery-20261116.json'
      - 'deploy/azure/activations/knowledge-outside-cohort-log-reference-20261116.json'
      - 'tools/recover_knowledge_outside_cohort_log.py'
      - 'tests/test_knowledge_outside_cohort_log_recovery.py'
      - 'docs/knowledge-outside-cohort-log-recovery-20261116.md'
      - '.github/workflows/salcapa-knowledge-outside-cohort-drift.yml'
      - 'CURRENT_HANDOFF.md'
      - 'APPROVED_ARTIFACTS.md'
      - 'governance/charter_task_requirements_register.json'
      - 'tools/validate_knowledge_outside_cohort_drift.py'
      - 'tools/knowledge_inventory_azure_transport.py'
  push:
    branches: [development/salcapa-platform]
    paths:
      - 'deploy/azure/activations/knowledge-outside-log-recovery-20261116.json'
concurrency:
  group: salcapa-knowledge-diagnostic
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.4.2 PyYAML==6.0.2
      - run: python -m pytest -q -p no:cacheprovider tests/test_knowledge_outside_cohort_log_recovery.py
      - name: Validate workflow shell syntax
        run: |
          python - <<'PY'
          import subprocess,yaml
          w=yaml.load(open('.github/workflows/salcapa-knowledge-outside-log-recovery.yml'),Loader=yaml.BaseLoader)
          for job in w['jobs'].values():
              for step in job.get('steps',[]):
                  if 'run' in step:subprocess.run(['bash','-n'],input=step['run'],text=True,check=True)
          PY
  authorize_scoped:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: salcapa-dev-approval
    permissions: {}
    steps:
      - run: echo "Protected historical read gate passed."
  recover:
    needs: authorize_scoped
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate exact historical read
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          python - <<'PY'
          import hashlib,json,pathlib
          expected=json.loads('{"operation": "outside_cohort_historical_log_recovery", "task_key": "salus-outside-cohort-historical-log-recovery-20261116", "authority_record_commit": "95181cbb19941fd7ccc5a82b1515be22c8b766a4", "source_run_id": 43955840933, "source_job_id": 133610096637, "source_execution": "salcapa-outdrift-b48224-3tcgdet", "window_start": "2026-11-16T21:02:00Z", "window_end": "2026-11-16T21:16:00Z", "resource_group": "rg-salcapa-dev", "workspace_name": "salcapa-dev-b48224-logs", "maximum_query_reads": 2, "maximum_read_seconds": 90, "maximum_response_bytes": 2097152, "maximum_rows_per_read": 100, "maximum_reconstructed_report_bytes": 131072, "expected_recovered_sources": 6, "preserved_receipt_count": 20, "preserved_receipts_sha256": "21c4bcd816686d4178c32bf224228c13639aa56a8225cf0cd3219af6fab0cd1f", "protected_checkpoint_sha256": "214f2756ca0bc179bfaed880480113b5cd31cecd9de0e803e03013bcd4872ac7", "expected_runtime_image_digest": "salcapadevb48224acr.azurecr.io/salcapa@sha256:8f5823ef53d08eaa319f8073b00b6d817ab3db5e07b8f55c0dffb72868cd580c", "source_sha256": {"tools/recover_knowledge_outside_cohort_log.py": "1730dccd39d7f6e982d1a869b8dd3846d64779e3eba8a70fbd99cced3ea70748", "tools/validate_knowledge_outside_cohort_drift.py": "b9c2d0fdae526d82d9c166155f661aa6f3c2d6daa21a5759b89746f3aed4124c", "tools/knowledge_inventory_azure_transport.py": "2e6925ee37c7b5e7b4c61f8fc68dcb3c305b8890afbe1c2d56a9485b7a7062d3", "deploy/azure/activations/knowledge-outside-cohort-log-reference-20261116.json": "082c6d2d278528723c9279f6afe61a2bd61ebbe1c628dd7b03748eec292cf03f"}, "authority_rows": [{"path": "SALUS_DECISION_REGISTER.md", "needle": "| SAL-D137 |", "sha256": "6644cd3d1c42b0690fd56488049fb0f29259d932210a91cafbced8ebb0e510d4"}, {"path": "APPROVED_ARTIFACTS.md", "needle": "9a662aa94726890dfc7e4845620161ab372d81c2cc27ba8f45d84ee694840821", "sha256": "bf7b7348e59e2b9cd0edb5976fed5590f425923523b6bae83542da41f6fc0f14"}, {"path": "APPROVED_ARTIFACTS.md", "needle": "1d1883f3da42c5e3c0aa736f0d7f3d3369193787a3ec27d514287cc639787026", "sha256": "e355c5e5bd4ebed4810bf717023890580f480df38dc2b97c6922bc0ffa396689"}, {"path": "APPROVED_ARTIFACTS.md", "needle": "d68b22cc0eca5655dee804dd3f8e2d511c4cded9d0643d1a2ab2cb829e1a2c85", "sha256": "54e0bcb2af569eb0cb6486ff640e6790f23b59551e3196f44cfe5d40ec884058"}, {"path": "APPROVED_ARTIFACTS.md", "needle": "48b56aa85a3098946d9c75042b64c481941a6d8c290e2ed3a42eefeb41ac8638", "sha256": "b92faf8563462a330224325732de8af8a11efb4acedb63650128676c8e3d378b"}, {"path": "APPROVED_ARTIFACTS.md", "needle": "`salus-preflight-blocker-diagnostic-20261116`", "sha256": "6b2a352579c06e6f771f38a4f19f2b4969e5bc1a626f9588cf869f2b11b3a4b3"}], "http_methods": ["GET"], "job_start_authorized": false, "job_create_delete_authorized": false, "database_access_authorized": false, "record_receipt_writes_authorized": false, "baseline_adoption_authorized": false, "source_bytes_authorized": false, "processing_authorized": false, "retry_hold_changes_authorized": false, "permissions_or_logging_changes_authorized": false}')
          actual=json.loads(pathlib.Path('deploy/azure/activations/knowledge-outside-log-recovery-20261116.json').read_text())
          assert actual==expected,'historical read activation mismatch'
          for path,checksum in expected['source_sha256'].items():
              assert hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()==checksum,'source mismatch'
          for binding in expected['authority_rows']:
              rows=[line for line in pathlib.Path(binding['path']).read_text().splitlines() if line.startswith('|') and binding['needle'] in line]
              assert len(rows)==1 and hashlib.sha256(rows[0].encode()).hexdigest()==binding['sha256'],'governing row mismatch'
          print('EXACT_HISTORICAL_READ_GUARD=1')
          PY
      - uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Snapshot unchanged runtime and retrieve historical telemetry only
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          test "$RESOURCE_GROUP" = "rg-salcapa-dev"
          SUBSCRIPTION_ID="$(az account show --query id --output tsv --only-show-errors)"
          for kind in app worker; do
            if [ "$kind" = app ]; then RESOURCE="containerApps/salcapa-dev-b48224"; else RESOURCE="jobs/salcapa-dev-b48224-kb-scan"; fi
            python tools/knowledge_inventory_azure_transport.py get --url "https://management.azure.com/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.App/${RESOURCE}?api-version=2025-07-01" --output "/tmp/historical-${kind}-before.json"
          done
          python - <<'PY'
          import json
          activation=json.load(open('deploy/azure/activations/knowledge-outside-log-recovery-20261116.json'))
          for kind in ('app','worker'):
              value=json.load(open('/tmp/historical-'+kind+'-before.json'))
              assert value['properties']['template']['containers'][0]['image']==activation['expected_runtime_image_digest']
          PY
          WORKSPACE_ID="$(az monitor log-analytics workspace show --resource-group "$RESOURCE_GROUP" --workspace-name salcapa-dev-b48224-logs --query customerId --output tsv --only-show-errors)"
          python tools/recover_knowledge_outside_cohort_log.py --workspace "$WORKSPACE_ID"
      - name: Verify runtime and namespace preservation; clear temporary evidence
        if: always()
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          test "$RESOURCE_GROUP" = "rg-salcapa-dev"
          SUBSCRIPTION_ID="$(az account show --query id --output tsv --only-show-errors)"
          RUNTIME_OK=1
          for kind in app worker; do
            if [ ! -f "/tmp/historical-${kind}-before.json" ]; then RUNTIME_OK=0; continue; fi
            if [ "$kind" = app ]; then RESOURCE="containerApps/salcapa-dev-b48224"; else RESOURCE="jobs/salcapa-dev-b48224-kb-scan"; fi
            python tools/knowledge_inventory_azure_transport.py get --url "https://management.azure.com/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.App/${RESOURCE}?api-version=2025-07-01" --output "/tmp/historical-${kind}-after.json" || RUNTIME_OK=0
          done
          if [ "$RUNTIME_OK" = 1 ]; then
            python - <<'PY' || RUNTIME_OK=0
          import json
          def selected(v):return {k:v.get(k) for k in ('id','name','type','location','identity')}|{'configuration':v['properties'].get('configuration'),'template':v['properties']['template']}
          for kind in ('app','worker'):
              assert selected(json.load(open('/tmp/historical-'+kind+'-before.json')))==selected(json.load(open('/tmp/historical-'+kind+'-after.json')))
          print('RECOVER_OUTSIDE_APPLICATION_AND_WORKER_UNCHANGED=1')
          PY
          fi
          ABSENCE_OK=1
          python tools/knowledge_inventory_azure_transport.py absent --url "https://management.azure.com/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.App/jobs?api-version=2025-07-01" --name salcapa-outdrift-b48224 || ABSENCE_OK=0
          rm -f /tmp/historical-app-before.json /tmp/historical-app-after.json /tmp/historical-worker-before.json /tmp/historical-worker-after.json
          echo "RECOVER_OUTSIDE_TEMPORARY_EVIDENCE_CLEARED=1"
          test "$RUNTIME_OK" = 1
          test "$ABSENCE_OK" = 1
