name: SalCAPA Mission Map

on:
  push:
    branches: [development/salcapa-platform, candidate/**]
    paths:
      - 'docs/build-continuity.md'
      - 'docs/salcapa-handwriting-expanded-ocr-design.md'
      - 'mission_map.py'
      - 'salcapa_runtime.py'
      - 'static/mission-map.js'
      - 'static/mission-map.css'
      - 'tools/ci_mission_map_smoke.py'
      - 'tools/run_current_release_smoke.py'
      - '.github/workflows/mission-map.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mission-map:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install application and security tools
        run: python -m pip install -r requirements.txt -r requirements-ci.txt
      - name: Reconstruct and verify governed source dependencies
        run: |
          python tools/reconstruct_v343_source.py
          python tools/verify_v343_source.py
          python tools/reconstruct_salops_preparedness.py
          python tools/reconstruct_personnel_assessment.py
          python tools/reconstruct_salintel_relationships.py
          python tools/reconstruct_salintel_research.py
          python tools/reconstruct_salintel_handoffs.py
          python tools/reconstruct_facility_assessment.py
          python tools/reconstruct_salintel_monitoring.py
          python tools/reconstruct_salcapa_assurance.py
          python tools/reconstruct_salcapa_contextual_guidance.py
          python tools/reconstruct_salcapa_human_first_communications.py
          python tools/reconstruct_salops_plan_assembly.py
          python tools/reconstruct_salcapa_commercial.py
      - name: Compile Mission Map sources
        run: python -m py_compile mission_map.py salcapa_runtime.py tools/ci_mission_map_smoke.py tools/run_current_release_smoke.py
      - name: Validate Mission Map JavaScript
        run: node --check static/mission-map.js
      - name: Mission Map acceptance
        run: python tools/run_current_release_smoke.py tools/ci_mission_map_smoke.py
      - name: Human-first and functional-distinction guardrails
        run: |
          grep -Fq 'People lead. Methods guide. Technology supports. Evidence proves.' mission_map.py
          grep -Fq 'SalTHIRA identifies risk, consequences, capability gaps, and priorities; authorized people decide.' mission_map.py
          grep -Fq 'SalCAPA coordinates Protected Members, information, decisions, requests, workflows, actions, and status.' mission_map.py
          grep -Fq 'PROVE — cross-cutting Assurance & Results' mission_map.py
          ! grep -Eiq 'Generate with AI|AI Recommendation|Automated Monitoring' static/mission-map.js
      - name: Static security scan
        run: bandit -q -r mission_map.py salcapa_runtime.py tools/ci_mission_map_smoke.py -ll
      - name: Dependency audit
        run: pip-audit -r requirements.txt

  postgres16:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: docker.io/library/postgres:16-alpine
        env:
          POSTGRES_DB: salcapa_mission_map_ci
          POSTGRES_USER: salus
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U salus -d salcapa_mission_map_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install application
        run: python -m pip install -r requirements.txt
      - name: Reconstruct governed source dependencies
        run: |
          python tools/reconstruct_v343_source.py
          python tools/reconstruct_salops_preparedness.py
          python tools/reconstruct_personnel_assessment.py
          python tools/reconstruct_salintel_relationships.py
          python tools/reconstruct_salintel_research.py
          python tools/reconstruct_salintel_handoffs.py
          python tools/reconstruct_facility_assessment.py
          python tools/reconstruct_salintel_monitoring.py
          python tools/reconstruct_salcapa_assurance.py
          python tools/reconstruct_salcapa_contextual_guidance.py
          python tools/reconstruct_salcapa_human_first_communications.py
          python tools/reconstruct_salops_plan_assembly.py
          python tools/reconstruct_salcapa_commercial.py
      - name: PostgreSQL 16 Mission Map acceptance
        env:
          SALUS_DB_BACKEND: postgres
          SALUS_DATABASE_URL: postgresql://salus@127.0.0.1:5432/salcapa_mission_map_ci
          SALUS_AUTH_MODE: prototype
          SALUS_SEED_DEMO: '1'
          SALUS_LOCAL_STORAGE_DIR: /tmp/mission-map-pg-attachments
          SALUS_BACKUP_DIR: /tmp/mission-map-pg-backups
        run: python tools/run_current_release_smoke.py tools/ci_mission_map_smoke.py

  production-container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build production container
        run: docker build --tag salcapa-mission-map:ci .
      - name: Run Mission Map acceptance in container
        run: docker run --rm salcapa-mission-map:ci python tools/run_current_release_smoke.py tools/ci_mission_map_smoke.py
