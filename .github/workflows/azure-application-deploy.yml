name: SalCAPA governed Azure application deployment

on:
  push:
    branches:
      - development/salcapa-platform
    paths:
      - 'deploy/azure/activations/application-dev.json'

permissions:
  contents: read

concurrency:
  group: salcapa-application-deploy-dev
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: salcapa-dev-approval
    permissions: {}
    steps:
      - name: Record protected application-deployment approval gate passage
        run: echo "Protected SalCAPA development application-deployment approval gate passed."

  deploy:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable application activation record
        id: activation
        env:
          ACTIVATION_FILE: deploy/azure/activations/application-dev.json
        run: |
          set -euo pipefail
          jq -e '
            type == "object" and
            (.schema_version == 1) and
            (.activation_key | test("^salcapa-v3\\.[0-9]+-application-[0-9a-f]{8}$")) and
            (.operation == "deploy_application") and
            (.target_environment == "dev") and
            (.unique_suffix == "b48224") and
            (.location == "southcentralus") and
            (.approval_record == "MD-APPROVAL-AZURE-LEAN-20260904") and
            (.source_release | test("^release/v3\\.[0-9]+$")) and
            (.source_commit | test("^[0-9a-f]{40}$")) and
            (.image_digest | test("^salcapadevb48224acr\\.azurecr\\.io/salcapa@sha256:[0-9a-f]{64}$")) and
            (.previous_application_image_digest | test("^salcapadevb48224acr\\.azurecr\\.io/salcapa@sha256:[0-9a-f]{64}$")) and
            (.previous_worker_image_digest | test("^salcapadevb48224acr\\.azurecr\\.io/salcapa@sha256:[0-9a-f]{64}$")) and
            (.rollback_release | test("^release/v3\\.[0-9]+$")) and
            (.rollback_commit | test("^[0-9a-f]{40}$")) and
            (.rollback_image_digest | test("^salcapadevb48224acr\\.azurecr\\.io/salcapa@sha256:[0-9a-f]{64}$")) and
            (.source_release != .rollback_release) and
            (.source_commit != .rollback_commit) and
            (.image_digest != .rollback_image_digest) and
            (.image_digest != .previous_application_image_digest) and
            (.image_digest != .previous_worker_image_digest) and
            ((keys - [
              "activation_key",
              "approval_record",
              "image_digest",
              "location",
              "operation",
              "previous_application_image_digest",
              "previous_worker_image_digest",
              "rollback_commit",
              "rollback_image_digest",
              "rollback_release",
              "schema_version",
              "source_commit",
              "source_release",
              "target_environment",
              "unique_suffix"
            ]) | length == 0)
          ' "$ACTIVATION_FILE" >/dev/null

          SOURCE_RELEASE="$(jq -r '.source_release' "$ACTIVATION_FILE")"
          SOURCE_COMMIT="$(jq -r '.source_commit' "$ACTIVATION_FILE")"
          ROLLBACK_RELEASE="$(jq -r '.rollback_release' "$ACTIVATION_FILE")"
          ROLLBACK_COMMIT="$(jq -r '.rollback_commit' "$ACTIVATION_FILE")"
          test "$(jq -r '.activation_key' "$ACTIVATION_FILE")" = "salcapa-${SOURCE_RELEASE#release/}-application-${SOURCE_COMMIT:0:8}"
          python - "$SOURCE_RELEASE" "$ROLLBACK_RELEASE" <<'PY'
          import sys
          source_minor = int(sys.argv[1].split('.')[-1])
          rollback_minor = int(sys.argv[2].split('.')[-1])
          if source_minor <= rollback_minor:
              raise SystemExit('Source release must follow accepted rollback release')
          PY

          {
            echo "source_commit=$SOURCE_COMMIT"
            echo "source_release=$SOURCE_RELEASE"
            echo "rollback_release=$ROLLBACK_RELEASE"
            echo "rollback_commit=$ROLLBACK_COMMIT"
            echo "image_digest=$(jq -r '.image_digest' "$ACTIVATION_FILE")"
            echo "previous_app_image=$(jq -r '.previous_application_image_digest' "$ACTIVATION_FILE")"
            echo "previous_worker_image=$(jq -r '.previous_worker_image_digest' "$ACTIVATION_FILE")"
            echo "rollback_image=$(jq -r '.rollback_image_digest' "$ACTIVATION_FILE")"
            echo "unique_suffix=$(jq -r '.unique_suffix' "$ACTIVATION_FILE")"
            echo "location=$(jq -r '.location' "$ACTIVATION_FILE")"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout frozen application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.activation.outputs.source_release }}
          path: frozen-release
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout accepted rollback source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.activation.outputs.rollback_release }}
          path: accepted-release
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact frozen and rollback source identities
        env:
          SOURCE_COMMIT: ${{ steps.activation.outputs.source_commit }}
          ROLLBACK_COMMIT: ${{ steps.activation.outputs.rollback_commit }}
        run: |
          set -euo pipefail
          test "$(git -C frozen-release rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git -C accepted-release rev-parse HEAD)" = "$ROLLBACK_COMMIT"
          git cat-file -e "$SOURCE_COMMIT^{commit}"
          git merge-base --is-ancestor "$SOURCE_COMMIT" "$GITHUB_SHA"
          git merge-base --is-ancestor "$ROLLBACK_COMMIT" "$GITHUB_SHA"
          python - "${{ steps.activation.outputs.source_release }}" "${{ steps.activation.outputs.rollback_release }}" <<'PY'
          import re
          import sys
          from pathlib import Path
          for directory, release in [('frozen-release', sys.argv[1]), ('accepted-release', sys.argv[2])]:
              expected = release.removeprefix('release/v')
              runtime = Path(directory, 'salcapa_runtime.py').read_text(encoding='utf-8')
              match = re.search(r'^SALCAPA_RELEASE_VERSION\s*=\s*["\'](?P<version>\d+\.\d+)["\']', runtime, re.MULTILINE)
              if match is None or match.group('version') != expected:
                  raise SystemExit(f'{directory} runtime release identity does not match activation')
          PY

      - name: Validate required non-secret repository variables
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          AZURE_BUDGET_CONTACT_EMAIL: ${{ vars.AZURE_BUDGET_CONTACT_EMAIL }}
          POSTGRES_ADMIN_OBJECT_ID: ${{ vars.POSTGRES_ADMIN_OBJECT_ID }}
          POSTGRES_ADMIN_PRINCIPAL_NAME: ${{ vars.POSTGRES_ADMIN_PRINCIPAL_NAME }}
          POSTGRES_ADMIN_PRINCIPAL_TYPE: ${{ vars.POSTGRES_ADMIN_PRINCIPAL_TYPE }}
          DEPLOYMENT_PRINCIPAL_OBJECT_ID: ${{ vars.DEPLOYMENT_PRINCIPAL_OBJECT_ID }}
          ENTRA_RUNTIME_CLIENT_ID: ${{ vars.ENTRA_RUNTIME_CLIENT_ID }}
          SALUS_M365_REPORT_DRIVE_ID: ${{ vars.SALUS_M365_REPORT_DRIVE_ID }}
          SALUS_M365_REPORT_FOLDER_ITEM_ID: ${{ vars.SALUS_M365_REPORT_FOLDER_ITEM_ID }}
        run: |
          set -euo pipefail
          required=(
            AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP
            AZURE_LOCATION AZURE_BUDGET_CONTACT_EMAIL POSTGRES_ADMIN_OBJECT_ID
            POSTGRES_ADMIN_PRINCIPAL_NAME POSTGRES_ADMIN_PRINCIPAL_TYPE
            DEPLOYMENT_PRINCIPAL_OBJECT_ID ENTRA_RUNTIME_CLIENT_ID
            SALUS_M365_REPORT_DRIVE_ID SALUS_M365_REPORT_FOLDER_ITEM_ID
          )
          for name in "${required[@]}"; do
            test -n "${!name}" || { echo "Missing repository variable: $name" >&2; exit 1; }
          done
          test "$AZURE_RESOURCE_GROUP" = "rg-salcapa-dev"
          test "$AZURE_LOCATION" = "${{ steps.activation.outputs.location }}"
          [[ "$POSTGRES_ADMIN_PRINCIPAL_TYPE" =~ ^(Group|User)$ ]]
          [[ "$ENTRA_RUNTIME_CLIENT_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]
          [[ "$AZURE_BUDGET_CONTACT_EMAIL" =~ ^[^[:space:]@]+@[^[:space:]@]+[.][^[:space:]@]+$ ]]

      - name: Azure login through workload identity federation
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify exact Azure target and immutable image
        env:
          EXPECTED_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          EXPECTED_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          IMAGE_DIGEST: ${{ steps.activation.outputs.image_digest }}
          ROLLBACK_IMAGE: ${{ steps.activation.outputs.rollback_image }}
          PREVIOUS_APP_IMAGE: ${{ steps.activation.outputs.previous_app_image }}
          PREVIOUS_WORKER_IMAGE: ${{ steps.activation.outputs.previous_worker_image }}
          SOURCE_COMMIT: ${{ steps.activation.outputs.source_commit }}
          ROLLBACK_COMMIT: ${{ steps.activation.outputs.rollback_commit }}
        run: |
          set -euo pipefail
          test "$(az account show --query id --output tsv)" = "$EXPECTED_SUBSCRIPTION_ID"
          test "$(az account show --query tenantId --output tsv)" = "$EXPECTED_TENANT_ID"
          test "$(az group show --name "$RESOURCE_GROUP" --query location --output tsv)" = "southcentralus"
          test "$(az postgres flexible-server show --resource-group "$RESOURCE_GROUP" --name salcapa-dev-b48224-pg --query authConfig.passwordAuth --output tsv)" = "Disabled"
          test "$(az postgres flexible-server show --resource-group "$RESOURCE_GROUP" --name salcapa-dev-b48224-pg --query network.publicNetworkAccess --output tsv)" = "Disabled"
          test "$(az acr show --resource-group "$RESOURCE_GROUP" --name salcapadevb48224acr --query adminUserEnabled --output tsv)" = "false"
          for image in "$IMAGE_DIGEST" "$ROLLBACK_IMAGE" "$PREVIOUS_APP_IMAGE" "$PREVIOUS_WORKER_IMAGE"; do
            digest="${image##*@}"
            test "$(az acr manifest show-metadata --registry salcapadevb48224acr --name "salcapa@$digest" --query digest --output tsv)" = "$digest"
          done
          test "$(az acr manifest show-metadata --registry salcapadevb48224acr --name "salcapa:source-$SOURCE_COMMIT" --query digest --output tsv)" = "${IMAGE_DIGEST##*@}"
          test "$(az acr manifest show-metadata --registry salcapadevb48224acr --name "salcapa:source-$ROLLBACK_COMMIT" --query digest --output tsv)" = "${ROLLBACK_IMAGE##*@}"
          CURRENT_APP_IMAGE="$(az containerapp show --resource-group "$RESOURCE_GROUP" --name salcapa-dev-b48224 --query 'properties.template.containers[0].image' --output tsv)"
          case "$CURRENT_APP_IMAGE" in
            "$PREVIOUS_APP_IMAGE"|"$ROLLBACK_IMAGE") ;;
            *) echo "Unexpected deployed application image; stopping before Azure preview." >&2; exit 1 ;;
          esac
          az containerapp job show --resource-group "$RESOURCE_GROUP" --name salcapa-dev-b48224-kb-scan --output json > /tmp/salcapa-rollback-job.json
          jq -e --arg image "$PREVIOUS_WORKER_IMAGE" '
            .properties.template.containers[0].image == $image and
            .properties.configuration.triggerType == "Schedule" and
            .properties.configuration.scheduleTriggerConfig.cronExpression == "*/2 * * * *"
          ' /tmp/salcapa-rollback-job.json >/dev/null
          JOB_ID="$(jq -r '.id' /tmp/salcapa-rollback-job.json)"
          test -n "$JOB_ID"
          az rest --method get --uri "${JOB_ID}?api-version=2025-07-01" --output json > /tmp/salcapa-job-rest-preflight.json
          jq -e --arg image "$PREVIOUS_WORKER_IMAGE" '
            .properties.template.containers[0].image == $image and
            .properties.configuration.triggerType == "Schedule" and
            .properties.configuration.scheduleTriggerConfig.cronExpression == "*/2 * * * *"
          ' /tmp/salcapa-job-rest-preflight.json >/dev/null

      - name: What-if and deploy immutable SalCAPA application
        id: deployment
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          IMAGE_DIGEST: ${{ steps.activation.outputs.image_digest }}
          PREVIOUS_WORKER_IMAGE: ${{ steps.activation.outputs.previous_worker_image }}
          SOURCE_COMMIT: ${{ steps.activation.outputs.source_commit }}
          UNIQUE_SUFFIX: ${{ steps.activation.outputs.unique_suffix }}
          LOCATION: ${{ steps.activation.outputs.location }}
          ENTRA_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          POSTGRES_ADMIN_OBJECT_ID: ${{ vars.POSTGRES_ADMIN_OBJECT_ID }}
          POSTGRES_ADMIN_PRINCIPAL_NAME: ${{ vars.POSTGRES_ADMIN_PRINCIPAL_NAME }}
          POSTGRES_ADMIN_PRINCIPAL_TYPE: ${{ vars.POSTGRES_ADMIN_PRINCIPAL_TYPE }}
          DEPLOYMENT_PRINCIPAL_OBJECT_ID: ${{ vars.DEPLOYMENT_PRINCIPAL_OBJECT_ID }}
          AZURE_BUDGET_CONTACT_EMAIL: ${{ vars.AZURE_BUDGET_CONTACT_EMAIL }}
          ENTRA_RUNTIME_CLIENT_ID: ${{ vars.ENTRA_RUNTIME_CLIENT_ID }}
          SALUS_M365_REPORT_DRIVE_ID: ${{ vars.SALUS_M365_REPORT_DRIVE_ID }}
          SALUS_M365_REPORT_FOLDER_ITEM_ID: ${{ vars.SALUS_M365_REPORT_FOLDER_ITEM_ID }}
        run: |
          set -euo pipefail
          # Preserve the existing budget period; Azure rejects a changed start date.
          SUBSCRIPTION_ID="$(az account show --query id --output tsv)"
          BUDGET_URI="https://management.azure.com/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.Consumption/budgets/salcapa-dev-b48224-monthly-budget?api-version=2023-11-01"
          BUDGET_START_DATE="$(az rest --method get --uri "$BUDGET_URI" --query 'properties.timePeriod.startDate' --output tsv)"
          [[ "$BUDGET_START_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]]
          BUDGET_USD="$(bash tools/azure_operational_budget.sh "$RESOURCE_GROUP" dev "$UNIQUE_SUFFIX" existing)"
          if [[ "$BUDGET_USD" == "75" ]]; then
            grep -Fq "@allowed([25, 75])" frozen-release/infra/azure/main.bicep || {
              echo "The frozen release cannot preserve the approved scanner budget alert." >&2
              exit 1
            }
          fi
          PARAMETERS=(
            uniqueSuffix="$UNIQUE_SUFFIX"
            location="$LOCATION"
            environmentName=dev
            containerImageDigest="$IMAGE_DIGEST"
            knowledgeWorkerImageDigest="$PREVIOUS_WORKER_IMAGE"
            provisionApplication=true
            entraTenantId="$ENTRA_TENANT_ID"
            entraRuntimeClientId="$ENTRA_RUNTIME_CLIENT_ID"
            m365ReportDriveId="$SALUS_M365_REPORT_DRIVE_ID"
            m365ReportFolderItemId="$SALUS_M365_REPORT_FOLDER_ITEM_ID"
            postgresAdminObjectId="$POSTGRES_ADMIN_OBJECT_ID"
            postgresAdminPrincipalName="$POSTGRES_ADMIN_PRINCIPAL_NAME"
            postgresAdminPrincipalType="$POSTGRES_ADMIN_PRINCIPAL_TYPE"
            deploymentPrincipalObjectId="$DEPLOYMENT_PRINCIPAL_OBJECT_ID"
            sourceCommit="$SOURCE_COMMIT"
            approvalRecord=MD-APPROVAL-AZURE-LEAN-20260904
            monthlyCostCeilingUsd=30
            operationalBudgetUsd="$BUDGET_USD"
            budgetStartDate="$BUDGET_START_DATE"
            budgetContactEmail="$AZURE_BUDGET_CONTACT_EMAIL"
          )
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --template-file frozen-release/infra/azure/main.bicep \
            --parameters "${PARAMETERS[@]}"
          DEPLOYMENT_NAME="salcapa-application-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          az deployment group create \
            --name "$DEPLOYMENT_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file frozen-release/infra/azure/main.bicep \
            --parameters "${PARAMETERS[@]}" \
            --output json > /tmp/salcapa-application-deployment.json

          # Bicep replaces the ingress object, so restore the governed custom
          # hostname binding after every deployment. With the existing CNAME,
          # Azure reuses or creates the managed certificate automatically.
          az containerapp hostname bind \
            --name salcapa-dev-b48224 \
            --resource-group "$RESOURCE_GROUP" \
            --hostname salcapa.salus.solutions \
            --environment salcapa-dev-b48224-aca-env \
            --validation-method CNAME \
            --only-show-errors \
            --output none

      - name: Verify live runtime, identity, ingress, and sign-in contract
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          EXPECTED_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          IMAGE_DIGEST: ${{ steps.activation.outputs.image_digest }}
        run: |
          set -euo pipefail
          APP_NAME=salcapa-dev-b48224
          az containerapp show --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --output json > /tmp/salcapa-app.json
          test "$(jq -r '.properties.template.containers[0].image' /tmp/salcapa-app.json)" = "$IMAGE_DIGEST"
          test "$(jq -r '.properties.configuration.ingress.external' /tmp/salcapa-app.json)" = "true"
          test "$(jq -r '.properties.configuration.ingress.allowInsecure' /tmp/salcapa-app.json)" = "false"
          test "$(jq -r '.properties.template.scale.minReplicas' /tmp/salcapa-app.json)" = "0"
          test "$(jq -r '.properties.template.scale.maxReplicas' /tmp/salcapa-app.json)" = "1"
          test "$(jq -r '(.properties.configuration.secrets // []) | length' /tmp/salcapa-app.json)" = "0"
          test "$(jq -r '.identity.type' /tmp/salcapa-app.json)" = "UserAssigned"
          test "$(jq -r '.identity.userAssignedIdentities | length' /tmp/salcapa-app.json)" = "1"
          RUNTIME_IDENTITY_CLIENT_ID="$(az identity show --resource-group "$RESOURCE_GROUP" --name salcapa-dev-b48224-identity --query clientId --output tsv)"
          jq -e --arg client_id "$RUNTIME_IDENTITY_CLIENT_ID" '
            def env_value($name):
              first(.properties.template.containers[0].env[] | select(.name == $name) | .value);
            env_value("AZURE_CLIENT_ID") == $client_id and
            env_value("SALUS_DB_BACKEND") == "postgres" and
            env_value("SALUS_POSTGRES_AUTH") == "entra" and
            env_value("SALUS_SECRET_BACKEND") == "azure_keyvault" and
            env_value("SALUS_STORAGE_BACKEND") == "azure" and
            env_value("SALUS_TELEMETRY_BACKEND") == "azure_monitor" and
            env_value("SALUS_AUTH_MODE") == "oidc" and
            env_value("SALUS_OIDC_CLIENT_AUTH_METHOD") == "managed_identity" and
            env_value("SALUS_OIDC_REDIRECT_URI") == "https://salcapa.salus.solutions/api/auth/oidc/callback"
          ' /tmp/salcapa-app.json >/dev/null
          FQDN="$(jq -r '.properties.configuration.ingress.fqdn' /tmp/salcapa-app.json)"
          [[ "$FQDN" == salcapa-dev-b48224.*.southcentralus.azurecontainerapps.io ]]
          URL="https://$FQDN"

          READY=false
          STATUS=000
          for attempt in $(seq 1 30); do
            STATUS="$(curl --connect-timeout 5 --max-time 15 --silent --show-error --output /tmp/salcapa-ready.json --write-out '%{http_code}' "$URL/health/ready" || true)"
            if [ "$STATUS" = "200" ] && python frozen-release/tools/validate_live_readiness.py /tmp/salcapa-ready.json --environment dev >/dev/null 2>&1; then
              READY=true
              break
            fi
            sleep 10
          done
          if [ "$READY" != "true" ]; then
            echo "SalCAPA runtime did not become ready; final HTTP status: $STATUS" >&2
            echo "Revision state summary (governed non-secret fields only):" >&2
            az containerapp revision list \
              --resource-group "$RESOURCE_GROUP" \
              --name "$APP_NAME" \
              --query '[].{name:name,active:properties.active,provisioningState:properties.provisioningState,healthState:properties.healthState,trafficWeight:properties.trafficWeight,replicas:properties.replicas}' \
              --output json \
              --only-show-errors >&2 \
              || true
            echo "Bounded runtime system logs (sensitive values redacted):" >&2
            timeout 45s az containerapp logs show \
              --resource-group "$RESOURCE_GROUP" \
              --name "$APP_NAME" \
              --type system \
              --tail 200 \
              --format json \
              --only-show-errors 2>&1 \
              | sed -E 's/((password|secret|token|connection[_ -]?string)[^:=]*[:=][[:space:]]*)[^[:space:]]+/\1[REDACTED]/Ig' >&2 \
              || true
            echo "Bounded revision-targeted container logs (sensitive values redacted):" >&2
            while IFS= read -r REVISION; do
              test -n "$REVISION" || continue
              REPLICA="$(
                az containerapp replica list \
                  --resource-group "$RESOURCE_GROUP" \
                  --name "$APP_NAME" \
                  --revision "$REVISION" \
                  --query '[0].name' \
                  --output tsv \
                  --only-show-errors 2>/dev/null \
                  || true
              )"
              test -n "$REPLICA" || continue
              echo "Revision $REVISION replica diagnostics:" >&2
              timeout 45s az containerapp logs show \
                --resource-group "$RESOURCE_GROUP" \
                --name "$APP_NAME" \
                --revision "$REVISION" \
                --replica "$REPLICA" \
                --container salcapa \
                --type console \
                --tail 200 \
                --format text \
                --only-show-errors 2>&1 \
                | sed -E 's/((password|secret|token|connection[_ -]?string)[^:=]*[:=][[:space:]]*)[^[:space:]]+/\1[REDACTED]/Ig' >&2 \
                || true
            done < <(
              az containerapp revision list \
                --resource-group "$RESOURCE_GROUP" \
                --name "$APP_NAME" \
                --query '[?properties.replicas > `0`].name' \
                --output tsv \
                --only-show-errors
            )
            exit 1
          fi

          python frozen-release/tools/validate_live_readiness.py /tmp/salcapa-ready.json --environment dev

          curl --connect-timeout 5 --max-time 15 --silent --show-error --dump-header /tmp/salcapa-oidc.headers --output /dev/null "$URL/api/auth/oidc/start"
          OIDC_LOCATION="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]+:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' /tmp/salcapa-oidc.headers)"
          [[ "$OIDC_LOCATION" == "https://login.microsoftonline.com/$EXPECTED_TENANT_ID/oauth2/v2.0/authorize"* ]]
          python - "$OIDC_LOCATION" <<'PY'
          import sys
          from urllib.parse import parse_qs, urlparse
          params = parse_qs(urlparse(sys.argv[1]).query)
          assert params.get("redirect_uri") == ["https://salcapa.salus.solutions/api/auth/oidc/callback"]
          PY

          {
            echo "### SalCAPA development application"
            echo ""
            echo "- URL: $URL"
            echo "- Immutable image: $IMAGE_DIGEST"
            echo "- Runtime authentication: Microsoft Entra OIDC through managed identity"
            echo "- PostgreSQL authentication: Entra only; password authentication disabled"
            echo "- Live dependencies: PostgreSQL, Key Vault, evidence storage, Azure Monitor, rate limiting, and OIDC accepted"
            echo "- HTTPS ingress: required"
            echo "- Minimum replicas: 0"
            echo "- Maximum replicas: 1"
            echo "- Client secret: not used"
            echo "- Custom DNS: not changed"
            echo "- Public production cutover: not performed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify previous worker remains active during application acceptance
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          PREVIOUS_WORKER_IMAGE: ${{ steps.activation.outputs.previous_worker_image }}
        run: |
          set -euo pipefail
          JOB_NAME=salcapa-dev-b48224-kb-scan
          az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" --output json > /tmp/salcapa-knowledge-job.json
          test "$(jq -r '.properties.template.containers[0].image' /tmp/salcapa-knowledge-job.json)" = "$PREVIOUS_WORKER_IMAGE"
          test "$(jq -r '.properties.configuration.triggerType' /tmp/salcapa-knowledge-job.json)" = "Schedule"
          test "$(jq -r '.properties.configuration.scheduleTriggerConfig.cronExpression' /tmp/salcapa-knowledge-job.json)" = "*/2 * * * *"

      - name: Create and run isolated Microsoft 365 intake acceptance job
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          EXPECTED_IMAGE: ${{ steps.activation.outputs.image_digest }}
        run: |
          set -euo pipefail
          env_value() {
            jq -r --arg name "$1" 'first(.properties.template.containers[0].env[] | select(.name == $name) | .value)' /tmp/salcapa-app.json
          }
          IDENTITY_ID="$(az identity show --resource-group "$RESOURCE_GROUP" --name salcapa-dev-b48224-identity --query id --output tsv --only-show-errors)"
          ENVIRONMENT_ID="$(az containerapp env show --resource-group "$RESOURCE_GROUP" --name salcapa-dev-b48224-aca-env --query id --output tsv --only-show-errors)"
          REGISTRY_SERVER="$(az acr show --resource-group "$RESOURCE_GROUP" --name salcapadevb48224acr --query loginServer --output tsv --only-show-errors)"
          SCRIPT_B64="$(base64 -w0 frozen-release/tools/live_m365_intake_acceptance.py)"
          az deployment group create \
            --name "salcapa-m365-acceptance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file frozen-release/infra/azure/m365-intake-acceptance-job.bicep \
            --parameters \
              environmentId="$ENVIRONMENT_ID" \
              identityId="$IDENTITY_ID" \
              registryServer="$REGISTRY_SERVER" \
              imageDigest="$EXPECTED_IMAGE" \
              tenantId="$(env_value SALUS_OIDC_TENANT_ID)" \
              applicationClientId="$(env_value SALUS_OIDC_CLIENT_ID)" \
              managedIdentityClientId="$(env_value SALUS_OIDC_MANAGED_IDENTITY_CLIENT_ID)" \
              driveId="$(env_value SALUS_M365_INTAKE_DRIVE_ID)" \
              folderItemId="$(env_value SALUS_M365_INTAKE_FOLDER_ITEM_ID)" \
              acceptanceScriptBase64="$SCRIPT_B64" \
            --output none --only-show-errors
          JOB_NAME=salcapa-m365-acceptance-b48224
          EXECUTION_NAME="$(az containerapp job start \
            --resource-group "$RESOURCE_GROUP" \
            --name "$JOB_NAME" \
            --query name --output tsv --only-show-errors)"
          test -n "$EXECUTION_NAME"
          SUCCEEDED=false
          for attempt in $(seq 1 60); do
            STATUS="$(az containerapp job execution show \
              --resource-group "$RESOURCE_GROUP" \
              --name "$JOB_NAME" \
              --job-execution-name "$EXECUTION_NAME" \
              --query properties.status --output tsv --only-show-errors)"
            if [ "$STATUS" = "Succeeded" ]; then
              SUCCEEDED=true
              break
            fi
            if [ "$STATUS" = "Failed" ]; then
              echo "Microsoft 365 acceptance execution failed; bounded container logs follow." >&2
              az containerapp job logs show \
                --resource-group "$RESOURCE_GROUP" \
                --name "$JOB_NAME" \
                --execution "$EXECUTION_NAME" \
                --container salcapa-m365-acceptance \
                --tail 200 --format text --only-show-errors 2>&1 \
                | sed -E 's/((password|secret|token|connection[_ -]?string)[^:=]*[:=][[:space:]]*)[^[:space:]]+/\1[REDACTED]/Ig' >&2 \
                || true
              break
            fi
            sleep 10
          done
          test "$SUCCEEDED" = "true"
          {
            echo "SALUS_M365_ACCEPTANCE_JOB=$JOB_NAME"
            echo "SALUS_M365_ACCEPTANCE_EXECUTION=$EXECUTION_NAME"
          } >> "$GITHUB_ENV"

      - name: Remove temporary Microsoft 365 Azure test job
        if: always()
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          JOB_NAME=salcapa-m365-acceptance-b48224
          if ! az account show --only-show-errors >/dev/null 2>&1; then
            echo "Azure login was not reached; no temporary acceptance job was created."
            exit 0
          fi
          if az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" --only-show-errors >/dev/null 2>&1; then
            az containerapp job delete \
              --resource-group "$RESOURCE_GROUP" \
              --name "$JOB_NAME" \
              --yes --only-show-errors
          fi
          test "$(az containerapp job list --resource-group "$RESOURCE_GROUP" \
            --query "[?name == '$JOB_NAME'] | length(@)" \
            --output tsv --only-show-errors)" = "0"

      - name: Exercise exact-release Protection Advisor with fictional data
        env:
          EXPECTED_RELEASE: ${{ steps.activation.outputs.source_release }}
          PROTECTION_ADVISOR_BASE_URL: https://salcapa-dev-b48224.ashycoast-29444a28.southcentralus.azurecontainerapps.io
        run: |
          set -euo pipefail
          EXPECTED_VERSION="${EXPECTED_RELEASE#release/v}"
          curl --connect-timeout 10 --max-time 30 --fail --silent --show-error \
            "$PROTECTION_ADVISOR_BASE_URL/api/system/mode" > /tmp/salcapa-advisor-mode.json
          test "$(jq -r '.version' /tmp/salcapa-advisor-mode.json)" = "$EXPECTED_VERSION"
          bash frozen-release/tools/live_public_protection_advisor_acceptance.sh

      - name: Promote and verify scheduled worker after application acceptance
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          IMAGE_DIGEST: ${{ steps.activation.outputs.image_digest }}
          PREVIOUS_WORKER_IMAGE: ${{ steps.activation.outputs.previous_worker_image }}
        run: |
          set -euo pipefail
          JOB_NAME=salcapa-dev-b48224-kb-scan
          az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" --output json > /tmp/salcapa-knowledge-job.json
          jq -e --arg image "$PREVIOUS_WORKER_IMAGE" '
            .properties.template.containers[0].image == $image and
            .properties.configuration.triggerType == "Schedule" and
            .properties.configuration.scheduleTriggerConfig.cronExpression == "*/2 * * * *"
          ' /tmp/salcapa-knowledge-job.json >/dev/null
          # Stop new scheduled starts before a candidate run. The non-bulk
          # knowledge processor has no batch-wide lease, so drain accepted
          # executions before any candidate can access the same intake.
          JOB_ID="$(az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" --query id --output tsv)"
          test -n "$JOB_ID"
          az rest --method patch --uri "${JOB_ID}?api-version=2025-07-01" \
            --body '{"properties":{"configuration":{"triggerType":"Manual"}}}' \
            --output none --only-show-errors
          az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" --output json > /tmp/salcapa-knowledge-job.json
          jq -e --arg image "$PREVIOUS_WORKER_IMAGE" '
            .properties.template.containers[0].image == $image and
            .properties.configuration.triggerType == "Manual"
          ' /tmp/salcapa-knowledge-job.json >/dev/null
          DRAINED=false
          for attempt in $(seq 1 100); do
            az containerapp job execution list --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" --output json --only-show-errors > /tmp/salcapa-knowledge-executions.json
            if jq -e 'all(.[]; .properties.status == "Succeeded" or .properties.status == "Failed" or .properties.status == "Stopped")' /tmp/salcapa-knowledge-executions.json >/dev/null; then
              DRAINED=true
              break
            fi
            sleep 10
          done
          test "$DRAINED" = true
          # Azure replaces the entire execution template when an image override
          # is supplied. Preserve the worker command, environment, resources,
          # and secret references when testing the candidate image.
          jq -e --arg image "$PREVIOUS_WORKER_IMAGE" '
            (.properties.template.containers | length) == 1 and
            .properties.template.containers[0].name == "salcapa-knowledge-scan" and
            .properties.template.containers[0].image == $image and
            .properties.template.containers[0].command == ["python", "-m", "tools.salcapa_knowledge_scan_once"]
          ' /tmp/salcapa-knowledge-job.json >/dev/null
          az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" \
            --query properties.template --output yaml > "$RUNNER_TEMP/salcapa-candidate-worker-template.yaml"
          python - "$RUNNER_TEMP/salcapa-candidate-worker-template.yaml" "$PREVIOUS_WORKER_IMAGE" "$IMAGE_DIGEST" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          original = path.read_text(encoding="utf-8")
          if original.count(sys.argv[2]) != 1:
              raise SystemExit("Expected one previous worker image in execution template")
          path.write_text(original.replace(sys.argv[2], sys.argv[3]), encoding="utf-8")
          PY
          # The candidate execution runs only after all accepted runs end.
          EXECUTION_NAME="$(az containerapp job start --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" --yaml "$RUNNER_TEMP/salcapa-candidate-worker-template.yaml" --query name --output tsv --only-show-errors)"
          test -n "$EXECUTION_NAME"
          SUCCEEDED=false
          for attempt in $(seq 1 100); do
            az containerapp job execution show --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" --job-execution-name "$EXECUTION_NAME" --output json --only-show-errors > /tmp/salcapa-candidate-execution.json
            jq -e --arg image "$IMAGE_DIGEST" '
              .properties.template.containers[0].image == $image and
              .properties.template.containers[0].command == ["python", "-m", "tools.salcapa_knowledge_scan_once"]
            ' /tmp/salcapa-candidate-execution.json >/dev/null
            STATUS="$(jq -r '.properties.status' /tmp/salcapa-candidate-execution.json)"
            if [ "$STATUS" = "Succeeded" ]; then SUCCEEDED=true; break; fi
            if [ "$STATUS" = "Failed" ]; then break; fi
            sleep 10
          done
          if [ "$SUCCEEDED" != "true" ]; then
            echo "Promoted knowledge worker did not complete successfully: $STATUS" >&2
            sleep 5
            az containerapp job logs show --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" --execution "$EXECUTION_NAME" --container salcapa-knowledge-scan --tail 100 --format text --only-show-errors 2>&1 \
              | grep -E 'SALCAPA_WORKER_PHASE|ModuleNotFoundError|ImportError|KeyError|ValueError|RuntimeError|M365IntakeError|KnowledgePromotionError|TypeError|AttributeError|DatabaseError|OperationalError|AzureError|Traceback|failed to start|Error' \
              | sed -E 's/((password|secret|token|connection[_ -]?string)[^:=]*[:=][[:space:]]*)[^[:space:]]+/\\1[REDACTED]/Ig' \
              | tail -n 25 >&2 || true
            exit 1
          fi
          az containerapp job logs show --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" --execution "$EXECUTION_NAME" --container salcapa-knowledge-scan --tail 50 --format text --only-show-errors 2>&1 | grep 'SALCAPA_KNOWLEDGE_BATCH=' || true
          az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" --output json > /tmp/salcapa-knowledge-job.json
          jq -e --arg image "$PREVIOUS_WORKER_IMAGE" '
            .properties.template.containers[0].image == $image and
            .properties.configuration.triggerType == "Manual"
          ' /tmp/salcapa-knowledge-job.json >/dev/null
          az containerapp job execution list --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" --output json --only-show-errors > /tmp/salcapa-knowledge-executions.json
          jq -e 'all(.[]; .properties.status == "Succeeded" or .properties.status == "Failed" or .properties.status == "Stopped")' /tmp/salcapa-knowledge-executions.json >/dev/null
          az containerapp job update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$JOB_NAME" \
            --image "$IMAGE_DIGEST" \
            --output none --only-show-errors
          az rest --method patch --uri "${JOB_ID}?api-version=2025-07-01" \
            --body '{"properties":{"configuration":{"triggerType":"Schedule","scheduleTriggerConfig":{"cronExpression":"*/2 * * * *","replicaCompletionCount":1,"parallelism":1}}}}' \
            --output none --only-show-errors
          az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" --output json > /tmp/salcapa-knowledge-job.json
          jq -e --arg image "$IMAGE_DIGEST" '
            .properties.template.containers[0].image == $image and
            .properties.configuration.triggerType == "Schedule" and
            .properties.configuration.scheduleTriggerConfig.cronExpression == "*/2 * * * *"
          ' /tmp/salcapa-knowledge-job.json >/dev/null
          echo "SALCAPA_KNOWLEDGE_WORKER_EXECUTION=$EXECUTION_NAME" >> "$GITHUB_ENV"

      - name: Restore accepted rollback release if promotion verification fails
        if: failure() && (steps.deployment.outcome == 'success' || steps.deployment.outcome == 'failure')
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          ROLLBACK_IMAGE: ${{ steps.activation.outputs.rollback_image }}
          ROLLBACK_RELEASE: ${{ steps.activation.outputs.rollback_release }}
        run: |
          set -euo pipefail
          APP_NAME=salcapa-dev-b48224
          JOB_NAME=salcapa-dev-b48224-kb-scan
          # Restore both independently. A failure in either resource must not
          # prevent an attempt to restore the other.
          WORKER_RESTORED=false
          JOB_ID="$(az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" --query id --output tsv 2>/dev/null || true)"
          if test -n "$JOB_ID" \
            && az containerapp job update \
              --resource-group "$RESOURCE_GROUP" \
              --name "$JOB_NAME" \
              --image "$ROLLBACK_IMAGE" \
              --output none --only-show-errors \
            && az rest --method patch --uri "${JOB_ID}?api-version=2025-07-01" \
              --body '{"properties":{"configuration":{"triggerType":"Schedule","scheduleTriggerConfig":{"cronExpression":"*/2 * * * *","replicaCompletionCount":1,"parallelism":1}}}}' \
              --output none --only-show-errors \
            && az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$JOB_NAME" --output json > /tmp/salcapa-rollback-job.json \
            && jq -e --arg image "$ROLLBACK_IMAGE" '
              .properties.template.containers[0].image == $image and
              .properties.configuration.triggerType == "Schedule" and
              .properties.configuration.scheduleTriggerConfig.cronExpression == "*/2 * * * *"
            ' /tmp/salcapa-rollback-job.json >/dev/null; then
            WORKER_RESTORED=true
          else
            echo "Failed to restore and verify accepted scheduled worker." >&2
          fi

          if ! az containerapp update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_NAME" \
            --image "$ROLLBACK_IMAGE" \
            --set-env-vars SALUS_ALLOW_RESTORE=0 SALUS_SEED_DEMO=0 SALUS_ALLOW_SQLITE_PRODUCTION=0 \
            --output none; then
            echo "Container App rollback update failed; checking observed runtime anyway." >&2
          fi
          HOST_RESTORED=false
          if az containerapp hostname bind --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --hostname salcapa.salus.solutions --environment salcapa-dev-b48224-aca-env --validation-method CNAME --only-show-errors --output none; then
            HOST_RESTORED=true
          else
            echo "Accepted hostname binding could not be confirmed." >&2
          fi
          APP_RESTORED=false
          for attempt in $(seq 1 30); do
            if ! az containerapp show --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --output json > /tmp/salcapa-rollback.json; then sleep 10; continue; fi
            if [ "$(jq -r '.properties.template.containers[0].image' /tmp/salcapa-rollback.json)" != "$ROLLBACK_IMAGE" ]; then sleep 10; continue; fi
            FQDN="$(jq -r '.properties.configuration.ingress.fqdn' /tmp/salcapa-rollback.json)"
            STATUS="$(curl --connect-timeout 5 --max-time 15 --silent --show-error --output /tmp/salcapa-rollback-ready.json --write-out '%{http_code}' "https://$FQDN/health/ready" || true)"
            if [ "$STATUS" = "200" ] && python accepted-release/tools/validate_live_readiness.py /tmp/salcapa-rollback-ready.json --environment dev >/dev/null 2>&1; then
              APP_RESTORED=true
              break
            fi
            sleep 10
          done
          if [ "$WORKER_RESTORED" = true ] && [ "$APP_RESTORED" = true ] && [ "$HOST_RESTORED" = true ]; then
            {
              echo "### SalCAPA failed promotion rollback"
              echo ""
              echo "- Accepted immutable $ROLLBACK_RELEASE application and worker images restored"
              echo "- Live readiness and worker schedule verified"
              echo "- Accepted hostname binding restored"
              echo "- Client secret not used"
              echo "PROMOTION_FAILED_ACCEPTED_STATE_RESTORED"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Failed promotion left partial rollback: worker=$WORKER_RESTORED application=$APP_RESTORED hostname=$HOST_RESTORED" >&2
          exit 1
