name: SalCAPA governed Azure application deployment

on:
  push:
    branches:
      - development/salcapa-platform
    paths:
      - 'deploy/azure/activations/application-dev.json'

permissions:
  contents: read

concurrency:
  group: salcapa-application-deploy-dev
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: salcapa-dev-approval
    permissions: {}
    steps:
      - name: Record protected application-deployment approval gate passage
        run: echo "Protected SalCAPA development application-deployment approval gate passed."

  deploy:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout frozen application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/v3.126
          path: frozen-release
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout accepted rollback source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/v3.124
          path: accepted-release
          fetch-depth: 1
          persist-credentials: false

      - name: Validate immutable application activation record and frozen source
        id: activation
        env:
          ACTIVATION_FILE: deploy/azure/activations/application-dev.json
        run: |
          set -euo pipefail
          jq -e '
            type == "object" and
            (.schema_version == 1) and
            (.activation_key == "salcapa-v3.126-application-5857321c-hostname-recovery-1") and
            (.operation == "deploy_application") and
            (.target_environment == "dev") and
            (.unique_suffix == "b48224") and
            (.location == "southcentralus") and
            (.approval_record == "MD-APPROVAL-AZURE-LEAN-20260904") and
            (.source_release == "release/v3.126") and
            (.source_commit == "5857321cc0416974b92204d0d9a3f27f55a2288e") and
            (.image_digest == "salcapadevb48224acr.azurecr.io/salcapa@sha256:faaba3f39ff7567f3fc4368b8f451e6f35581860230620aced02f76cb1ea9940") and
            (.rollback_release == "release/v3.124") and
            (.rollback_commit == "602b672828f2f6a1d24fc5b1e32cc36766d79ca8") and
            (.rollback_image_digest == "salcapadevb48224acr.azurecr.io/salcapa@sha256:aaba6235b95f129ea8500bcb3f7a5e35bf576515794f5f2d7328bb82021d6519") and
            ((keys - [
              "activation_key",
              "approval_record",
              "image_digest",
              "location",
              "operation",
              "rollback_commit",
              "rollback_image_digest",
              "rollback_release",
              "schema_version",
              "source_commit",
              "source_release",
              "target_environment",
              "unique_suffix"
            ]) | length == 0)
          ' "$ACTIVATION_FILE" >/dev/null

          SOURCE_COMMIT="$(jq -r '.source_commit' "$ACTIVATION_FILE")"
          test "$(git -C frozen-release rev-parse HEAD)" = "$SOURCE_COMMIT"
          git cat-file -e "$SOURCE_COMMIT^{commit}"
          git merge-base --is-ancestor "$SOURCE_COMMIT" "$GITHUB_SHA"
          test "$(git -C accepted-release rev-parse HEAD)" = "$(jq -r '.rollback_commit' "$ACTIVATION_FILE")"
          git merge-base --is-ancestor "$(jq -r '.rollback_commit' "$ACTIVATION_FILE")" "$GITHUB_SHA"

          {
            echo "source_commit=$SOURCE_COMMIT"
            echo "image_digest=$(jq -r '.image_digest' "$ACTIVATION_FILE")"
            echo "rollback_image=$(jq -r '.rollback_image_digest' "$ACTIVATION_FILE")"
            echo "unique_suffix=$(jq -r '.unique_suffix' "$ACTIVATION_FILE")"
            echo "location=$(jq -r '.location' "$ACTIVATION_FILE")"
          } >> "$GITHUB_OUTPUT"

      - name: Validate required non-secret repository variables
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          AZURE_BUDGET_CONTACT_EMAIL: ${{ vars.AZURE_BUDGET_CONTACT_EMAIL }}
          POSTGRES_ADMIN_OBJECT_ID: ${{ vars.POSTGRES_ADMIN_OBJECT_ID }}
          POSTGRES_ADMIN_PRINCIPAL_NAME: ${{ vars.POSTGRES_ADMIN_PRINCIPAL_NAME }}
          POSTGRES_ADMIN_PRINCIPAL_TYPE: ${{ vars.POSTGRES_ADMIN_PRINCIPAL_TYPE }}
          DEPLOYMENT_PRINCIPAL_OBJECT_ID: ${{ vars.DEPLOYMENT_PRINCIPAL_OBJECT_ID }}
          ENTRA_RUNTIME_CLIENT_ID: ${{ vars.ENTRA_RUNTIME_CLIENT_ID }}
        run: |
          set -euo pipefail
          required=(
            AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP
            AZURE_LOCATION AZURE_BUDGET_CONTACT_EMAIL POSTGRES_ADMIN_OBJECT_ID
            POSTGRES_ADMIN_PRINCIPAL_NAME POSTGRES_ADMIN_PRINCIPAL_TYPE
            DEPLOYMENT_PRINCIPAL_OBJECT_ID ENTRA_RUNTIME_CLIENT_ID
          )
          for name in "${required[@]}"; do
            test -n "${!name}" || { echo "Missing repository variable: $name" >&2; exit 1; }
          done
          test "$AZURE_RESOURCE_GROUP" = "rg-salcapa-dev"
          test "$AZURE_LOCATION" = "${{ steps.activation.outputs.location }}"
          [[ "$POSTGRES_ADMIN_PRINCIPAL_TYPE" =~ ^(Group|User)$ ]]
          [[ "$ENTRA_RUNTIME_CLIENT_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]
          [[ "$AZURE_BUDGET_CONTACT_EMAIL" =~ ^[^[:space:]@]+@[^[:space:]@]+[.][^[:space:]@]+$ ]]

      - name: Azure login through workload identity federation
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify exact Azure target and immutable image
        env:
          EXPECTED_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          EXPECTED_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          IMAGE_DIGEST: ${{ steps.activation.outputs.image_digest }}
          ROLLBACK_IMAGE: ${{ steps.activation.outputs.rollback_image }}
        run: |
          set -euo pipefail
          test "$(az account show --query id --output tsv)" = "$EXPECTED_SUBSCRIPTION_ID"
          test "$(az account show --query tenantId --output tsv)" = "$EXPECTED_TENANT_ID"
          test "$(az group show --name "$RESOURCE_GROUP" --query location --output tsv)" = "southcentralus"
          test "$(az postgres flexible-server show --resource-group "$RESOURCE_GROUP" --name salcapa-dev-b48224-pg --query authConfig.passwordAuth --output tsv)" = "Disabled"
          test "$(az postgres flexible-server show --resource-group "$RESOURCE_GROUP" --name salcapa-dev-b48224-pg --query network.publicNetworkAccess --output tsv)" = "Disabled"
          test "$(az acr show --resource-group "$RESOURCE_GROUP" --name salcapadevb48224acr --query adminUserEnabled --output tsv)" = "false"
          for image in "$IMAGE_DIGEST" "$ROLLBACK_IMAGE"; do
            digest="${image##*@}"
            test "$(az acr manifest show-metadata --registry salcapadevb48224acr --name "salcapa@$digest" --query digest --output tsv)" = "$digest"
          done

      - name: What-if and deploy immutable SalCAPA application
        id: deployment
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          IMAGE_DIGEST: ${{ steps.activation.outputs.image_digest }}
          SOURCE_COMMIT: ${{ steps.activation.outputs.source_commit }}
          UNIQUE_SUFFIX: ${{ steps.activation.outputs.unique_suffix }}
          LOCATION: ${{ steps.activation.outputs.location }}
          ENTRA_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          POSTGRES_ADMIN_OBJECT_ID: ${{ vars.POSTGRES_ADMIN_OBJECT_ID }}
          POSTGRES_ADMIN_PRINCIPAL_NAME: ${{ vars.POSTGRES_ADMIN_PRINCIPAL_NAME }}
          POSTGRES_ADMIN_PRINCIPAL_TYPE: ${{ vars.POSTGRES_ADMIN_PRINCIPAL_TYPE }}
          DEPLOYMENT_PRINCIPAL_OBJECT_ID: ${{ vars.DEPLOYMENT_PRINCIPAL_OBJECT_ID }}
          AZURE_BUDGET_CONTACT_EMAIL: ${{ vars.AZURE_BUDGET_CONTACT_EMAIL }}
          ENTRA_RUNTIME_CLIENT_ID: ${{ vars.ENTRA_RUNTIME_CLIENT_ID }}
        run: |
          set -euo pipefail
          PARAMETERS=(
            uniqueSuffix="$UNIQUE_SUFFIX"
            location="$LOCATION"
            environmentName=dev
            containerImageDigest="$IMAGE_DIGEST"
            provisionApplication=true
            entraTenantId="$ENTRA_TENANT_ID"
            entraRuntimeClientId="$ENTRA_RUNTIME_CLIENT_ID"
            postgresAdminObjectId="$POSTGRES_ADMIN_OBJECT_ID"
            postgresAdminPrincipalName="$POSTGRES_ADMIN_PRINCIPAL_NAME"
            postgresAdminPrincipalType="$POSTGRES_ADMIN_PRINCIPAL_TYPE"
            deploymentPrincipalObjectId="$DEPLOYMENT_PRINCIPAL_OBJECT_ID"
            sourceCommit="$SOURCE_COMMIT"
            approvalRecord=MD-APPROVAL-AZURE-LEAN-20260904
            monthlyCostCeilingUsd=30
            operationalBudgetUsd=25
            budgetContactEmail="$AZURE_BUDGET_CONTACT_EMAIL"
          )
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --template-file frozen-release/infra/azure/main.bicep \
            --parameters "${PARAMETERS[@]}"
          DEPLOYMENT_NAME="salcapa-application-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          az deployment group create \
            --name "$DEPLOYMENT_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file frozen-release/infra/azure/main.bicep \
            --parameters "${PARAMETERS[@]}" \
            --output json > /tmp/salcapa-application-deployment.json

          # Bicep replaces the ingress object, so restore the governed custom
          # hostname binding after every deployment. With the existing CNAME,
          # Azure reuses or creates the managed certificate automatically.
          az containerapp hostname bind \
            --name salcapa-dev-b48224 \
            --resource-group "$RESOURCE_GROUP" \
            --hostname salcapa.salus.solutions \
            --environment salcapa-dev-b48224-aca-env \
            --validation-method CNAME \
            --only-show-errors \
            --output none

      - name: Verify live runtime, identity, ingress, and sign-in contract
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          EXPECTED_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          IMAGE_DIGEST: ${{ steps.activation.outputs.image_digest }}
        run: |
          set -euo pipefail
          APP_NAME=salcapa-dev-b48224
          az containerapp show --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --output json > /tmp/salcapa-app.json
          test "$(jq -r '.properties.template.containers[0].image' /tmp/salcapa-app.json)" = "$IMAGE_DIGEST"
          test "$(jq -r '.properties.configuration.ingress.external' /tmp/salcapa-app.json)" = "true"
          test "$(jq -r '.properties.configuration.ingress.allowInsecure' /tmp/salcapa-app.json)" = "false"
          test "$(jq -r '.properties.template.scale.minReplicas' /tmp/salcapa-app.json)" = "0"
          test "$(jq -r '.properties.template.scale.maxReplicas' /tmp/salcapa-app.json)" = "1"
          test "$(jq -r '(.properties.configuration.secrets // []) | length' /tmp/salcapa-app.json)" = "0"
          test "$(jq -r '.identity.type' /tmp/salcapa-app.json)" = "UserAssigned"
          test "$(jq -r '.identity.userAssignedIdentities | length' /tmp/salcapa-app.json)" = "1"
          RUNTIME_IDENTITY_CLIENT_ID="$(az identity show --resource-group "$RESOURCE_GROUP" --name salcapa-dev-b48224-identity --query clientId --output tsv)"
          jq -e --arg client_id "$RUNTIME_IDENTITY_CLIENT_ID" '
            def env_value($name):
              first(.properties.template.containers[0].env[] | select(.name == $name) | .value);
            env_value("AZURE_CLIENT_ID") == $client_id and
            env_value("SALUS_DB_BACKEND") == "postgres" and
            env_value("SALUS_POSTGRES_AUTH") == "entra" and
            env_value("SALUS_SECRET_BACKEND") == "azure_keyvault" and
            env_value("SALUS_STORAGE_BACKEND") == "azure" and
            env_value("SALUS_TELEMETRY_BACKEND") == "azure_monitor" and
            env_value("SALUS_AUTH_MODE") == "oidc" and
            env_value("SALUS_OIDC_CLIENT_AUTH_METHOD") == "managed_identity" and
            env_value("SALUS_OIDC_REDIRECT_URI") == "https://salcapa.salus.solutions/api/auth/oidc/callback"
          ' /tmp/salcapa-app.json >/dev/null
          FQDN="$(jq -r '.properties.configuration.ingress.fqdn' /tmp/salcapa-app.json)"
          [[ "$FQDN" == salcapa-dev-b48224.*.southcentralus.azurecontainerapps.io ]]
          URL="https://$FQDN"

          READY=false
          STATUS=000
          for attempt in $(seq 1 30); do
            STATUS="$(curl --connect-timeout 5 --max-time 15 --silent --show-error --output /tmp/salcapa-ready.json --write-out '%{http_code}' "$URL/health/ready" || true)"
            if [ "$STATUS" = "200" ] && python frozen-release/tools/validate_live_readiness.py /tmp/salcapa-ready.json --environment dev >/dev/null 2>&1; then
              READY=true
              break
            fi
            sleep 10
          done
          if [ "$READY" != "true" ]; then
            echo "SalCAPA runtime did not become ready; final HTTP status: $STATUS" >&2
            echo "Revision state summary (governed non-secret fields only):" >&2
            az containerapp revision list \
              --resource-group "$RESOURCE_GROUP" \
              --name "$APP_NAME" \
              --query '[].{name:name,active:properties.active,provisioningState:properties.provisioningState,healthState:properties.healthState,trafficWeight:properties.trafficWeight,replicas:properties.replicas}' \
              --output json \
              --only-show-errors >&2 \
              || true
            echo "Bounded runtime system logs (sensitive values redacted):" >&2
            timeout 45s az containerapp logs show \
              --resource-group "$RESOURCE_GROUP" \
              --name "$APP_NAME" \
              --type system \
              --tail 200 \
              --format json \
              --only-show-errors 2>&1 \
              | sed -E 's/((password|secret|token|connection[_ -]?string)[^:=]*[:=][[:space:]]*)[^[:space:]]+/\1[REDACTED]/Ig' >&2 \
              || true
            echo "Bounded revision-targeted container logs (sensitive values redacted):" >&2
            while IFS= read -r REVISION; do
              test -n "$REVISION" || continue
              REPLICA="$(
                az containerapp replica list \
                  --resource-group "$RESOURCE_GROUP" \
                  --name "$APP_NAME" \
                  --revision "$REVISION" \
                  --query '[0].name' \
                  --output tsv \
                  --only-show-errors 2>/dev/null \
                  || true
              )"
              test -n "$REPLICA" || continue
              echo "Revision $REVISION replica diagnostics:" >&2
              timeout 45s az containerapp logs show \
                --resource-group "$RESOURCE_GROUP" \
                --name "$APP_NAME" \
                --revision "$REVISION" \
                --replica "$REPLICA" \
                --container salcapa \
                --type console \
                --tail 200 \
                --format text \
                --only-show-errors 2>&1 \
                | sed -E 's/((password|secret|token|connection[_ -]?string)[^:=]*[:=][[:space:]]*)[^[:space:]]+/\1[REDACTED]/Ig' >&2 \
                || true
            done < <(
              az containerapp revision list \
                --resource-group "$RESOURCE_GROUP" \
                --name "$APP_NAME" \
                --query '[?properties.replicas > `0`].name' \
                --output tsv \
                --only-show-errors
            )
            exit 1
          fi

          python frozen-release/tools/validate_live_readiness.py /tmp/salcapa-ready.json --environment dev

          curl --connect-timeout 5 --max-time 15 --silent --show-error --dump-header /tmp/salcapa-oidc.headers --output /dev/null "$URL/api/auth/oidc/start"
          OIDC_LOCATION="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]+:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' /tmp/salcapa-oidc.headers)"
          [[ "$OIDC_LOCATION" == "https://login.microsoftonline.com/$EXPECTED_TENANT_ID/oauth2/v2.0/authorize"* ]]
          python - "$OIDC_LOCATION" <<'PY'
          import sys
          from urllib.parse import parse_qs, urlparse
          params = parse_qs(urlparse(sys.argv[1]).query)
          assert params.get("redirect_uri") == ["https://salcapa.salus.solutions/api/auth/oidc/callback"]
          PY

          {
            echo "### SalCAPA development application"
            echo ""
            echo "- URL: $URL"
            echo "- Immutable image: $IMAGE_DIGEST"
            echo "- Runtime authentication: Microsoft Entra OIDC through managed identity"
            echo "- PostgreSQL authentication: Entra only; password authentication disabled"
            echo "- Live dependencies: PostgreSQL, Key Vault, evidence storage, Azure Monitor, rate limiting, and OIDC accepted"
            echo "- HTTPS ingress: required"
            echo "- Minimum replicas: 0"
            echo "- Maximum replicas: 1"
            echo "- Client secret: not used"
            echo "- Custom DNS: not changed"
            echo "- Public production cutover: not performed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore accepted v3.124 if promotion verification fails
        if: failure() && steps.deployment.outcome == 'success'
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          ROLLBACK_IMAGE: ${{ steps.activation.outputs.rollback_image }}
        run: |
          set -euo pipefail
          APP_NAME=salcapa-dev-b48224
          az containerapp update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_NAME" \
            --image "$ROLLBACK_IMAGE" \
            --set-env-vars SALUS_ALLOW_RESTORE=0 SALUS_SEED_DEMO=0 SALUS_ALLOW_SQLITE_PRODUCTION=0 \
            --output none
          for attempt in $(seq 1 30); do
            az containerapp show --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --output json > /tmp/salcapa-rollback.json
            test "$(jq -r '.properties.template.containers[0].image' /tmp/salcapa-rollback.json)" = "$ROLLBACK_IMAGE" || { sleep 10; continue; }
            FQDN="$(jq -r '.properties.configuration.ingress.fqdn' /tmp/salcapa-rollback.json)"
            STATUS="$(curl --connect-timeout 5 --max-time 15 --silent --show-error --output /tmp/salcapa-rollback-ready.json --write-out '%{http_code}' "https://$FQDN/health/ready" || true)"
            if [ "$STATUS" = "200" ] && python accepted-release/tools/validate_live_readiness.py /tmp/salcapa-rollback-ready.json --environment dev >/dev/null 2>&1; then
              {
                echo "### SalCAPA failed promotion rollback"
                echo ""
                echo "- Accepted immutable v3.124 image restored"
                echo "- Live readiness restored"
                echo "- DNS unchanged"
                echo "- Client secret not used"
                echo "PROMOTION_FAILED_ACCEPTED_STATE_RESTORED"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "Failed promotion did not restore the accepted v3.124 runtime." >&2
          exit 1
