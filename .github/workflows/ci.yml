name: CI

on:
  push:
    branches:
      - main
      - development/**
      - candidate/**
      - governance/**
      - release/**
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Reconstruct and verify archived source
        run: |
          if [ ! -f app.py ]; then python tools/reconstruct_v343_source.py; fi
          python tools/verify_v343_source.py
          python tools/reconstruct_salops_preparedness.py
          python tools/reconstruct_personnel_assessment.py
          python tools/reconstruct_salintel_relationships.py
          python tools/reconstruct_salintel_research.py
          python tools/reconstruct_salintel_handoffs.py
          python tools/reconstruct_salcapa_demo_evaluator.py
      - name: Validate release reconstruction entrypoints
        run: python tools/check_release_entrypoints.py
      - name: Verify repository boundary
        run: python tools/check_repository_hygiene.py
      - name: Install application and security test tools
        run: python -m pip install -r requirements.txt -r requirements-ci.txt
      - name: Verify installed dependency consistency
        run: python -m pip check
      - name: Compile Python
        run: python -m py_compile app.py salus_protection_advisor.py protection_advisor_report_contract.py protection_advisor_docx_report.py protection_advisor_report_artifact.py advisor_report_config.py salcapa_m365_advisor_reports.py salcapa_runtime.py salcapa_m365_intake.py salcapa_bulk_delta.py salcapa_zip_members.py salcapa_zip_index.py salcapa_m365_material_ingestion.py salcapa_m365_source_change.py salintel_material_index.py salthira_material_evidence_routing.py salcapa_m365_reports.py salcapa_demo_evaluator.py material_capability.py salintel_domains.py salops_preparedness.py personnel_assessment.py salintel_relationships.py salintel_research.py salintel_handoffs.py database.py portable_backup.py storage.py security_controls.py secret_provider.py rate_limit.py telemetry.py managed_database.py tools/*.py
      - name: Validate JavaScript syntax
        run: node --check static/product-branding.js && node --check static/product-version.js && node --check static/app.js && node --check static/demo-environments.js && node --check static/guidance.js && node --check static/condition-visuals.js && node --check static/intake-capture.js && node --check static/salintel-domains.js && node --check static/personnel-assessment.js && node --check static/salintel-relationships.js && node --check static/salintel-research.js && node --check static/salintel-handoffs.js && node --check static/salcapa-intake-review.js
      - name: Salus brand system acceptance
        run: python tools/ci_brand_system_smoke.py
      - name: Protection Advisor report contract acceptance
        run: PYTHONPATH=. python tools/ci_protection_advisor_report_contract_smoke.py
      - name: Protection Advisor DOCX report acceptance
        run: PYTHONPATH=. python tools/ci_protection_advisor_docx_report_smoke.py
      - name: Protection Advisor review artifact acceptance
        run: PYTHONPATH=. python tools/ci_protection_advisor_report_artifact_smoke.py
      - name: Protection Advisor Microsoft 365 DOCX and PDF acceptance
        run: PYTHONPATH=. python tools/ci_protection_advisor_m365_reports_smoke.py
      - name: Protection Advisor report readiness acceptance
        run: PYTHONPATH=. python tools/ci_advisor_report_config_smoke.py
      - name: Trademark-first product navigation acceptance
        run: python tools/ci_product_branding_smoke.py
      - name: Contextual guidance accessibility acceptance
        run: python tools/ci_guidance_smoke.py
      - name: Condition/readiness visual doctrine acceptance
        run: python tools/ci_condition_visuals_smoke.py
      - name: Governed universal intake surface acceptance
        run: python tools/ci_intake_capture_smoke.py
      - name: SalINTEL Investigative Domains interface acceptance
        run: python tools/ci_salintel_domain_ui_smoke.py
      - name: SalINTEL Personnel Assessment interface acceptance
        run: python tools/ci_personnel_assessment_ui_smoke.py
      - name: SalINTEL relationship interface acceptance
        run: python tools/ci_salintel_relationship_ui_smoke.py
      - name: SalINTEL Chat-led research interface acceptance
        run: python tools/ci_salintel_research_ui_smoke.py
      - name: SalINTEL governed handoff interface acceptance
        run: python tools/ci_salintel_handoffs_ui_smoke.py
      - name: SQLite SalCAPA governed-workflow smoke
        env:
          SALUS_DB_BACKEND: sqlite
          SALUS_DB_PATH: /tmp/salcapa-v26-ci.db
          SALUS_LOCAL_STORAGE_DIR: /tmp/salcapa-v26-ci-attachments
          SALUS_BACKUP_DIR: /tmp/salcapa-v26-ci-backups
          SALUS_AUTH_MODE: prototype
          SALUS_SEED_DEMO: "1"
        run: python tools/ci_v116_smoke.py && python tools/ci_salcapa_smoke.py && python tools/ci_salcapa_v21_smoke.py && python tools/ci_salcapa_v22_smoke.py && python tools/ci_salcapa_v23_smoke.py && python tools/ci_salcapa_v24_smoke.py && python tools/ci_salcapa_v25_smoke.py && python tools/ci_salcapa_v26_smoke.py && python tools/ci_salcapa_v27_smoke.py && python tools/ci_salcapa_v28_smoke.py && python tools/ci_salcapa_v29_smoke.py && python tools/ci_salcapa_operating_model_acceptance.py && python tools/ci_salcapa_v33_identity_smoke.py && python tools/ci_recovery_rehearsal.py && python tools/ci_material_capability_smoke.py && python tools/ci_salintel_domain_smoke.py && python tools/ci_salintel_relationships_smoke.py && python tools/ci_salintel_research_smoke.py && python tools/ci_salintel_handoffs_smoke.py && python tools/ci_salcapa_demo_evaluator_smoke.py && python tools/ci_salus_protection_advisor_policy_models_smoke.py
      - name: Azure database bootstrap contract smoke
        run: python tools/ci_azure_database_bootstrap_smoke.py
      - name: Early-access account administration acceptance
        env:
          SALUS_AUTH_MODE: prototype
          SALUS_SEED_DEMO: "0"
        run: python tools/ci_salcapa_early_access_accounts_smoke.py
      - name: Passwordless runtime secret-path regression smoke
        run: python tools/ci_passwordless_runtime_smoke.py
      - name: Governed Microsoft 365 folder-intake regression smoke
        run: python tools/ci_m365_governed_intake_smoke.py
      - name: Large pending-window pagination regression smoke
        run: python tools/ci_m365_batch_window_smoke.py
      - name: Folder delta capability probe regression smoke
        run: python tools/ci_bulk_delta_probe_smoke.py
      - name: Customer batch staging boundary regression smoke
        run: PYTHONPATH=. python tools/ci_customer_batch_staging_smoke.py
      - name: Checkpointed bulk delta ledger regression smoke
        run: python tools/ci_salcapa_bulk_delta_smoke.py
      - name: M365 scoped queued read regression smoke
        run: python tools/ci_m365_scoped_read_smoke.py
      - name: Bounded ZIP member regression smoke
        run: python tools/ci_salcapa_zip_members_smoke.py
      - name: Resumable ZIP member index regression smoke
        run: python tools/ci_salcapa_zip_index_smoke.py
      - name: Gated ZIP worker integration smoke
        run: python tools/ci_salcapa_bulk_zip_worker_smoke.py
      - name: Governed Microsoft 365 knowledge-promotion regression smoke
        run: python tools/ci_m365_knowledge_promotion_smoke.py
      - name: Gated bulk promotion worker regression smoke
        run: python tools/ci_salcapa_bulk_worker_smoke.py
      - name: Bulk archived extraction retry regression smoke
        run: python tools/ci_salcapa_bulk_extraction_retry_smoke.py
      - name: Archive move crash reconciliation regression smoke
        run: python tools/ci_salcapa_bulk_reconcile_smoke.py

      - name: Governed M365 material persistence regression
        run: python tools/ci_m365_material_ingestion_smoke.py
      - name: Governed M365 extraction lineage and human review
        run: python tools/ci_m365_extraction_lineage_smoke.py

      - name: SalINTEL reviewed-material research index
        run: python tools/ci_salintel_material_index_smoke.py

      - name: SalTHIRA attributed evidence routing
        run: python tools/ci_salthira_material_evidence_routing_smoke.py

      - name: Governed M365 source change and reprocessing
        run: python tools/ci_m365_source_change_reprocessing_smoke.py

      - name: Governed M365 administrator intake review workspace
        run: python tools/ci_m365_intake_review_ui_smoke.py

      - name: Governed post-capture review, indexing, and routing workspace
        run: python tools/ci_v3148_material_governance_ui_smoke.py

      - name: Governed Microsoft 365 report-storage regression smoke
        run: python tools/ci_m365_governed_reports_smoke.py
      - name: Live runtime acceptance contract smoke
        run: python tools/validate_live_readiness.py --self-test
      - name: Security remediation regression smoke
        run: python tools/security_regression_smoke.py
      - name: Readiness disclosure regression smoke
        run: python tools/readiness_security_smoke.py
      - name: Dependency audit
        run: pip-audit -r requirements.txt --progress-spinner off
      - name: Static security scan
        # B608 is excluded after review: interpolated SQL identifiers are selected only
        # from fixed application allowlists or schema-derived column sets; all data values
        # remain bound parameters. Medium/high findings outside these reviewed patterns block CI.
        run: bandit -q -r app.py salus_protection_advisor.py salcapa_runtime.py salcapa_m365_source_change.py salintel_material_index.py salthira_material_evidence_routing.py salcapa_m365_reports.py salcapa_demo_evaluator.py material_capability.py salintel_domains.py salops_preparedness.py personnel_assessment.py salintel_relationships.py salintel_research.py salintel_handoffs.py database.py portable_backup.py storage.py security_controls.py secret_provider.py rate_limit.py telemetry.py managed_database.py tools/azure_database_bootstrap.py -ll -s B608

  postgres-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: salus_thira_ci
          POSTGRES_USER: salus
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U salus -d salus_thira_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Reconstruct and verify archived source
        run: |
          if [ ! -f app.py ]; then python tools/reconstruct_v343_source.py; fi
          python tools/verify_v343_source.py
          python tools/reconstruct_salops_preparedness.py
          python tools/reconstruct_personnel_assessment.py
          python tools/reconstruct_salintel_relationships.py
          python tools/reconstruct_salintel_research.py
          python tools/reconstruct_salintel_handoffs.py
          python tools/reconstruct_salcapa_demo_evaluator.py
      - name: Validate release reconstruction entrypoints
        run: python tools/check_release_entrypoints.py
      - name: Install application
        run: python -m pip install -r requirements.txt
      - name: Verify installed dependency consistency
        run: python -m pip check
      - name: PostgreSQL SalCAPA governed-workflow smoke
        env:
          SALUS_DB_BACKEND: postgres
          SALUS_DATABASE_URL: postgresql://salus@127.0.0.1:5432/salus_thira_ci
          SALUS_AUTH_MODE: prototype
          SALUS_SEED_DEMO: "1"
          SALUS_LOCAL_STORAGE_DIR: /tmp/salcapa-v26-pg-attachments
          SALUS_BACKUP_DIR: /tmp/salcapa-v26-pg-backups
        run: python tools/ci_v116_smoke.py && python tools/ci_salcapa_smoke.py && python tools/ci_salcapa_v21_smoke.py && python tools/ci_salcapa_v22_smoke.py && python tools/ci_salcapa_v23_smoke.py && python tools/ci_salcapa_v24_smoke.py && python tools/ci_salcapa_v25_smoke.py && python tools/ci_salcapa_v26_smoke.py && python tools/ci_salcapa_v27_smoke.py && python tools/ci_salcapa_v28_smoke.py && python tools/ci_salcapa_v29_smoke.py && python tools/ci_salcapa_operating_model_acceptance.py && python tools/ci_salcapa_v33_identity_smoke.py && python tools/ci_recovery_rehearsal.py && python tools/ci_material_capability_smoke.py && python tools/ci_salintel_domain_smoke.py && python tools/ci_salintel_relationships_smoke.py && python tools/ci_salintel_research_smoke.py && python tools/ci_salintel_handoffs_smoke.py && python tools/ci_salcapa_demo_evaluator_smoke.py && python tools/ci_salus_protection_advisor_policy_models_smoke.py
      - name: PostgreSQL bulk delta transaction smoke
        env:
          SALUS_DB_BACKEND: postgres
          SALUS_DATABASE_URL: postgresql://salus@127.0.0.1:5432/salus_thira_ci
        run: python tools/ci_salcapa_bulk_delta_postgres_smoke.py
      - name: PostgreSQL bulk archived extraction retry smoke
        env:
          SALUS_DB_BACKEND: postgres
          SALUS_DATABASE_URL: postgresql://salus@127.0.0.1:5432/salus_thira_ci
        run: python tools/ci_salcapa_bulk_extraction_retry_postgres_smoke.py
      - name: PostgreSQL ZIP member index transaction smoke
        env:
          SALUS_DB_BACKEND: postgres
          SALUS_DATABASE_URL: postgresql://salus@127.0.0.1:5432/salus_thira_ci
        run: python tools/ci_salcapa_zip_index_postgres_smoke.py
      - name: PostgreSQL transaction smoke
        env:
          SALUS_DB_BACKEND: postgres
          SALUS_DATABASE_URL: postgresql://salus@127.0.0.1:5432/salus_thira_ci
          SALUS_AUTH_MODE: prototype
          SALUS_SEED_DEMO: "0"
          SALUS_LOCAL_STORAGE_DIR: /tmp/salcapa-v26-pg-attachments
          SALUS_BACKUP_DIR: /tmp/salcapa-v26-pg-backups
        run: python tools/postgres_runtime_smoke.py

  container-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: salus_thira_container_ci
          POSTGRES_USER: salus
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U salus -d salus_thira_container_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build production container
        run: docker build --tag salcapa:ci .
      - name: Verify non-root runtime and archived source
        run: |
          test "$(docker run --rm salcapa:ci id -u)" = "10001"
          docker run --rm salcapa:ci python tools/verify_v343_source.py
      - name: PDF worker active-feature regression inside production image
        run: docker run --rm salcapa:ci python tools/ci_salcapa_pdf_processing_smoke.py
      - name: Representative M365 multi-format governed-ingestion acceptance
        run: docker run --rm salcapa:ci python tools/ci_m365_multiformat_ingestion_acceptance.py
      - name: SQLite lifecycle smoke inside container
        run: |
          docker run --rm \
            -e SALUS_DB_BACKEND=sqlite \
            -e SALUS_DB_PATH=/app/data/container-v26-ci.db \
            -e SALUS_LOCAL_STORAGE_DIR=/app/attachments \
            -e SALUS_BACKUP_DIR=/app/backups \
            -e SALUS_AUTH_MODE=prototype \
            -e SALUS_SEED_DEMO=1 \
            salcapa:ci sh -c "python tools/ci_v116_smoke.py && python tools/ci_salcapa_smoke.py && python tools/ci_salcapa_v21_smoke.py && python tools/ci_salcapa_v22_smoke.py && python tools/ci_salcapa_v23_smoke.py && python tools/ci_salcapa_v24_smoke.py && python tools/ci_salcapa_v25_smoke.py && python tools/ci_salcapa_v26_smoke.py && python tools/ci_salcapa_v27_smoke.py && python tools/ci_salcapa_v28_smoke.py && python tools/ci_salcapa_v29_smoke.py && python tools/ci_salcapa_operating_model_acceptance.py && python tools/ci_salcapa_v33_identity_smoke.py && python tools/ci_recovery_rehearsal.py && python tools/ci_material_capability_smoke.py && python tools/ci_salintel_domain_smoke.py && python tools/ci_salintel_relationships_smoke.py && python tools/ci_salintel_research_smoke.py && python tools/ci_salintel_handoffs_smoke.py && python tools/ci_salcapa_demo_evaluator_smoke.py && python tools/ci_salus_protection_advisor_policy_models_smoke.py"
      - name: PostgreSQL 16 lifecycle smoke inside container
        run: |
          docker run --rm --network host \
            -e SALUS_DB_BACKEND=postgres \
            -e SALUS_DATABASE_URL=postgresql://salus@127.0.0.1:5432/salus_thira_container_ci \
            -e SALUS_LOCAL_STORAGE_DIR=/app/attachments \
            -e SALUS_BACKUP_DIR=/app/backups \
            -e SALUS_AUTH_MODE=prototype \
            -e SALUS_SEED_DEMO=1 \
            salcapa:ci sh -c "python tools/ci_v116_smoke.py && python tools/ci_salcapa_smoke.py && python tools/ci_salcapa_v21_smoke.py && python tools/ci_salcapa_v22_smoke.py && python tools/ci_salcapa_v23_smoke.py && python tools/ci_salcapa_v24_smoke.py && python tools/ci_salcapa_v25_smoke.py && python tools/ci_salcapa_v26_smoke.py && python tools/ci_salcapa_v27_smoke.py && python tools/ci_salcapa_v28_smoke.py && python tools/ci_salcapa_v29_smoke.py && python tools/ci_salcapa_operating_model_acceptance.py && python tools/ci_salcapa_v33_identity_smoke.py && python tools/ci_recovery_rehearsal.py && python tools/ci_material_capability_smoke.py && python tools/ci_salintel_domain_smoke.py && python tools/ci_salintel_relationships_smoke.py && python tools/ci_salintel_research_smoke.py && python tools/ci_salintel_handoffs_smoke.py && python tools/ci_salcapa_demo_evaluator_smoke.py && python tools/ci_salus_protection_advisor_policy_models_smoke.py"
      - name: Start production command and verify fail-closed readiness
        run: |
          docker run --detach --name salus-container-ci \
            --publish 127.0.0.1:8000:8000 \
            -e SALUS_DB_BACKEND=sqlite \
            -e SALUS_DB_PATH=/app/data/readiness.db \
            -e SALUS_LOCAL_STORAGE_DIR=/app/attachments \
            -e SALUS_BACKUP_DIR=/app/backups \
            -e SALUS_AUTH_MODE=prototype \
            -e SALUS_SEED_DEMO=0 \
            salcapa:ci
          trap 'docker rm --force salus-container-ci >/dev/null 2>&1 || true' EXIT
          status=000
          for attempt in $(seq 1 30); do
            status=$(curl --silent --show-error --output /tmp/salus-ready.json \
              --write-out '%{http_code}' http://127.0.0.1:8000/health/ready || true)
            if [ "$status" = "200" ] || [ "$status" = "503" ]; then
              break
            fi
            sleep 2
          done
          export SALUS_READY_STATUS="$status"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          status = os.environ['SALUS_READY_STATUS']
          if status not in {'200', '503'}:
              raise SystemExit(f'Container readiness endpoint was unreachable: HTTP {status}')
          payload = json.loads(Path('/tmp/salus-ready.json').read_text())
          if not isinstance(payload, dict) or not payload:
              raise SystemExit('Container readiness endpoint returned an invalid contract')
          serialized = json.dumps(payload).lower()
          forbidden = ('traceback', 'exception', 'password', 'token', 'postgresql://')
          if any(value in serialized for value in forbidden):
              raise SystemExit('Container readiness response disclosed diagnostic detail')
          print(f'CONTAINER_READINESS_PASS HTTP {status}')
          PY
