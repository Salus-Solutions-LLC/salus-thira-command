name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Reconstruct archived source when needed
        run: |
          if [ ! -f app.py ] && [ -f tools/reconstruct_v07_source.py ]; then python tools/reconstruct_v07_source.py; fi
      - name: Install application and security test tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit bandit
      - name: Compile Python
        run: python -m py_compile app.py storage.py security_controls.py secret_provider.py rate_limit.py telemetry.py managed_database.py tools/*.py
      - name: Validate JavaScript syntax
        run: node --check static/app.js
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - name: Static security scan
        run: bandit -q -r app.py storage.py security_controls.py secret_provider.py rate_limit.py telemetry.py managed_database.py -s B603,B607
