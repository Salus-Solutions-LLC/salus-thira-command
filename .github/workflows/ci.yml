name: CI

on:
  push:
    branches:
      - main
      - 'development/**'
      - 'governance/**'
      - 'release/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Reconstruct and verify archived source
        run: |
          if [ ! -f app.py ]; then python tools/reconstruct_v13_source.py; fi
          python tools/verify_v13_source.py
      - name: Install application and security test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pip-audit bandit
      - name: Compile Python
        run: python -m py_compile app.py database.py portable_backup.py storage.py security_controls.py secret_provider.py rate_limit.py telemetry.py managed_database.py tools/*.py
      - name: Validate JavaScript syntax
        run: node --check static/app.js
      - name: SQLite release lifecycle smoke
        env:
          SALUS_DB_BACKEND: sqlite
          SALUS_DB_PATH: /tmp/salus-v13-ci.db
          SALUS_LOCAL_STORAGE_DIR: /tmp/salus-v13-ci-attachments
          SALUS_BACKUP_DIR: /tmp/salus-v13-ci-backups
          SALUS_AUTH_MODE: prototype
          SALUS_SEED_DEMO: '1'
        run: python tools/ci_v13_smoke.py
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - name: Static security scan
        # B608 is reviewed: interpolated SQL identifiers come only from fixed
        # allowlists/schema columns; record values remain bound parameters.
        run: bandit -q -r app.py database.py portable_backup.py storage.py security_controls.py secret_provider.py rate_limit.py telemetry.py managed_database.py -ll -s B608

  postgres-runtime:
    name: postgres-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: salus_thira_ci
          POSTGRES_USER: salus
          POSTGRES_PASSWORD: salus-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U salus -d salus_thira_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Reconstruct and verify archived source
        run: |
          if [ ! -f app.py ]; then python tools/reconstruct_v13_source.py; fi
          python tools/verify_v13_source.py
      - name: Install application
        run: python -m pip install -r requirements.txt
      - name: PostgreSQL release lifecycle smoke
        env:
          SALUS_DB_BACKEND: postgres
          SALUS_DATABASE_URL: postgresql://salus:salus-ci-password@127.0.0.1:5432/salus_thira_ci
          SALUS_AUTH_MODE: prototype
          SALUS_SEED_DEMO: '1'
          SALUS_LOCAL_STORAGE_DIR: /tmp/salus-v13-pg-attachments
          SALUS_BACKUP_DIR: /tmp/salus-v13-pg-backups
        run: python tools/ci_v13_smoke.py
      - name: PostgreSQL transaction smoke
        env:
          SALUS_DB_BACKEND: postgres
          SALUS_DATABASE_URL: postgresql://salus:salus-ci-password@127.0.0.1:5432/salus_thira_ci
          SALUS_AUTH_MODE: prototype
          SALUS_SEED_DEMO: '0'
          SALUS_LOCAL_STORAGE_DIR: /tmp/salus-v13-pg-attachments
          SALUS_BACKUP_DIR: /tmp/salus-v13-pg-backups
        run: python tools/postgres_runtime_smoke.py
