name: CI

on:
  push:
    branches:
      - main
      - development/**
      - governance/**
      - release/**
      - validation/**
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Reconstruct and verify archived source
        run: |
          if [ ! -f app.py ]; then python tools/reconstruct_v14_source.py; fi
          python tools/verify_v14_source.py
      - name: Verify repository boundary
        run: python tools/check_repository_hygiene.py
      - name: Install application and security test tools
        run: python -m pip install -r requirements.txt -r requirements-ci.txt
      - name: Verify installed dependency consistency
        run: python -m pip check
      - name: Compile Python
        run: python -m py_compile app.py database.py portable_backup.py storage.py security_controls.py secret_provider.py rate_limit.py telemetry.py managed_database.py tools/*.py
      - name: Validate JavaScript syntax
        run: node --check static/app.js
      - name: SQLite release lifecycle smoke
        env:
          SALUS_DB_BACKEND: sqlite
          SALUS_DB_PATH: /tmp/salus-v14-ci.db
          SALUS_LOCAL_STORAGE_DIR: /tmp/salus-v14-ci-attachments
          SALUS_BACKUP_DIR: /tmp/salus-v14-ci-backups
          SALUS_AUTH_MODE: prototype
          SALUS_SEED_DEMO: "1"
        run: python tools/ci_v14_smoke.py
      - name: Dependency audit
        run: pip-audit -r requirements.txt --progress-spinner off
      - name: Static security scan
        # B608 is excluded after review: interpolated SQL identifiers are selected only
        # from fixed application allowlists or schema-derived column sets; all data values
        # remain bound parameters. Medium/high findings outside these reviewed patterns block CI.
        run: bandit -q -r app.py database.py portable_backup.py storage.py security_controls.py secret_provider.py rate_limit.py telemetry.py managed_database.py -ll -s B608

  postgres-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: salus_thira_ci
          POSTGRES_USER: salus
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U salus -d salus_thira_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Reconstruct and verify archived source
        run: |
          if [ ! -f app.py ]; then python tools/reconstruct_v14_source.py; fi
          python tools/verify_v14_source.py
      - name: Install application
        run: python -m pip install -r requirements.txt
      - name: Verify installed dependency consistency
        run: python -m pip check
      - name: PostgreSQL release lifecycle smoke
        env:
          SALUS_DB_BACKEND: postgres
          SALUS_DATABASE_URL: postgresql://salus@127.0.0.1:5432/salus_thira_ci
          SALUS_AUTH_MODE: prototype
          SALUS_SEED_DEMO: "1"
          SALUS_LOCAL_STORAGE_DIR: /tmp/salus-v14-pg-attachments
          SALUS_BACKUP_DIR: /tmp/salus-v14-pg-backups
        run: python tools/ci_v14_smoke.py
      - name: PostgreSQL transaction smoke
        env:
          SALUS_DB_BACKEND: postgres
          SALUS_DATABASE_URL: postgresql://salus@127.0.0.1:5432/salus_thira_ci
          SALUS_AUTH_MODE: prototype
          SALUS_SEED_DEMO: "0"
          SALUS_LOCAL_STORAGE_DIR: /tmp/salus-v14-pg-attachments
          SALUS_BACKUP_DIR: /tmp/salus-v14-pg-backups
        run: python tools/postgres_runtime_smoke.py
