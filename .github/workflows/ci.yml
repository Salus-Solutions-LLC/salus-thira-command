name: CI

on:
  push:
    branches:
      - main
      - development/**
      - governance/**
      - release/**
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Reconstruct and verify archived source
        run: |
          if [ ! -f app.py ]; then python tools/reconstruct_v28_source.py; fi
          python tools/verify_v28_source.py
      - name: Validate release reconstruction entrypoints
        run: python tools/check_release_entrypoints.py
      - name: Verify repository boundary
        run: python tools/check_repository_hygiene.py
      - name: Install application and security test tools
        run: python -m pip install -r requirements.txt -r requirements-ci.txt
      - name: Verify installed dependency consistency
        run: python -m pip check
      - name: Compile Python
        run: python -m py_compile app.py database.py portable_backup.py storage.py security_controls.py secret_provider.py rate_limit.py telemetry.py managed_database.py tools/*.py
      - name: Validate JavaScript syntax
        run: node --check static/app.js
      - name: SQLite SalCAPA governed-workflow smoke
        env:
          SALUS_DB_BACKEND: sqlite
          SALUS_DB_PATH: /tmp/salcapa-v26-ci.db
          SALUS_LOCAL_STORAGE_DIR: /tmp/salcapa-v26-ci-attachments
          SALUS_BACKUP_DIR: /tmp/salcapa-v26-ci-backups
          SALUS_AUTH_MODE: prototype
          SALUS_SEED_DEMO: "1"
        run: python tools/ci_v116_smoke.py && python tools/ci_salcapa_smoke.py && python tools/ci_salcapa_v21_smoke.py && python tools/ci_salcapa_v22_smoke.py && python tools/ci_salcapa_v23_smoke.py && python tools/ci_salcapa_v24_smoke.py && python tools/ci_salcapa_v25_smoke.py && python tools/ci_salcapa_v26_smoke.py && python tools/ci_salcapa_v27_smoke.py && python tools/ci_salcapa_v28_smoke.py
      - name: Security remediation regression smoke
        run: python tools/security_regression_smoke.py
      - name: Readiness disclosure regression smoke
        run: python tools/readiness_security_smoke.py
      - name: Dependency audit
        run: pip-audit -r requirements.txt --progress-spinner off
      - name: Static security scan
        # B608 is excluded after review: interpolated SQL identifiers are selected only
        # from fixed application allowlists or schema-derived column sets; all data values
        # remain bound parameters. Medium/high findings outside these reviewed patterns block CI.
        run: bandit -q -r app.py database.py portable_backup.py storage.py security_controls.py secret_provider.py rate_limit.py telemetry.py managed_database.py -ll -s B608

  postgres-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: salus_thira_ci
          POSTGRES_USER: salus
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U salus -d salus_thira_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Reconstruct and verify archived source
        run: |
          if [ ! -f app.py ]; then python tools/reconstruct_v28_source.py; fi
          python tools/verify_v28_source.py
      - name: Validate release reconstruction entrypoints
        run: python tools/check_release_entrypoints.py
      - name: Install application
        run: python -m pip install -r requirements.txt
      - name: Verify installed dependency consistency
        run: python -m pip check
      - name: PostgreSQL SalCAPA governed-workflow smoke
        env:
          SALUS_DB_BACKEND: postgres
          SALUS_DATABASE_URL: postgresql://salus@127.0.0.1:5432/salus_thira_ci
          SALUS_AUTH_MODE: prototype
          SALUS_SEED_DEMO: "1"
          SALUS_LOCAL_STORAGE_DIR: /tmp/salcapa-v26-pg-attachments
          SALUS_BACKUP_DIR: /tmp/salcapa-v26-pg-backups
        run: python tools/ci_v116_smoke.py && python tools/ci_salcapa_smoke.py && python tools/ci_salcapa_v21_smoke.py && python tools/ci_salcapa_v22_smoke.py && python tools/ci_salcapa_v23_smoke.py && python tools/ci_salcapa_v24_smoke.py && python tools/ci_salcapa_v25_smoke.py && python tools/ci_salcapa_v26_smoke.py && python tools/ci_salcapa_v27_smoke.py && python tools/ci_salcapa_v28_smoke.py
      - name: PostgreSQL transaction smoke
        env:
          SALUS_DB_BACKEND: postgres
          SALUS_DATABASE_URL: postgresql://salus@127.0.0.1:5432/salus_thira_ci
          SALUS_AUTH_MODE: prototype
          SALUS_SEED_DEMO: "0"
          SALUS_LOCAL_STORAGE_DIR: /tmp/salcapa-v26-pg-attachments
          SALUS_BACKUP_DIR: /tmp/salcapa-v26-pg-backups
        run: python tools/postgres_runtime_smoke.py

  container-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: salus_thira_container_ci
          POSTGRES_USER: salus
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U salus -d salus_thira_container_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build production container
        run: docker build --tag salcapa:ci .
      - name: Verify non-root runtime and archived source
        run: |
          test "$(docker run --rm salcapa:ci id -u)" = "10001"
          docker run --rm salcapa:ci python tools/verify_v28_source.py
      - name: SQLite lifecycle smoke inside container
        run: |
          docker run --rm \
            -e SALUS_DB_BACKEND=sqlite \
            -e SALUS_DB_PATH=/app/data/container-v26-ci.db \
            -e SALUS_LOCAL_STORAGE_DIR=/app/attachments \
            -e SALUS_BACKUP_DIR=/app/backups \
            -e SALUS_AUTH_MODE=prototype \
            -e SALUS_SEED_DEMO=1 \
            salcapa:ci sh -c "python tools/ci_v116_smoke.py && python tools/ci_salcapa_smoke.py && python tools/ci_salcapa_v21_smoke.py && python tools/ci_salcapa_v22_smoke.py && python tools/ci_salcapa_v23_smoke.py && python tools/ci_salcapa_v24_smoke.py && python tools/ci_salcapa_v25_smoke.py && python tools/ci_salcapa_v26_smoke.py && python tools/ci_salcapa_v27_smoke.py && python tools/ci_salcapa_v28_smoke.py"
      - name: PostgreSQL 16 lifecycle smoke inside container
        run: |
          docker run --rm --network host \
            -e SALUS_DB_BACKEND=postgres \
            -e SALUS_DATABASE_URL=postgresql://salus@127.0.0.1:5432/salus_thira_container_ci \
            -e SALUS_LOCAL_STORAGE_DIR=/app/attachments \
            -e SALUS_BACKUP_DIR=/app/backups \
            -e SALUS_AUTH_MODE=prototype \
            -e SALUS_SEED_DEMO=1 \
            salcapa:ci sh -c "python tools/ci_v116_smoke.py && python tools/ci_salcapa_smoke.py && python tools/ci_salcapa_v21_smoke.py && python tools/ci_salcapa_v22_smoke.py && python tools/ci_salcapa_v23_smoke.py && python tools/ci_salcapa_v24_smoke.py && python tools/ci_salcapa_v25_smoke.py && python tools/ci_salcapa_v26_smoke.py && python tools/ci_salcapa_v27_smoke.py && python tools/ci_salcapa_v28_smoke.py"
      - name: Start production command and verify fail-closed readiness
        run: |
          docker run --detach --name salus-container-ci \
            --publish 127.0.0.1:8000:8000 \
            -e SALUS_DB_BACKEND=sqlite \
            -e SALUS_DB_PATH=/app/data/readiness.db \
            -e SALUS_LOCAL_STORAGE_DIR=/app/attachments \
            -e SALUS_BACKUP_DIR=/app/backups \
            -e SALUS_AUTH_MODE=prototype \
            -e SALUS_SEED_DEMO=0 \
            salcapa:ci
          trap 'docker rm --force salus-container-ci >/dev/null 2>&1 || true' EXIT
          status=000
          for attempt in $(seq 1 30); do
            status=$(curl --silent --show-error --output /tmp/salus-ready.json \
              --write-out '%{http_code}' http://127.0.0.1:8000/health/ready || true)
            if [ "$status" = "200" ] || [ "$status" = "503" ]; then
              break
            fi
            sleep 2
          done
          export SALUS_READY_STATUS="$status"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          status = os.environ['SALUS_READY_STATUS']
          if status not in {'200', '503'}:
              raise SystemExit(f'Container readiness endpoint was unreachable: HTTP {status}')
          payload = json.loads(Path('/tmp/salus-ready.json').read_text())
          if not isinstance(payload, dict) or not payload:
              raise SystemExit('Container readiness endpoint returned an invalid contract')
          serialized = json.dumps(payload).lower()
          forbidden = ('traceback', 'exception', 'password', 'token', 'postgresql://')
          if any(value in serialized for value in forbidden):
              raise SystemExit('Container readiness response disclosed diagnostic detail')
          print(f'CONTAINER_READINESS_PASS HTTP {status}')
          PY
