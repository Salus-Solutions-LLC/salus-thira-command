name: SalOPS Autonomous Plan Assembly

on:
  push:
    branches: [development/salcapa-platform]
    paths:
      - 'salops_plan_assembly.py'
      - 'salcapa_runtime.py'
      - 'source_archives/development/salops_plan_assembly.py.gz'
      - 'source_archives/development/ci_salops_plan_assembly_smoke.py.gz'
      - 'source_archives/development/ci_salops_plan_assembly_ui_smoke.py.gz'
      - 'source_archives/development/salops-plan-assembly.js.gz'
      - 'source_archives/development/salops-plan-assembly.css.gz'
      - 'tools/reconstruct_salops_plan_assembly.py'
      - 'tools/ci_salops_plan_assembly_smoke.py'
      - 'tools/ci_salops_plan_assembly_ui_smoke.py'
      - 'static/salops-plan-assembly.js'
      - 'static/salops-plan-assembly.css'
      - '.github/workflows/salops-plan-assembly.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Reconstruct governed sources
        run: |
          python tools/reconstruct_v343_source.py
          python tools/reconstruct_salops_preparedness.py
          python tools/reconstruct_personnel_assessment.py
          python tools/reconstruct_salintel_relationships.py
          python tools/reconstruct_salintel_research.py
          python tools/reconstruct_salintel_handoffs.py
          python tools/reconstruct_facility_assessment.py
          python tools/reconstruct_salintel_monitoring.py
          python tools/reconstruct_salcapa_assurance.py
          python tools/reconstruct_salcapa_contextual_guidance.py
          python tools/reconstruct_salops_plan_assembly.py
      - name: Install application and security tools
        run: python -m pip install -r requirements.txt -r requirements-ci.txt
      - name: Compile autonomous planning capability
        run: python -m py_compile salops_plan_assembly.py salcapa_runtime.py tools/ci_salops_plan_assembly_smoke.py tools/ci_salops_plan_assembly_ui_smoke.py
      - name: Validate plan-assembly interface JavaScript
        run: node --check static/salops-plan-assembly.js
      - name: Plan-assembly interface acceptance
        run: python tools/ci_salops_plan_assembly_ui_smoke.py
      - name: Static security scan
        run: bandit -q -r salops_plan_assembly.py salcapa_runtime.py -ll -s B608
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - name: SQLite autonomous planning acceptance
        run: python tools/ci_salops_plan_assembly_smoke.py

  postgres16:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: salcapa_plan_assembly_ci
          POSTGRES_USER: salus
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U salus -d salcapa_plan_assembly_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Reconstruct governed sources
        run: |
          python tools/reconstruct_v343_source.py
          python tools/reconstruct_salops_preparedness.py
          python tools/reconstruct_personnel_assessment.py
          python tools/reconstruct_salintel_relationships.py
          python tools/reconstruct_salintel_research.py
          python tools/reconstruct_salintel_handoffs.py
          python tools/reconstruct_facility_assessment.py
          python tools/reconstruct_salintel_monitoring.py
          python tools/reconstruct_salcapa_assurance.py
          python tools/reconstruct_salcapa_contextual_guidance.py
          python tools/reconstruct_salops_plan_assembly.py
      - name: Install application
        run: python -m pip install -r requirements.txt
      - name: PostgreSQL 16 autonomous planning acceptance
        env:
          SALUS_DB_BACKEND: postgres
          SALUS_DATABASE_URL: postgresql://salus@127.0.0.1:5432/salcapa_plan_assembly_ci
          SALUS_AUTH_MODE: prototype
          SALUS_SEED_DEMO: '1'
          SALUS_LOCAL_STORAGE_DIR: /tmp/plan-assembly-pg-attachments
          SALUS_BACKUP_DIR: /tmp/plan-assembly-pg-backups
        run: python tools/ci_salops_plan_assembly_smoke.py

  production-container:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build production container
        run: docker build --tag salops-plan-assembly:ci .
      - name: Run autonomous planning acceptance in container
        run: |
          docker run --rm \
            -e SALUS_DB_BACKEND=sqlite \
            -e SALUS_DB_PATH=/app/data/plan-assembly-container.db \
            -e SALUS_LOCAL_STORAGE_DIR=/app/attachments \
            -e SALUS_BACKUP_DIR=/app/backups \
            -e SALUS_AUTH_MODE=prototype \
            -e SALUS_SEED_DEMO=1 \
            salops-plan-assembly:ci sh -c 'python tools/ci_salops_plan_assembly_smoke.py && python tools/ci_salops_plan_assembly_ui_smoke.py'
