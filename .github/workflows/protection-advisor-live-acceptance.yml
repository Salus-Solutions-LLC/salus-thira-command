name: Protection Advisor live acceptance

on:
  push:
    branches:
      - development/salcapa-platform
    paths:
      - 'deploy/azure/activations/application-dev.json'
      - 'tools/live_public_protection_advisor_acceptance.sh'
      - '.github/workflows/protection-advisor-live-acceptance.yml'

permissions:
  contents: read

concurrency:
  group: protection-advisor-live-acceptance-dev
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: salcapa-dev-approval
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify exact deployed activation under acceptance
        run: |
          set -euo pipefail
          jq -e '
            (.activation_key == "salcapa-v3.122-application-e84e19d7") and
            (.source_release == "release/v3.122") and
            (.source_commit == "e84e19d77cef1b39d605260ae2fbe836e95888e4") and
            (.image_digest == "salcapadevb48224acr.azurecr.io/salcapa@sha256:7088640e7b42a2005f01000f04bf004b241e7e045b11414adbdb53d725f65ef9") and
            (.rollback_release == "release/v3.121") and
            (.rollback_commit == "f0cee634a93cecb4ee298b53edadcaa9c4034a6e") and
            (.rollback_image_digest == "salcapadevb48224acr.azurecr.io/salcapa@sha256:218e6bd6d3b134615e9a0df8c293435eb40fb61e980ed22ec1c053ac016bd2c6")
          ' deploy/azure/activations/application-dev.json >/dev/null

      - name: Exercise public consent, account, resume, package, and review handoff
        env:
          PROTECTION_ADVISOR_BASE_URL: https://salcapa-dev-b48224.ashycoast-29444a28.southcentralus.azurecontainerapps.io
        run: bash tools/live_public_protection_advisor_acceptance.sh
