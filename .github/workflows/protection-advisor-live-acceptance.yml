name: Protection Advisor live acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - development/salcapa-platform
    paths:
      - .github/workflows/protection-advisor-live-acceptance.yml

permissions:
  contents: read

concurrency:
  group: protection-advisor-live-acceptance-dev
  cancel-in-progress: false

jobs:
  acceptance:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       fromJSON(github.run_attempt) == 1 &&
       (startsWith(github.event.head_commit.message, 'Merge pull request #787 ') ||
        startsWith(github.event.head_commit.message, 'Merge pull request #812 ')))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: salcapa-dev-approval
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact deployed activation under acceptance
        run: |
          set -euo pipefail
          ACTIVATION=deploy/azure/activations/application-dev.json
          jq -e '
            type == "object" and
            (.schema_version == 1) and
            (.operation == "deploy_application") and
            (.target_environment == "dev") and
            (.approval_record == "MD-APPROVAL-AZURE-LEAN-20260904") and
            (.source_release | test("^release/v3\\.[0-9]+$")) and
            (.source_commit | test("^[0-9a-f]{40}$")) and
            (.image_digest | test("^salcapadevb48224acr\\.azurecr\\.io/salcapa@sha256:[0-9a-f]{64}$")) and
            (.rollback_release | test("^release/v3\\.[0-9]+$")) and
            (.rollback_commit | test("^[0-9a-f]{40}$")) and
            (.rollback_image_digest | test("^salcapadevb48224acr\\.azurecr\\.io/salcapa@sha256:[0-9a-f]{64}$")) and
            (.source_release != .rollback_release) and
            (.source_commit != .rollback_commit) and
            (.image_digest != .rollback_image_digest)
          ' "$ACTIVATION" >/dev/null

          SOURCE_RELEASE="$(jq -r '.source_release' "$ACTIVATION")"
          SOURCE_COMMIT="$(jq -r '.source_commit' "$ACTIVATION")"
          ROLLBACK_COMMIT="$(jq -r '.rollback_commit' "$ACTIVATION")"
          EXPECTED_KEY="salcapa-${SOURCE_RELEASE#release/}-application-${SOURCE_COMMIT:0:8}"
          test "$(jq -r '.activation_key' "$ACTIVATION")" = "$EXPECTED_KEY"
          git cat-file -e "$SOURCE_COMMIT^{commit}"
          git cat-file -e "$ROLLBACK_COMMIT^{commit}"
          git merge-base --is-ancestor "$SOURCE_COMMIT" "$GITHUB_SHA"
          git merge-base --is-ancestor "$ROLLBACK_COMMIT" "$GITHUB_SHA"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Install pinned PDF structure reader
        run: python -m pip install --disable-pip-version-check pypdf==6.21.1

      - name: Exercise public consent, account, resume, package, and review handoff
        env:
          PROTECTION_ADVISOR_BASE_URL: https://salcapa-dev-b48224.ashycoast-29444a28.southcentralus.azurecontainerapps.io
          PROTECTION_ADVISOR_FICTIONAL_REPORT_EXPORT_DIR: ${{ runner.temp }}/advisor-fictional-report
        run: |
          set -euo pipefail
          SOURCE_RELEASE="$(jq -r '.source_release' deploy/azure/activations/application-dev.json)"
          EXPECTED_VERSION="${SOURCE_RELEASE#release/v}"
          curl --connect-timeout 10 --max-time 30 --fail --silent --show-error \
            "$PROTECTION_ADVISOR_BASE_URL/api/system/mode" > /tmp/salcapa-advisor-mode.json
          test "$(jq -r '.version' /tmp/salcapa-advisor-mode.json)" = "$EXPECTED_VERSION"
          bash tools/live_public_protection_advisor_acceptance.sh

      - name: Retain fictional PDF outputs for qualified review
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fictional-protection-advisor-pdfs
          path: ${{ runner.temp }}/advisor-fictional-report/*.pdf
          if-no-files-found: error
          retention-days: 1

      - name: Remove local fictional PDF copies
        if: always()
        run: rm -rf -- "${{ runner.temp }}/advisor-fictional-report"
