name: Protection Advisor live acceptance

on:
  push:
    branches:
      - development/salcapa-platform
    paths:
      - 'deploy/azure/activations/application-dev.json'
      - 'tools/live_public_protection_advisor_acceptance.sh'
      - '.github/workflows/protection-advisor-live-acceptance.yml'

permissions:
  contents: read

concurrency:
  group: protection-advisor-live-acceptance-dev
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: salcapa-dev-approval
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify exact deployed activation under acceptance
        run: |
          set -euo pipefail
          jq -e '
            (.activation_key == "salcapa-v3.121-application-f0cee634") and
            (.source_release == "release/v3.121") and
            (.source_commit == "f0cee634a93cecb4ee298b53edadcaa9c4034a6e") and
            (.image_digest == "salcapadevb48224acr.azurecr.io/salcapa@sha256:218e6bd6d3b134615e9a0df8c293435eb40fb61e980ed22ec1c053ac016bd2c6") and
            (.rollback_release == "release/v3.120") and
            (.rollback_commit == "feffb4644368c77c7c55ce613b1177d235474356") and
            (.rollback_image_digest == "salcapadevb48224acr.azurecr.io/salcapa@sha256:7c4759a126a57fbd8646b4e2b5b95ad73ca3c411d0dec063538ce98b8c623008")
          ' deploy/azure/activations/application-dev.json >/dev/null

      - name: Exercise public consent, account, resume, package, and review handoff
        env:
          PROTECTION_ADVISOR_BASE_URL: https://salcapa-dev-b48224.ashycoast-29444a28.southcentralus.azurecontainerapps.io
        run: bash tools/live_public_protection_advisor_acceptance.sh
