name: Protection Advisor live acceptance

on:
  push:
    branches:
      - development/salcapa-platform
    paths:
      - 'deploy/azure/activations/application-dev.json'
      - 'tools/live_public_protection_advisor_acceptance.sh'
      - '.github/workflows/protection-advisor-live-acceptance.yml'

permissions:
  contents: read

concurrency:
  group: protection-advisor-live-acceptance-dev
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: salcapa-dev-approval
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify exact deployed activation under acceptance
        run: |
          set -euo pipefail
          jq -e '
            (.activation_key == "salcapa-v3.132-application-19f982ef") and
            (.source_release == "release/v3.132") and
            (.source_commit == "19f982efb2da33c0575552a583bc6a1167132eef") and
            (.image_digest == "salcapadevb48224acr.azurecr.io/salcapa@sha256:d4182967666ad1692ec6d518cf1b8f4630a82c987dc91f4bac0401df897d50b5") and
            (.rollback_release == "release/v3.131") and
            (.rollback_commit == "c6df4fc72faad59e671c45a3002e7bc7eea26aaa") and
            (.rollback_image_digest == "salcapadevb48224acr.azurecr.io/salcapa@sha256:ea22197908cc7b588ad7a6072f0e8637b193d2a2b2f94c1478c4688b1454e349")
          ' deploy/azure/activations/application-dev.json >/dev/null

      - name: Exercise public consent, account, resume, package, and review handoff
        env:
          PROTECTION_ADVISOR_BASE_URL: https://salcapa-dev-b48224.ashycoast-29444a28.southcentralus.azurecontainerapps.io
        run: bash tools/live_public_protection_advisor_acceptance.sh
