services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: salus_thira
      POSTGRES_USER: salus
      POSTGRES_PASSWORD: ${SALUS_LOCAL_POSTGRES_PASSWORD:-change-this-local-dev-password}
    volumes:
      - thira_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salus -d salus_thira"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  thira-command:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      SALUS_DB_BACKEND: postgres
      SALUS_DATABASE_URL: postgresql://salus:${SALUS_LOCAL_POSTGRES_PASSWORD:-change-this-local-dev-password}@postgres:5432/salus_thira
      SALUS_SEED_DEMO: ${SALUS_SEED_DEMO:-1}
      SALUS_LOCAL_STORAGE_DIR: /app/attachments
      SALUS_BACKUP_DIR: /app/backups
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - thira_attachments:/app/attachments
      - thira_backups:/app/backups
    restart: unless-stopped

volumes:
  thira_postgres_data:
  thira_attachments:
  thira_backups:
